services:
  l4d2:
    build:
      context: ../
      dockerfile: infra/l4d2/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - 27015:27015/tcp
      - 27015:27015/udp

    env_file:
      - .env.l4d2

    volumes:
      - /storage/app-data/l4d2/:/l4d2/server/
