# Forwards the Chrome DevTools Protocol out of the container. Chromium only
# binds --remote-debugging-port to 127.0.0.1 (it ignores
# --remote-debugging-address outside headless mode), so this server block
# relays it on 9223, which infra/browser.yml publishes to the host's loopback
# as 127.0.0.1:9222.
#
# The Host header is pinned because Chrome rejects DevTools requests whose
# Host isn't localhost or an IP. It also makes /json/version advertise
# ws://127.0.0.1:9222/..., which is exactly the host-side address.
server {
  listen 9223;

  location / {
    proxy_pass http://127.0.0.1:9222;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9222;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
  }
}
