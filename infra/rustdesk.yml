x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbs
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
    volumes:
      - /storage/app-data/rustdesk:/root
    depends_on:
      - rustdesk-hbbr

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 21117:21117
    volumes:
      - /storage/app-data/rustdesk:/root
