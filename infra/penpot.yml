# Penpot (https://penpot.app) — self-hosted design & prototyping tool.
# Adapted from the official compose file
# (https://github.com/penpot/penpot/blob/main/docker/images/docker-compose.yaml)
# with the bundled Traefik and mailcatcher dropped.
#
# Auth: lilnas-auth gates penpot.lilnas.io at the proxy. Penpot has no
# trusted-header / proxy-auth mode (its only login methods are password,
# LDAP, OIDC and expiring demo users), so its own login can't be turned
# off. Instead, public registration is disabled and accounts are created
# from the CLI; the Penpot session cookie is long-lived, so it's a
# one-time sign-in per browser behind lilnas-auth:
#
#   docker-compose exec penpot-backend python3 manage.py create-profile
#
# Only penpot-frontend (nginx, :8080) is exposed — it proxies the API,
# exporter and /ws/notifications websocket to the other containers over
# the private `penpot` network.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-flags: &penpot-flags
  # No SMTP is configured, so email verification must stay off or new
  # profiles could never activate. prepl-server is what manage.py talks to.
  PENPOT_FLAGS: disable-registration disable-email-verification enable-prepl-server enable-admin-console

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: https://penpot.lilnas.io

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

x-database: &penpot-database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot

services:
  penpot-frontend:
    image: penpotapp/frontend:2.18
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /storage/app-data/penpot/assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-admin-console
      - penpot-mcp
      - penpot-exporter
    networks:
      - penpot
      - lilnas-proxy
    environment:
      <<: [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
    labels:
      - traefik.enable=true
      - traefik.docker.network=lilnas-proxy
      - traefik.http.routers.penpot.rule=Host(`penpot.lilnas.io`)
      - traefik.http.routers.penpot.entrypoints=websecure
      - traefik.http.routers.penpot.tls.certresolver=le
      - traefik.http.routers.penpot.middlewares=lilnas-auth
      - traefik.http.services.penpot.loadbalancer.server.port=8080

  penpot-backend:
    image: penpotapp/backend:2.18
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /storage/app-data/penpot/assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    # PENPOT_SECRET_KEY, PENPOT_DATABASE_PASSWORD
    env_file:
      - .env.penpot
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-database]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: 'false'

  penpot-admin-console:
    image: penpotapp/admin-console:2.18
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      penpot-postgres:
        condition: service_healthy
    networks:
      - penpot
    env_file:
      - .env.penpot
    environment:
      <<: [*penpot-public-uri, *penpot-database]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080

  penpot-mcp:
    image: penpotapp/mcp:2.18
    restart: unless-stopped
    logging: *default-logging
    networks:
      - penpot

  penpot-exporter:
    image: penpotapp/exporter:2.18
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    env_file:
      - .env.penpot
    environment:
      <<: [*penpot-flags, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *default-logging
    stop_signal: SIGINT
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U penpot']
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - /storage/app-data/penpot/postgres:/var/lib/postgresql/data
    networks:
      - penpot
    # POSTGRES_PASSWORD
    env_file:
      - .env.penpot
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep PONG']
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    environment:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu

networks:
  penpot:
  lilnas-proxy:
    external: true
