global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['storage:9000']

  - job_name: minio-bucket
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ['storage:9000']

  - job_name: tdr-bot
    metrics_path: /metrics
    static_configs:
      - targets: ['tdr-bot:8081']

  - job_name: equations
    metrics_path: /metrics
    static_configs:
      - targets: ['equations:8080']

  - job_name: download
    metrics_path: /metrics
    static_configs:
      - targets: ['download:8081']

  - job_name: me-token-tracker
    metrics_path: /metrics
    static_configs:
      - targets: ['me-token-tracker:8080']

  # The exporter polls smartctl every 60s, so scraping faster adds nothing.
  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ['smartctl-exporter:9633']

  # Exportarr polls the *arr and SABnzbd APIs on each scrape, so 60s is plenty.
  - job_name: sonarr
    scrape_interval: 60s
    static_configs:
      - targets: ['exportarr-sonarr:9707']

  - job_name: radarr
    scrape_interval: 60s
    static_configs:
      - targets: ['exportarr-radarr:9708']

  - job_name: sabnzbd
    scrape_interval: 60s
    static_configs:
      - targets: ['exportarr-sabnzbd:9709']

  # Needs IMMICH_TELEMETRY_INCLUDE=all on the immich service (infra/immich.yml).
  # The API worker serves metrics on 8081, the microservices worker on 8082.
  - job_name: immich
    static_configs:
      - targets: ['immich:8081']
        labels:
          component: api
      - targets: ['immich:8082']
        labels:
          component: microservices

  # One postgres_exporter per Postgres server; the server label names the
  # database container. Reports pg_up 0 until postgres-monitor-roles.sh has
  # created the lilnas_monitor role on that server.
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter-tdr-bot:9187']
        labels:
          server: tdr-bot-db
      - targets: ['postgres-exporter-icloud-backup:9187']
        labels:
          server: icloud-backup-db
      - targets: ['postgres-exporter-immich:9187']
        labels:
          server: immich-database
