# One-shot cleanup for the removed nexus-code alerting. Deleting a provisioning
# file does not delete what it provisioned from Grafana's database, so this
# deletes the rules and the tdr-bot contact point and resets the notification
# policy tree to Grafana's default.
#
# Remove this file once Grafana has started with it once: whether deleting
# already-deleted resources is a no-op is undocumented, and a provisioning
# error on a later boot would stop Grafana from starting.
apiVersion: 1

deleteRules:
  - orgId: 1
    uid: nexus-daemon-down
  - orgId: 1
    uid: nexus-watchdog-restart
  - orgId: 1
    uid: nexus-watchdog-stale
  - orgId: 1
    uid: nexus-native-watcher-error
  - orgId: 1
    uid: nexus-unpatched-binding
  - orgId: 1
    uid: nexus-fswatch-degraded
  - orgId: 1
    uid: nexus-fswatch-lost-not-recovered
  - orgId: 1
    uid: nexus-eventloop-lag
  - orgId: 1
    uid: nexus-inotify-fd-leak
  - orgId: 1
    uid: nexus-open-fds-high

deleteContactPoints:
  - orgId: 1
    uid: tdr-bot-alerts

resetPolicies:
  - 1
