server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels:
          ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels:
          ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            logger: context
      - labels:
          level:
          logger:

  # nexus-code daemon (host process): NDJSON log. Tail only the live file,
  # never a glob. Rotation renames it to .01-.05, and a glob would re-ingest
  # each rotated file as a new stream.
  - job_name: nexus-code
    static_configs:
      - targets: [localhost]
        labels:
          job: nexus-code
          host: lilnas
          __path__: /host/tmp/nexus-code/nexus-server.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            ns: ns
            ts: ts
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          level:
          ns:
