x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  yacht:
    image: selfhostedpro/yacht:sha-dd5058b
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISABLE_AUTH: true
    volumes:
      - /storage/app-data/yacht:/config
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - traefik.enable=true
      - traefik.http.services.yacht.loadbalancer.server.port=8000
      - traefik.http.routers.yacht.rule=Host(`yacht.lilnas.io`)
      - traefik.http.routers.yacht.entrypoints=websecure
      - traefik.http.routers.yacht.tls.certresolver=le
      - traefik.http.routers.yacht.middlewares=lilnas-auth

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /storage/app-data/prometheus:/prometheus
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.lilnas.io`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=le
      - traefik.http.routers.prometheus.middlewares=lilnas-auth
      - traefik.http.services.prometheus.loadbalancer.server.port=9090

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_AUTH_DISABLE_LOGIN_FORM: false
      GF_SECURITY_ALLOW_EMBEDDING: true
      GF_SERVER_ROOT_URL: https://grafana.lilnas.io
      GF_AUTH_PROXY_ENABLED: true
      GF_AUTH_PROXY_HEADER_NAME: X-Forwarded-User
      GF_AUTH_PROXY_HEADER_PROPERTY: email
      GF_AUTH_PROXY_AUTO_SIGN_UP: true
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
    volumes:
      - /storage/app-data/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.lilnas.io`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.routers.grafana.middlewares=lilnas-auth
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - /storage/app-data/loki:/loki

  alloy:
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /storage/app-data/alloy:/var/lib/alloy/data
      # Host journal (sshd, sudo, sshguard, dockerd, kernel) for
      # loki.source.journal. machine-id tells journald which directory under
      # /var/log/journal belongs to this host. See docs/logging.md.
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
      - node-exporter-textfile:/textfile:ro
    pid: host

  # Writes the /storage/<name> symlink map for node-exporter's textfile
  # collector, so the Storage dashboard labels mounts by name.
  storage-volumes:
    image: busybox:1.37.0
    restart: unless-stopped
    logging: *default-logging
    init: true
    entrypoint: ['/bin/sh', '/storage-volumes.sh']
    volumes:
      - ./monitoring/storage-volumes.sh:/storage-volumes.sh:ro
      - /storage:/storage:ro
      - node-exporter-textfile:/textfile

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro

volumes:
  node-exporter-textfile:
