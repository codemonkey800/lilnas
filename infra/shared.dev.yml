x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  storage:
    # pgsty/minio was renamed Silo (same S3 API, MINIO_* env vars and on-disk
    # format); the old name stopped at RELEASE.2026-08-04.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped
    logging: *default-logging
    command: server --console-address ":9001" /data
    env_file:
      - .env.storage.decrypted
    volumes:
      # Never prod's /storage/app-data/minio: two servers on one data dir
      # corrupt it, and storage-init would rewrite prod bucket policies. Dev
      # apps that need real data reach prod storage over the shared network.
      - /storage/app-data/minio-dev:/data
      - ./init-minio.sh:/opt/init-minio.sh
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true

      # API Access
      - traefik.http.routers.storage.rule=Host(`storage.localhost`)
      - traefik.http.routers.storage.service=storage
      - traefik.http.services.storage.loadbalancer.server.port=9000

      # Dashboard
      - traefik.http.routers.storage-admin.rule=Host(`storage-admin.localhost`)
      - traefik.http.routers.storage-admin.service=storage-admin
      - traefik.http.services.storage-admin.loadbalancer.server.port=9001

  storage-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      storage:
        condition: service_healthy
    env_file:
      - .env.storage.decrypted
    volumes:
      - ./init-minio.sh:/init-minio.sh
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    restart: "no"
    logging: *default-logging
