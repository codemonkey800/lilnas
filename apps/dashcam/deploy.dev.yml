services:
  dashcam:
    image: lilnas-dev
    command: -c "pnpm --filter=dashcam dev"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../../:/source
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashcam.rule=Host(`dashcam.localhost`)
      - traefik.http.services.dashcam.loadbalancer.server.port=8080
