# Host-level dev tooling, deployed like everything else from the root
# docker-compose.yml:
#
#   docker-compose up -d --build dev-idle-reaper
#   docker-compose logs -f dev-idle-reaper
#
# Stops+removes idle dev containers -- see reaper.sh for the full rules:
#   - Enrolled automatically if a Traefik router rule targets *.dev.lilnas.io,
#     or explicitly with lilnas.idle-reap.enabled=true.
#   - Opt out with lilnas.idle-reap.enabled=false (on any container in the
#     project, for whole-project units).
#   - Idle limit per container: lilnas.idle-reap.max-idle-hours (default 6).
#   - Compose projects under DEV_PROJECTS_ROOT are reaped whole (sidecars
#     too); everything else, including this repo, one container at a time.
#   - Never touches lilnas-traefik / lilnas-auth, whatever their labels say.
#
# Needs read-write access to the Docker socket to stop/rm containers -- see
# reaper.sh for exactly what it does with that access (inspect/stats/stop/rm
# against enrolled containers and their project siblings, nothing else).

services:
  dev-idle-reaper:
    build: .
    container_name: lilnas-dev-idle-reaper
    restart: unless-stopped
    environment:
      - POLL_INTERVAL_SECONDS=300
      - DEFAULT_MAX_IDLE_HOURS=6
      - ACTIVITY_BYTES_THRESHOLD=1024
      - DEV_PROJECTS_ROOT=/home/jeremy/dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dev-idle-reaper-state:/var/lib/reaper

volumes:
  dev-idle-reaper-state:
