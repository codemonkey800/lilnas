services:
  auth:
    build:
      context: ../..
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    # Matches apps/swole/deploy.yml's SQLite-flush convention: give the
    # process up to 30s before SIGKILL on `docker-compose down` / a rolling
    # restart. NOTE: unlike swole, this app has no explicit SIGTERM/shutdown
    # hook yet (Nest's app.enableShutdownHooks() was not wired in this unit —
    # not requested, and better-sqlite3's WAL mode is crash-safe regardless).
    # The grace period is harmless either way; wiring an actual graceful
    # shutdown hook is worth doing once there's more in-flight state to lose
    # — see apps/swole/src/instrumentation.ts for the pattern.
    stop_grace_period: 30s
    env_file:
      - .env.prod
    environment:
      - DATABASE_PATH=/data/lilnas-auth.db
    volumes:
      # Host directory must be owned by UID 1000 (the `node` user inside the
      # container). On a fresh host run:
      #   sudo chown 1000:1000 /storage/app-data/lilnas-auth
      # Without this, better-sqlite3 throws SQLITE_CANTOPEN on first boot and
      # the container restarts forever. database.module.ts's openSqlite()
      # catches this and prints this same diagnostic (mirrors
      # apps/swole/src/db/client.ts's identical guard).
      - /storage/app-data/lilnas-auth:/data
      # Per-file, read-only compose-label discovery for the service
      # registry (src/services/service-registry.service.ts) — an adaptation
      # of getHostsFromFiles() from apps/portal/src/utils/hosts.ts,
      # deliberately file-based rather than the Docker socket (a docker.sock
      # mount would grant this internet-facing container effective host
      # root). Only `labels:` are ever read from these files, but each
      # deploy.yml sits alongside that app's own .env.prod on the deploy
      # host, and infra/ holds several real secret files
      # (.env.storage, .env.forward-auth, etc.) — a directory-level mount of
      # either tree would make every one of those readable from inside this
      # container if it were ever compromised (e.g. an admin-UI RCE). Each
      # compose file this app's registry actually scans is mounted
      # individually instead, so no other file in apps/ or infra/ — secret
      # or otherwise — is ever reachable through this container's
      # filesystem. src/services/__tests__/compose-mount-coverage.spec.ts
      # fails the build if a new apps/*/deploy.yml or infra/*.yml is added
      # here without a matching line below. Docker creates the intermediate
      # /repo/apps/<name>/ and /repo/infra/ directories for these file
      # mounts automatically, so scanServiceRegistry()'s own directory
      # listing needs no code change.
      - ../../infra/design.yml:/repo/infra/design.yml:ro
      - ../../infra/files.yml:/repo/infra/files.yml:ro
      - ../../infra/immich.yml:/repo/infra/immich.yml:ro
      - ../../infra/l4d2.yml:/repo/infra/l4d2.yml:ro
      - ../../infra/media.yml:/repo/infra/media.yml:ro
      - ../../infra/minecraft.yml:/repo/infra/minecraft.yml:ro
      - ../../infra/monitoring.yml:/repo/infra/monitoring.yml:ro
      - ../../infra/nexus-code-mbp.yml:/repo/infra/nexus-code-mbp.yml:ro
      - ../../infra/nexus-code.yml:/repo/infra/nexus-code.yml:ro
      - ../../infra/palworld.yml:/repo/infra/palworld.yml:ro
      - ../../infra/proxy.yml:/repo/infra/proxy.yml:ro
      - ../../infra/shared.yml:/repo/infra/shared.yml:ro
      - ../../apps/auth/deploy.yml:/repo/apps/auth/deploy.yml:ro
      - ../../apps/dashcam/deploy.yml:/repo/apps/dashcam/deploy.yml:ro
      - ../../apps/download/deploy.yml:/repo/apps/download/deploy.yml:ro
      - ../../apps/equations/deploy.yml:/repo/apps/equations/deploy.yml:ro
      - ../../apps/me-token-tracker/deploy.yml:/repo/apps/me-token-tracker/deploy.yml:ro
      - ../../apps/portal/deploy.yml:/repo/apps/portal/deploy.yml:ro
      - ../../apps/swole/deploy.yml:/repo/apps/swole/deploy.yml:ro
      - ../../apps/tdr-bot/deploy.yml:/repo/apps/tdr-bot/deploy.yml:ro
      - ../../apps/tdr-code/deploy.yml:/repo/apps/tdr-code/deploy.yml:ro
    # Probes Nest's /health on :8081 directly — deliberately NOT Next's
    # :8080. A dead/crashed Next process must never restart this container,
    # because a restart would also interrupt /verify (once U5 exists) for
    # every migrated service. Verified directly (not just assumed from
    # docs): SIGKILL-ing the next-server process inside a running container
    # left dist/main (Nest) running, /health still returning 200, and the
    # container's Docker health status still "healthy" — run-p (used by
    # package.json's start/dev:start scripts) does not tear down surviving
    # siblings when one process dies.
    healthcheck:
      test: ['CMD-SHELL', 'node -e "const h=require(''http'');h.get(''http://localhost:8081/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      # UI-only router — deliberately no ForwardAuth middleware of its own,
      # since lilnas-auth is where users sign in and can't gate itself
      # behind the same auth it provides. `auth.lilnas.io` is this
      # service's permanent hostname, taken over from
      # thomseddon/traefik-forward-auth's own router once that service was
      # retired (see docs/archive/runbooks/lilnas-auth-cutover.md). The explicit
      # priority sidesteps Traefik's undefined tiebreak between two
      # byte-identical Host() rules during the brief window where both the
      # old and new containers could otherwise be registered at once.
      - traefik.http.routers.auth.rule=Host(`auth.lilnas.io`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls.certresolver=le
      - traefik.http.routers.auth.priority=1000
      - traefik.http.services.auth.loadbalancer.server.port=8080
