services:
  me-token-tracker:
    image: ghcr.io/codemonkey800/lilnas-me-token-tracker:${LILNAS_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/me-token-tracker/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.prod.decrypted
