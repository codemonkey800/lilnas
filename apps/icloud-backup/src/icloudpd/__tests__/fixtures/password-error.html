<form
  hx-post="/password"
  hx-swap="outerHTML"
  class="row align-items-center"
  hx-target-error="#toast-content"
>
  <fieldset>
    <legend>Authentication - nobody@example.invalid</legend>
    <ul class="list-group list-group-flush">
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
      >
        <div class="fw-bold">Invalid password</div>
      </li>
    </ul>
    <div class="col-12 mb-3">
      <label for="password" class="form-label"
        >Password for nobody@example.invalid</label
      >
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Enter password"
      />
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
  </fieldset>
</form>
