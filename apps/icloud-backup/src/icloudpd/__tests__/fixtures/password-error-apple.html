<form
  hx-post="/password"
  hx-swap="outerHTML"
  class="row align-items-center"
  hx-target-error="#toast-content"
>
  <fieldset>
    <legend>Authentication - nobody-t30@example.invalid</legend>

    <ul class="list-group list-group-flush">
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
      >
        <div class="fw-bold">
          (&#39;Invalid email/password combination.&#39;,
          PyiCloudAPIResponseException(&#39;{\n &#34;serviceErrors&#34; : [ {\n
          &#34;code&#34; : &#34;-20101&#34;,\n &#34;message&#34; : &#34;Check
          the account information you entered and try again.&#34;,\n
          &#34;suppressDismissal&#34; : false\n } ]\n} (401)&#39;))
        </div>
      </li>
    </ul>

    <div class="col-12 mb-3">
      <label for="password" class="form-label"
        >Password for nobody-t30@example.invalid</label
      >
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Enter password"
      />
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
  </fieldset>
</form>
