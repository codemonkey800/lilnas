# Explicit project name: pins the Compose project to `lilnas` regardless of the
# checkout directory, so the same project is managed from `/opt/lilnas` (CI
# push-to-deploy) and `/home/jeremy/lilnas` (manual) without Compose deriving
# a different name and recreating every container.
name: lilnas

include:
  # Infrastructure services
  - ./infra/browser.yml
  - ./infra/design.yml
  - ./infra/files.yml
  # `${DB_*}` in immich.yml interpolate from the include's env file, which
  # defaults to the encrypted `infra/.env`; point it at the plaintext sibling.
  - path: ./infra/immich.yml
    env_file: ./infra/.env.decrypted
  - ./infra/l4d2.yml
  - ./infra/media.yml
  - ./infra/minecraft.yml
  - ./infra/monitoring.yml
  - ./infra/nexus-code-work.yml
  - ./infra/work-docs.yml
  - path: ./infra/nexus-code.yml
    env_file: ./infra/.env.nexus-code.decrypted
  - ./infra/palworld.yml
  - ./infra/proxy.yml
  - ./infra/rustdesk.yml
  - ./infra/shared.yml
  - ./infra/valheim.yml

  # App services
  - ./apps/portal/deploy.yml
  - ./apps/dashcam/deploy.yml
  - ./apps/dev-idle-reaper/deploy.yml
  - ./apps/download/deploy.yml
  - ./apps/equations/deploy.yml
  - ./apps/auth/deploy.yml
  - ./apps/me-token-tracker/deploy.yml
  - ./apps/tdr-bot/deploy.yml
  - ./apps/tdr-code/deploy.yml
  - ./apps/theater/deploy.yml
