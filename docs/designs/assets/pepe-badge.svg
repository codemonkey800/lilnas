<!--
  pepe-badge — the lilnas doorplate / avatar / favicon mark.

  DERIVED FROM apps/auth/public/sad-pepe.svg, NOT REDRAWN. Recipe:
    1. drop the 9 stroke-only detail paths (fill="none") — those hairlines
       are what turned the mark to mud below ~32px
    2. drop stroke/stroke-width from the remaining 15 filled shapes
    3. crop the viewBox from "0 0 338 309" to a square on the face, which
       roughly doubles the effective scale of the eyes and lips
    4. add a full-bleed #5a8d3e backdrop so the head silhouette can't leave a
       notch when the mark is masked into a circular badge

  Path geometry is untouched — same character, not a lookalike.
  Legible to ~20px at 1x and ~16px at 2x. Use sad-pepe.svg itself at 40px+.
-->
