  de-duplicated by meaning. Where two apps drew the same thing, the 16-grid
  version won (download/dev), because most screens use it; auth's 20-grid line
  icons (stroke 1.6) fill the gaps. `i-info` and `i-more` are new. Colour
  comes from `currentColor`; size comes from the call site.

                anything <= 32px
