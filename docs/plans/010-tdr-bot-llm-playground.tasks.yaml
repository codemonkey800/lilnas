        model: frontier
        status: done
        commit: 20b453d13263c684c91539f1f8bbd1f9c061f193
        body: |-
          Create `apps/tdr-bot/src/emojis/emoji-analysis.ts`: pure functions, no Nest,
          Node or discord.js imports (the Next.js client bundle imports it too), and a
          Jest spec `apps/tdr-bot/src/emojis/__tests__/emoji-analysis.test.ts`.

          ```ts
          export interface CustomEmojiRef {
            raw: string      // '<a:peepoWine:1266528661318926369>'
            name: string
            id: string
            animated: boolean
            start: number    // offset of raw in the input
            end: number
          }
          export type ContentSegment =
            | { kind: 'text'; text: string }
            | { kind: 'emoji'; emoji: CustomEmojiRef }
          /** Splits text into plain runs and custom-emoji tokens, in order; no empty text runs. */
          export function segmentCustomEmojis(text: string): ContentSegment[]

          export type HallucinationReason = 'unknown' | 'name-mismatch' | 'animated-mismatch'
          export interface EmojiAnalysis {
            counts: { dictionary: number; hallucinated: number; unicode: number; shortcode: number }
            dictionary: CustomEmojiRef[]
            hallucinated: (CustomEmojiRef & { reason: HallucinationReason })[]
            unicode: string[]     // each matched unicode emoji sequence
            shortcodes: string[]  // bare ':name:' occurrences, name only
          }
          /** dictionaryKeys are the prompt's keys: '<:name:id>' / '<a:name:id>'. */
          export function analyzeEmojis(text: string, dictionaryKeys: Iterable<string>): EmojiAnalysis
          /** '5 dictionary · 1 hallucinated · 2 unicode · 0 shortcode' */
          export function formatEmojiScore(counts: EmojiAnalysis['counts']): string
          ```

          Rules:
          - Custom emoji token: `<(a?):([A-Za-z0-9_]{2,32}):(\d{17,20})>`. A token
            whose exact raw text is a dictionary key is `dictionary`. Otherwise it is
            `hallucinated` with reason `name-mismatch` when the id exists in the
            dictionary under another name, `animated-mismatch` when name and id match
            but the `a` prefix differs, else `unknown`. Parse keys with the same
            regex; ignore keys that don't parse.
          - Shortcodes are scanned only in the text segments (never inside a custom
            token): `:name:` where name is `[A-Za-z][A-Za-z0-9_]{1,31}` and the
            colons are not adjacent to another `:` or word character, so `12:30:45`,
            `https://x`, and `<:EZ:1>` are not shortcodes.
          - Unicode emoji: `\p{Extended_Pictographic}` sequences with optional
            `\p{Emoji_Modifier}`, U+FE0F, and ZWJ-joined pictographs, plus regional
            indicator pairs; exclude U+00A9, U+00AE, U+2122 (©®™ are pictographic by
            property). Count each sequence once (`👨‍👩‍👧` is one, `👍🏽` is one).
          - Every count equals its list's length; the same emoji used twice counts
            twice; text with none returns zero counts and empty lists; empty text is
            fine.
          Tests cover: each classification with the reason, both animated forms, a
            reply with all four kinds at once, segment offsets round-trip (joining
            segments reproduces the input), the shortcode negatives above, the
            unicode cases above, and `formatEmojiScore` wording for 0/1/many.
