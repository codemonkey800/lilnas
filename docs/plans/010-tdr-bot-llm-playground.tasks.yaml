        body: |-
          Create `apps/tdr-bot/src/components/DiscordContent.tsx` (`'use client'`) and
          `apps/tdr-bot/src/queries/useEmojiLookup.ts`, then use the renderer in the
          Transcript's `Item` (`apps/tdr-bot/src/app/transcript/page.tsx`, the
          `Typography` that prints `item.message.content` with `whiteSpace:
          'pre-wrap'`), for both human and assistant bubbles. Tool `<pre>` blocks stay
          as they are. Full Discord markdown is out of scope: emojis only.

          ```ts
          // useEmojiLookup.ts: wraps useEmojis() (src/queries/useEmojis.ts)
          export interface EmojiLookup { byId: Map<string, EmojiView>; isLoading: boolean }
          export function useEmojiLookup(): EmojiLookup

          // DiscordContent.tsx
          export interface DiscordContentProps { text: string; lookup?: EmojiLookup; sx?: SxProps<Theme>; variant?: TypographyProps['variant'] }
          export function DiscordContent(props: DiscordContentProps): JSX.Element
          ```
          Behaviour: `segmentCustomEmojis(text)` from `src/emojis/emoji-analysis.ts`;
          text runs render as-is inside a `Typography` with `whiteSpace: 'pre-wrap'`
          and `overflowWrap: 'anywhere'` (same as today); each emoji token renders a
          `<Box component="img">` from `https://cdn.discordapp.com/emojis/<id>.<png|gif>`
          (gif when the token is animated; prefer `lookup.byId.get(id).imageUrl` when
          known), `height: '1.375em', width: 'auto', verticalAlign: 'middle'`,
          `alt=':name:'`, `title` = the raw token, `loading="lazy"`. When `lookup` is
          given and loaded and the id is not in `byId`, render the raw token text in a
          `Chip`-like inline span with a dashed `error.main` outline and `title="Not in
          the emoji dictionary"`; a known but deleted row renders the image at 0.5
          opacity. With no `lookup` (or while loading) every token renders as an
          image. If the image fails to load (`onError`), fall back to the raw token
          text. `DiscordContent` calls no hooks that need the lookup itself; the page
          calls `useEmojiLookup()` once and passes it down. In the Transcript, call
          `useEmojiLookup()` in `TranscriptPage` and thread it to `Item`.
          Note `next/no-img-element`: either use `Box component="img"` with an
          `eslint-disable-next-line` and a comment (the CDN host isn't configured for
          `next/image`) or whatever the Emojis page's `EmojiImage` already does that
          lint accepts; the result must lint clean.
          No Jest test (tsx); the tokenizer is tested in its own spec. Run the
          Transcript's existing spec to confirm nothing else changed.
