  - key: '4'
    name: Adopt the existing icloud and icloud-mom libraries
    tasks:
      - id: T22
        title: 'Path rewrite for the two existing Immich libraries: script and rehearsal on a copy'
        after:
          - T21
        files:
          - apps/icloud-backup/scripts/immich-path-rewrite/
        status: todo
        body: |-
          Two folders of iCloud photos predate this service: `/storage/photos/icloud` (Immich
          library "Jeremy iCloud", import path `/icloud`, about 18,316 assets) and
          `/storage/photos/icloud-mom` ("Mom's iCloud", `/icloud-mom`, about 20,322). They will be
          moved to `/storage/photos/icloud-users/<folder>`, which Immich already mounts at
          `/icloud-users`. Immich must then know every asset under its new path without re-importing
          it, so faces, albums and favourites survive. That means editing Immich's database
          (v3.3.4), which Immich does not support. This task writes the edit and proves it on a copy.
          It changes nothing in production.

          Known from a read-only look at the production database on 2026-11-19: paths are in
          `asset."originalPath"`, `asset_file.path` (one `sidecar` row under `/icloud`),
          `integrity_report.path` (two rows) and `library."importPaths"` (a text array).
          Thumbnails, previews and encoded videos live under `/usr/src/app/upload` and are not
          affected. External assets have `"checksumAlgorithm" = 'sha1-path'`: the checksum is
          derived from the path, and there is a unique index on
          `("ownerId", "libraryId", checksum)`. Find the exact formula in the server image
          (`docker run --rm --entrypoint sh ghcr.io/immich-app/immich-server:v3.3.4 -c 'grep -rn "sha1-path" /usr/src/app/server/dist --include=*.js | head -40'`
          and follow it to where the hash is computed), then confirm it reproduces the stored
          checksum of existing rows before trusting it.

          Write in `apps/icloud-backup/scripts/immich-path-rewrite/`:
          - `rewrite.sql`: psql variables `old_prefix`, `new_prefix`, `library_id`,
            `expected_assets`. One transaction that, for that library only: checks the asset count
            equals `expected_assets` and that every asset path starts with `old_prefix || '/'`;
            rewrites `originalPath`, recomputes `checksum`, rewrites matching `asset_file.path` and
            `integrity_report.path`, replaces the library's `importPaths` with `{new_prefix}`; then
            checks no row of that library still starts with the old prefix, the count is unchanged,
            and no asset of another library changed. Any failed check raises and rolls back. A
            second run is refused by the first check, not silently repeated. Match the prefix as
            `old_prefix || '/'` so `/icloud` never matches `/icloud-mom` or `/icloud-users`.
          - `rehearse.sh`: dumps the production database read-only
            (`docker exec lilnas-immich-database-1 pg_dump` with the container's own credentials,
            never printed) to a mode-600 file under `/storage/workspace/icloud-adoption-rehearsal/`,
            restores it into a throwaway container of the same Postgres image as `infra/immich.yml`
            (own network, no ports, name prefix `icloud-adoption-`), runs `rewrite.sql` for both
            libraries with placeholder folders `rehearsal-a` and `rehearsal-b`, and prints the
            checks below.
          - `README.md`: the real procedure, in order, with the rollback: restore the dump taken
            just before, move the folders back, start Immich.

          Run the rehearsal and report: the checksum formula and how many existing rows it
          reproduces (must be all of them in both libraries); asset counts per library before and
          after; zero paths left under the old prefixes; the other libraries' rows unchanged; no
          duplicate under the unique index; the sidecar and integrity rows moved; a second run
          refused. Then start a throwaway `immich-server:v3.3.4` against the rewritten copy with a
          temp folder holding three files at the new path of one library, scan it, and report
          whether Immich kept the existing asset ids for those three paths (no new asset created for
          them). Remove every container, network, volume and the dump, and show they are gone.

          Anything that does not hold goes under `defects:`. Do not touch
          `lilnas-immich-database-1` beyond the read-only dump.
      - id: H7
        title: 'Go/no-go: move the two existing libraries, and choose the folder names'
        after:
          - T22
        files: []
        status: todo
        body: |-
          Read the rehearsal report above. If it has no defect, decide two things and write them in
          your approval note:

          1. The folder name for each library under `/storage/photos/icloud-users/`. Use the part
             before `@` of the lilnas (Google) email each person signs in with, lower-cased, for
             example `jeremy=jane.doe mom=mary.doe`. Only the folder names are needed, not the full
             addresses. The name is what links a person to their library: when they first sign in
             on icloud-backup, it looks for the folder named after their lilnas email and for the
             Immich user with that same email, and carries on from what is there. So each person's
             lilnas email must be the email of the Immich user that owns their library. Both
             owners have Gmail addresses in Immich today (checked 2026-11-19); if your mom signs
             in to lilnas with a different address, change her email in Immich (Administration,
             Users) before approving.
          2. That now is a good time: Immich will be down for about 15 minutes, the deploy at the
             end also restarts auth (sign-ins fail for about 10 seconds), and the next two steps
             need you at a terminal with sudo.
      - id: T23
        title: 'Prepare the move: database backup, mount removal commit, command sheet'
        after:
          - H7
        files:
          - infra/immich.yml
        status: todo
        body: |-
          A human approved moving `/storage/photos/icloud` and `/storage/photos/icloud-mom` into
          `/storage/photos/icloud-users/` and wrote the two folder names in the approval note above
          (`jeremy=<folder>` and `mom=<folder>`). If the names are missing, or do not match
