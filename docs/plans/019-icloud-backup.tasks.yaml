          in React state that renders, with `set(password)`, `take(): string | null` (returns it and
          clears it) and `clear()`. It exists so a password typed before a wait for the sign-in turn
          can be sent when the turn comes. It is cleared on unmount.

          `src/lib/step.ts`: `stepFor(view): StepName`, a pure function choosing the screen:
          ```ts
          type StepName = 'preflight' | 'sign_in' | 'waiting_turn' | 'code' | 'checking'
            | 'queued' | 'indexing' | 'downloading' | 'finishing' | 'done'
