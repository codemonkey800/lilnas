        status: todo
        body: |-
          Postgres through drizzle, in `apps/icloud-backup/src/db/` only. `DbModule` (already
          imported by `app.module.ts`) becomes global and exports `DbService` and the repositories.

          `schema.ts`:
          ```ts
          accounts: id uuid pk, lilnasUserId text unique, lilnasEmail text, slug text unique,
            appleId text unique null, immichUserId text null, immichLibraryId text null,
            immichEmail text null, immichCreatedByUs boolean default false,
            totalItems int default 0, totalBytes bigint default 0,
            lastBackupAt timestamptz null, createdAt, updatedAt
          jobs: id uuid pk, accountId fk, kind text, state text, authError text null,
            totalItems int null, downloadedItems int default 0, skippedItems int default 0,
            downloadedBytes bigint default 0, currentFile text null, attempt int default 0,
            retryAt timestamptz null, errorCode text null, errorDetail text null,
            startedAt, finishedAt null, updatedAt
          jobEvents: id bigserial pk, jobId fk, at timestamptz, type text, message text
          ```
          A partial unique index allows one non-terminal job per account (terminal states are `done`,
          `needs_login`, `paused_low_disk`, `failed`, `cancelled`). No column ever holds a password,
          a code or a cookie.

          `DbService`: a `pg` pool from the `POSTGRES_*` env (as `apps/tdr-bot/src/db/pool-config.ts`),
          `drizzle(pool, { schema })`, closes the pool on destroy. In `onModuleInit` it applies the
          migrations from `<cwd>/src/db/migrations` and throws on failure so the process exits.
          Generate the first migration with `pnpm --filter @lilnas/icloud-backup db:generate` and
          commit it with its `meta/`.

          Repositories take the drizzle database by injection token, typed loosely enough that a
          PGlite database (`drizzle-orm/pglite`) fits in tests:
          ```ts
          AccountsRepo: findByLilnasUserId, findById, list,
            create({ lilnasUserId, lilnasEmail, slug }), setAppleId, setImmich({ userId, libraryId, email, createdByUs }), addTotals, slugExists
          JobsRepo: create, findActiveForAccount, findLatestForAccount, findNonTerminal,
            update(id, patch), finish(id, state, errorCode?, errorDetail?)
          JobEventsRepo: append(jobId, type, message), tail(jobId, limit)
          ```
          `slugFromEmail(email, prefix)` in `slug.ts`: the part before `@`, lower-cased, every
          character outside `[a-z0-9._-]` replaced by `-`, leading and trailing `.` and `-` removed,
          at most 40 characters, `user` if nothing is left, then the prefix in front.
          `AccountsRepo.create` retries with `-2`, `-3`, … when another account already has the
          slug. Only accounts count: a folder of that name already on disk is not a collision
          (a person's photos may have been moved there before their first sign-in).

          Tests (PGlite with the real migration files, no server): the migration applies to an empty
          database; slug cleaning (dots kept, `+tag` and spaces replaced, empty local part, 60
          characters cut to 40, prefix); two people with the same local part get `name` and `name-2`;
          a second non-terminal job for one account is refused and a new one is allowed after the
          first finishes; the same Apple ID on two accounts is refused; `findNonTerminal` returns
          only non-terminal jobs; `errorDetail` longer than 2000 characters is cut.
      - id: T6
        title: 'icloudpd engine: process runner, login-form client, log parser'
        after:
          - T4
        files:
          - apps/icloud-backup/src/icloudpd/
        status: todo
        body: |-
          Everything that touches the icloudpd binary, in `apps/icloud-backup/src/icloudpd/` only.
          `IcloudpdModule` exports the three services. Nothing here knows about the database or jobs.

          Facts measured on 1.33.1 (2026-11-19):
          - Flags `--password-provider webui --mfa-provider webui` start a web server on port 8080,
            all interfaces, not configurable. `GET /status` returns an HTML fragment for the current
            step; `POST /password` takes form field `password`; `POST /code` takes field `code`;
            `POST /cancel` exists.
          - Seen fragments: a form with `hx-post="/password"`; text `Status: CHECKING_PASSWORD`; a
            form with `hx-post="/code"`; `Status: CHECKING_MFA`; a card reading "No input is needed".
          - The server accepts `POST /code` during the password step and treats it as the answer.
            Always read `/status` first and post only to the endpoint of the step it shows.
          - From the source, not yet seen live: a wrong code sets the error text "Failed to verify
            two-factor authentication code" and shows the code form again; an error during the
            password check moves the status to "no input needed". Treat both as unverified.
          - Log lines at `--log-level info`: `Two-factor authentication is required (2fa)`,
            `Great, you're all set up. The script can now be run without user interaction until 2FA expires.`,
            `Downloading N original photos and videos to /… ...` (N is the total),
            `Downloaded <absolute path>` per file, `All photos and videos have been downloaded`,
            `Apple iCloud Photo Library has not finished indexing yet` (then exit 0 with nothing
            downloaded).
          - Without the webui flags and without a valid session it dies with a Python traceback
            ending in `EOFError`, exit 1. Apple answers `ACCESS_DENIED` when Advanced Data
            Protection is on or web access is off.
          - SIGTERM stops it at once. It skips files that already exist.

          ```ts
          // process.service.ts
          spawnIcloudpd(args: string[], opts: { onLine(line: string): void }): {
            pid: number; exited: Promise<{ code: number | null; signal: string | null }>; stop(): Promise<void>
          }
          // spawn(ICLOUDPD_BIN, args, { shell: false, stdio: ['ignore', 'pipe', 'pipe'] }); stdout and
          // stderr merged line by line; stop() sends SIGTERM, then SIGKILL after 10 s.
          // args always include: --username <appleId> --cookie-directory <dir> --no-progress-bar
          // --log-level info. Never --log-level debug, never -p/--password.
          buildAuthArgs({ appleId, cookieDir })                 // + --auth-only + both webui flags
          buildDownloadArgs({ appleId, cookieDir, directory, recent? })  // no webui flags

          // webui.client.ts  (base URL from ICLOUDPD_WEBUI_URL)
          type FormStep =
            | { step: 'need_password'; error: string | null }
            | { step: 'checking_password' } | { step: 'need_code'; error: string | null }
            | { step: 'checking_code' } | { step: 'no_input' } | { step: 'unreachable' }
            | { step: 'unknown'; snippet: string }
          getStep(): Promise<FormStep>
          submitPassword(password: string): Promise<'accepted' | 'wrong_step' | 'rejected'>
          submitCode(code: string): Promise<'accepted' | 'wrong_step' | 'rejected'>
          cancel(): Promise<void>

          // log-parser.ts  (pure)
          type LogEvent =
            | { type: 'two_factor_required' } | { type: 'authenticated' }
            | { type: 'total'; count: number } | { type: 'downloaded'; path: string }
            | { type: 'skipped'; path: string } | { type: 'all_done' } | { type: 'indexing' }
            | { type: 'needs_login' } | { type: 'access_denied' } | { type: 'other' }
          parseLine(line: string): LogEvent
          ```
          `parseFragment(html)` is a pure function behind `getStep`. `submit*` re-reads the step and
          returns `wrong_step` without posting if it does not match. A network error is
          `unreachable`, never a throw. Requests time out after 5 s. `skipped` matches a line that
          names a file and says it already exists; the exact wording is unverified, so match loosely
          and note it. `needs_login` matches `EOFError` or a `getpass` traceback line.

          The password and code are parameters only: never a field on a class, never in a log call,
          never in a thrown error. Do not log request bodies or fragments that could echo them;
          `unknown.snippet` is the first 200 characters with every `<input …>` tag removed.

          Tests (fixtures in `__tests__/fixtures/`, a fake binary as a small shell script, an
          `http.createServer` stand-in for the form): each fragment maps to its step, including the
          two error variants and garbage; `submitCode` during the password step posts nothing;
          `submitPassword` sends a form-encoded `password` field; a connection refusal is
          `unreachable`; every log line above maps to its event, with a total of 18,532 parsed from
          a line with thousands and a path containing spaces; the argument builders (no webui flags
          for downloads, `--recent` only when given, never `debug`); `stop()` kills a child that
          ignores SIGTERM; a spy logger never receives the password or the code.

          Live probe (report it, commit nothing from it but fixtures): fetch the real binary with
          `apps/icloud-backup/scripts/fetch-icloudpd.sh` into a temp folder. Port 8080 on this host
          belongs to another service, so run the probe inside a throwaway
          `ghcr.io/codemonkey800/lilnas-nextjs-runtime:latest` container with the binary and temp
          folders mounted, as uid 1000, account `nobody@example.invalid`, auth arguments. Save the
          real password fragment as a fixture. Confirm `getStep()` reads it as `need_password`, and
          that SIGTERM ends the process. Do not submit anything. Then run the download arguments
          with an empty cookie folder and confirm the output parses to `needs_login`. Clean up.
      - id: T7
        title: 'Immich client: users, libraries, scans, password reset'
        after:
          - T4
        files:
          - apps/icloud-backup/src/immich/
        status: todo
        body: |-
          A typed client for the Immich admin API and the provisioning logic on top, in
          `apps/icloud-backup/src/immich/` only. `ImmichModule` exports `ImmichClient` and
          `ImmichProvisioner`. Nothing here touches the database; callers pass values in and store
          what comes back.

          Immich is v3.3.4. These routes were read from the server image, so trust them over older
          docs. Base URL `IMMICH_URL` + `/api`, header `x-api-key: IMMICH_API_KEY`, JSON bodies:
          - `GET /admin/users` returns users with `id`, `email`, `name`
          - `POST /admin/users` body `{ email, password, name, shouldChangePassword, notify }`
          - `PUT /admin/users/:id` body `{ password, shouldChangePassword }`
          - `GET /libraries` returns libraries with `id`, `ownerId`, `name`, `importPaths`
          - `POST /libraries` body `{ ownerId, name, importPaths }` (`ownerId` must be a uuid)
          - `POST /libraries/:id/validate` body `{ importPaths }` returns
            `{ importPaths: [{ importPath, isValid, message? }] }`
          - `POST /libraries/:id/scan` (no body), `GET /libraries/:id/statistics`

          ```ts
          class ImmichClient {
            listUsers(): Promise<ImmichUser[]>
            createUser(input: { email: string; name: string; password: string }): Promise<ImmichUser>
              // always shouldChangePassword: true, notify: false
            resetPassword(userId: string, password: string): Promise<void>   // shouldChangePassword: true
            listLibraries(): Promise<ImmichLibrary[]>
            createLibrary(input: { ownerId: string; name: string; importPath: string }): Promise<ImmichLibrary>
            validateLibrary(id: string, importPath: string): Promise<{ isValid: boolean; message?: string }>
            scanLibrary(id: string): Promise<void>
          }
          class ImmichProvisioner {
            ensure(input: { email: string; slug: string }):
              Promise<{ userId: string; libraryId: string; email: string; createdByUs: boolean }>
            newTemporaryPassword(userId: string): Promise<string>
          }
          immichEmail(lilnasEmail: string, plusTag?: string): string   // a@b.c + tag -> a+tag@b.c
          ```
          `ensure` is safe to call again after a crash at any step: find the user by email
          (case-insensitive), else create one with a random 32-character password that is discarded
          (`createdByUs: true`); find a library owned by that user whose `importPaths` contains
          `<IMMICH_IMPORT_ROOT>/<slug>`, else create one named `iCloud` with that path (but if a
          library owned by a different user already has that import path, throw
          `ImmichError('import_path_taken')` and create nothing: two libraries on one folder would
          show every photo twice); validate the
          path and throw `ImmichError('import_path_invalid')` if Immich says it is not valid; start a
          scan. `newTemporaryPassword` generates 20 characters from an unambiguous alphabet with
          `crypto.randomInt`, resets the password and returns it. The caller decides who may ask.

          Errors: non-2xx becomes `ImmichError` with the status and Immich's `message`, never the
          request body or the key. 10 s timeout per request. No retries here.

          Tests (a local `http.createServer` stand-in, no real Immich): each method sends the right
          verb, path, header and body; `ensure` with no user, with an existing user (no create call,
          `createdByUs: false`), with an existing library (no second library, whatever its name), with
          the path already in another user's library (`import_path_taken`, no create call), with an email that
          differs only in case, and with an invalid import path; calling `ensure` twice creates one
          user and one library; `immichEmail` with and without a tag; a 401 surfaces as `ImmichError`
          without the key in its message; passwords never reach a spy logger.
