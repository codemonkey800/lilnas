          the page's own host (`wss:` on https) and replaces the view on every `{ type: 'backup' }`
          frame. On close it reconnects with a backoff of 1, 2, 5, 10, then 30 s and refetches the
          view on each reconnect; `live` is true only while the socket is open. Model the reconnect
          on `apps/download/src/lib/use-job-events.ts`. `actions` wrap the API calls and set the
          returned view at once.

