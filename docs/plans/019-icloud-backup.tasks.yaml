          1. Back up the Immich database: `pg_dump` from `lilnas-immich-database-1` (its own
             credentials, never printed), gzip, to
             `/storage/backups/immich-db/pre-icloud-move-<YYYYMMDD-HHMM>.sql.gz`, mode 600. Create
             the folder if needed. If `/storage/backups` is not writable by you, use
             `/storage/workspace/immich-db-backup/` and say so. Check it with `gzip -t` and report
             its size and path.
          2. In `infra/immich.yml`, service `immich`, delete the two volume lines
             `/storage/photos/icloud:/icloud:ro` and `/storage/photos/icloud-mom:/icloud-mom:ro`.
             Nothing else. Commit it; do not push.
          3. Record for the next task: from the production database (read-only), each library's id
             and current asset count (`library` name "Jeremy iCloud" and "Mom's iCloud").
          4. Report a command sheet for the human with the real names filled in, in this order:
             ```bash
             docker stop lilnas-immich-1 lilnas-immich-machine-learning-1
             sudo mv /storage/photos/icloud      /storage/photos/icloud-users/<jeremy folder>
             sudo mv /storage/photos/icloud-mom  /storage/photos/icloud-users/<mom folder>
             sudo chown -R 1000:1000 /storage/photos/icloud-users/<jeremy folder> /storage/photos/icloud-users/<mom folder>
             ```
             and the undo: move both back, `docker start` the two containers. Check the container
             names with `docker compose -p lilnas ps` first and correct the sheet if they differ.
      - id: H8
        title: Stop Immich, move the two folders, fix ownership (sudo)
        after:
          - T23
        files: []
        status: todo
        body: |-
          Run the command sheet from the task above, in order. The moves are instant (same disk);
          the `chown` takes a minute or two. Leave Immich stopped: the next task rewrites its
          database and brings it back with the deploy.

          Approve as soon as the four commands have finished without an error. If one failed, run
          the undo from the sheet and request changes with the error.
      - id: T24
        title: Rewrite the Immich paths, push the mount removal, verify both libraries
        after:
          - H8
        files: []
        status: todo
        body: |-
          A human stopped Immich and moved `/storage/photos/icloud` and `/storage/photos/icloud-mom`
          to the two folders named in the earlier results under `/storage/photos/icloud-users/`.
          Finish the move: rewrite the paths in Immich's database, deploy the compose change that
          drops the two old mounts, and verify. This task writes to production's Immich database
          and pushes to `main`; both are approved. Commit nothing.

          Check first; if anything fails, stop, change nothing, and report with the undo sheet:
          - `lilnas-immich-1` is not running; `lilnas-immich-database-1` is
          - both new folders exist, are owned by uid 1000 all the way down
            (`find <folder> ! -uid 1000 | head` prints nothing), and the old paths are gone
          - the backup file from the earlier task exists and passes `gzip -t`
          - each library's asset count equals the count recorded earlier
          - `git fetch origin main`; `git merge-base --is-ancestor origin/main HEAD` succeeds;
            `git diff --stat origin/main..HEAD` touches only `infra/immich.yml`,
            `apps/icloud-backup/scripts/**` and `docs/**`, and the `infra/immich.yml` diff is
            exactly the two removed mount lines

          Then:
          1. Run `apps/icloud-backup/scripts/immich-path-rewrite/rewrite.sql` against
             `lilnas-immich-database-1` once per library: `/icloud` to `/icloud-users/<jeremy folder>`
             and `/icloud-mom` to `/icloud-users/<mom folder>`, with each library's id and expected
             count. It is one transaction per library and rolls back on a failed check. If the
             second fails after the first committed, stop and report: each library is consistent on
             its own, and the human decides whether to restore the backup.
          2. Record `git rev-parse origin/main` as the rollback sha. `git push origin HEAD:main`,
             find the run (`gh run list --workflow ci.yml --branch main --event push --limit 5 --json databaseId,headSha,status,url`,
             match `headSha`) and `gh run watch <id> --exit-status`. The deploy starts Immich with
             the new mounts and recreates the `auth` container (auth bind-mounts every
             `infra/*.yml`; `forceRecreate: ["auth"]` in the detect output is expected). If the
             run is red, report the failing job and stop.
          3. Verify (read-only, plus the two scans): `docker compose -p lilnas ps auth` shows auth
             running and healthy and `https://auth.lilnas.io/login` is 200; `lilnas-immich-1` is
             running and mounts neither old path; `https://immich.lilnas.io/api/server/ping` is 200; with the key from
             `/home/jeremy/.config/lilnas/icloud-backup-immich-api-key`, from a throwaway container
             on `lilnas_default`: both libraries list the new import path,
             `POST /api/libraries/:id/validate` says the path is valid, then
             `POST /api/libraries/:id/scan` for both. Wait for the scans (poll
             `GET /api/libraries/:id/statistics` and the database until counts are stable for two
             minutes), then from the database: each library's asset count equals the recorded
             count, zero assets of either library have `"isOffline"` true or a non-null
             `"deletedAt"`, zero paths remain under `/icloud/` or `/icloud-mom/`, and no asset was
             created after the rewrite time in those libraries. Spot-check five asset ids per
             library that had faces before: they still have rows in `asset_face`. Last, for each
             library read its owner's email from the database and check that the part before
             `@`, lower-cased, equals the folder name: the icloud-backup service finds a person's
             library by exactly that match. A mismatch is a defect; fix nothing yourself.

          Report the pushed sha, the rollback sha, the CI run URL, each check with its observed
          value, and the rollback for the human: stop Immich, restore the backup (steps in
          `apps/icloud-backup/scripts/immich-path-rewrite/README.md`), move the folders back, revert
          the pushed commit on `main`. Do not do it yourself. Failed checks go under `defects:`.
      - id: H9
        title: Check Immich and run your first sync
        after:
          - T24
        files: []
        status: todo
        body: |-
          1. Open Immich. Your iCloud photos and your mom's are all there, with people, albums and
             favourites as before. Open a few from different years.
          2. Sign in on `https://icloud-backup.lilnas.io` with your Apple ID, like anyone else.
             There is nothing to link: the site uses the folder named after your lilnas email and
             skips every photo already in it. The count climbs quickly through the photos that are
             already here, while "size so far" should stay small: only the photos taken since your
             last manual sync are downloaded. If the size passes a few GB, press "Stop" and request
             changes; file naming may differ from the old runs.
          3. When it is done, the done screen says to sign in with your existing Immich account
             (no temporary password). In Immich the new photos are in "Jeremy iCloud", once each,
             and External Libraries shows no second library for you.
          4. `/admin` lists you like any other person.
          5. Your mom does step 2 whenever she is ready, after you grant her
             `icloud-backup.lilnas.io` in the auth admin page.
          6. The two `sync-icloud.fish` scripts moved with the folders and are no longer needed;
             delete them when you like.

          Approve when steps 1 to 4 are right.
