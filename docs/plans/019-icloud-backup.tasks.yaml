      - id: T9
        title: 'Job orchestrator: sign-in turn, downloads, retries, disk guard, recovery'
        after:
          - T5
          - T6
          - T7
        files:
          - apps/icloud-backup/src/jobs/
        status: todo
        body: |-
          The state machine that drives one backup job from sign-in to Immich, in
          `apps/icloud-backup/src/jobs/` only. It uses the repositories from `src/db/`, the three
          services from `src/icloudpd/`, `ImmichProvisioner` from `src/immich/`, and the types in
          `src/shared/contract.ts`. `JobsModule` exports `JobsService`. Read those four directories
          first.

          ```ts
          class JobsService {
            getView(user: { email: string; userId: string; isAdmin: boolean }): Promise<BackupView>
            start(user, appleId: string): Promise<BackupView>   // first sign-in, or sign-in again
            sync(user): Promise<BackupView>                     // re-run with the saved session
            submitPassword(user, password: string): Promise<BackupView>
            submitCode(user, code: string): Promise<BackupView>
            cancel(user): Promise<BackupView>
            newImmichPassword(user): Promise<{ password: string }>
            onChange(listener: (lilnasUserId: string) => void): () => void
          }
          ```

          **Account.** Created on the first `start`: slug from `slugFromEmail(email,
          ACCOUNT_SLUG_PREFIX)`. The Apple ID can be changed by `start` until a download has
          started for the account (`appleIdLocked`); after that a different Apple ID is a 409. An
          Apple ID already used by another account is a 409. Folders: photos in
          `<PHOTOS_ROOT>/<slug>`, session in `<STATE_ROOT>/cookies/<slug>`, both created mode 700 /
          755 on demand.

          **A folder that already has photos.** A person's folder, and an Immich library on it
          owned by the Immich user with their email, may exist before their first sign-in (two
          family libraries are moved in by hand). Nothing special happens for them: the folder is
          used as it is, never renamed, suffixed or emptied; icloudpd skips the files already
          there; and after the first download `ensure` finds the existing user and library and
          returns `createdByUs: false`. There is no flag for this on the account.

          **One job per account.** `start` and `sync` return the existing view if a job is active.
          `sync` without an account or Apple ID is a 409. Both are refused with a 409 and
          `lowDiskSpace: true` in the view when free space is below `MIN_FREE_BYTES`.

          **Sign-in turn** (one at a time for the whole process, first come first served):
          1. state `queued_login` with `queuePosition` until the turn comes
          2. spawn icloudpd with the auth arguments; poll the form once a second:
             `need_password` and `need_code` set those states, the checking steps set
             `checking_password` and `checking_code`
          3. `submitPassword` and `submitCode` are accepted only in the matching state (else 409),
             relayed once, and dropped from memory. A `wrong_step` reply from the client is a 409
          4. signed in when the log shows the "all set up" line, or the process exits 0 having never
             asked for a password. Then release the turn and go to `queued_download`
          5. a form error on the code step sets `authError: 'wrong_code'` and stays in `need_code`.
             A failed password (the process exits or the form leaves the password step without
             reaching the code step or the "all set up" line) restarts the auth process once per
             failure with `authError: 'wrong_password'` and state `need_password`; after three
             failures the job fails with `wrong_password`. How icloudpd reports a wrong password is
             unverified; keep this logic in one small function and log the step sequence (never the
             input) so a human can correct it after the dry run
          6. no input for 10 minutes while a form is waiting: stop the process, fail with
             `login_timeout`. `cancel` stops the process and sets `cancelled`. Every exit path
             releases the turn
          7. `ACCESS_DENIED` in the log fails the job with `apple_access_denied`

          **Download** (at most `MAX_DOWNLOADS` processes at once, the rest wait in
          `queued_download`): spawn with the download arguments (`ICLOUDPD_RECENT` when set). From
          the log: `total` sets `totalItems`; each `downloaded` adds one item, the file's size from
          `fs.stat`, and `currentFile` relative to the person's folder; `skipped` adds to
          `skippedItems`. Write progress to the database at most once a second and call the change
          listeners at the same pace. Outcomes, decided from the log and never from the exit code
          alone:
          - `all_done` seen: success
          - `indexing` seen: state `indexing_wait`, `retryAt` after 60 s, 120 s, 240 s, 480 s, 600 s,
            600 s; a seventh failure is `apple_indexing`
          - `needs_login` seen: state `needs_login` (the saved session expired)
          - `access_denied`: `apple_access_denied`
          - anything else, including exit 0 without `all_done`: retry after 30 s, 2 min, 10 min, then
            `icloudpd_error` with the last 20 log lines as `errorDetail`
          Set `appleIdLocked` when the first download starts.

          **Disk guard.** `fs.statfs(PHOTOS_ROOT)` before each download starts and every 60 s while
          one runs. Below `MIN_FREE_BYTES`: stop the process, state `paused_low_disk`.

          **After a successful download.** Add the totals to the account and set `lastBackupAt`. If
          the account has no Immich library: state `provisioning`, call
          `ensure({ email: immichEmail(lilnasEmail, IMMICH_EMAIL_PLUS_TAG), slug })`, store the
          result. If it has one: `scanLibrary`. An Immich failure fails the job with `immich_error`
          but keeps the downloaded totals; the next `sync` tries Immich again (`import_path_taken` is reported the same way, with that
          code in `errorDetail`). Then `done`.

          **`newImmichPassword`**: allowed only when the account's Immich user was created by this
          service (else 403); returns the password and stores nothing.

          **Recovery and shutdown.** On `onApplicationBootstrap`, for every non-terminal job: one in
          a sign-in state fails with `interrupted_login`; one in `queued_download`, `indexing_wait`,
          `downloading` or `provisioning` goes back to `queued_download` and runs again (icloudpd
          skips what it has). On shutdown stop every child and leave the rows as they are.

          Append a `jobEvents` row on every state change and every retry. Never write a password,
          a code or a raw log line that follows a form submission into `errorDetail` or an event.

          Tests (PGlite database, fakes for the process, the form client, the provisioner, the clock
          and `statfs`; no real binary): the full happy path from `start` to `done` with the view at
          each state; a wrong code then a right one; a wrong password three times; the 10-minute
          timeout; `cancel` in each sign-in state; two people starting together (the second is
          `queued_login` at position 1 and gets the form when the first signs in, fails or cancels);
          three downloads with `MAX_DOWNLOADS=2`; the indexing ladder to success and to
          `apple_indexing`; exit 0 without `all_done` is retried; an expired session becomes
          `needs_login`; `sync` on a valid session never enters a password state; low disk before
          start and during a download; Apple ID change allowed before the first download and refused
          after; provisioning on the first success, scan only on the next; an Immich failure and the
          retry on the next sync; `newImmichPassword` for a created and a reused user; a first
          backup into a folder that already holds files (same slug, the provisioner's existing
          library is stored, `createdByUs: false`, no password button allowed); recovery of
          each non-terminal state; progress writes are throttled; a spy logger and the database never
          contain the password or the code.
      - id: T10
        title: 'HTTP API and live updates: backup routes, websocket, admin list'
        after:
          - T9
        files:
          - apps/icloud-backup/src/api/
          - apps/icloud-backup/src/admin/
        status: todo
        body: |-
          Expose `JobsService` (in `apps/icloud-backup/src/jobs/`) to the browser. Files in
          `src/api/` and `src/admin/` only; both modules are already imported by `app.module.ts`.
          Types and schemas come from `src/shared/contract.ts`; identity from `src/auth/`
          (`@CurrentUser()`, `ForwardedUserGuard`, `AdminGuard`, `AdminCheckService`).

          The frontend calls these under `/api`; the backend serves them without the prefix:
          ```
          GET  /backup                    -> BackupView
          POST /backup/start              StartBackupBody -> BackupView
          POST /backup/sync               -> BackupView
          POST /backup/password           PasswordBody -> BackupView
          POST /backup/code               CodeBody -> BackupView
          POST /backup/cancel             -> BackupView
          POST /backup/immich-password    -> { password: string }
          GET  /admin/accounts            -> AdminAccountRow[]        (admins only, else 403)
          WS   /ws                        server sends { type: 'backup', data: BackupView }
          ```
          - Every route needs the forwarded identity (401 without it). Bodies are validated with the
            zod schemas (400). `JobsService` conflicts map to 409 with a short `message`.
          - `POST` routes require the header `X-Requested-With: icloud-backup`, else 403, so a form on
            another site cannot post a password or reset an Immich password.
          - Responses that carry or follow a secret (`/backup/password`, `/backup/code`,
            `/backup/immich-password`) send `Cache-Control: no-store`.
          - The websocket (as `apps/download/src/download-gateway/download.gateway.ts`: `ws`
            adapter, path `/ws`) reads the identity from the upgrade request, closes with 4401
            without one, sends the person's view on connect and again whenever
            `JobsService.onChange` fires for them. It accepts no client messages. A person can have
            several tabs.
          - `GET /admin/accounts`: one row per account with its latest job's state. `totalBytes` is
            the stored total, not a walk of the disk.

          Tests (Nest testing module with a fake `JobsService`): each route's happy path; 401
          without identity; 400 for a bad Apple ID, an empty password and a 5-digit code; 403
          without the header; a 409 passes through; `no-store` on the three routes; the admin route
          for an admin and a non-admin; the websocket sends on connect, sends only to the changed
          person's sockets, sends to both of one person's tabs, and closes 4401 without identity;
          no request body reaches a spy logger.
