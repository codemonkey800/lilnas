nexus-tasks: 1
phases:
  - key: '1'
    name: Immich mount, design and scaffold
    tasks:
      - id: T1
        title: Mount `/storage/photos/icloud-users` read-only into Immich
        after: []
        files:
          - infra/immich.yml
        status: done
        commit: 877fef9f42064daf018407884f653a5050f59e59
        body: |-
          Every person's backup will live in `/storage/photos/icloud-users/<name>`. Mount that one
          parent folder into Immich so a new person needs no compose change.

          1. Create the host folder now, as yourself (uid 1000): `mkdir -p /storage/photos/icloud-users`
             and confirm with `stat -c '%u:%g %a' /storage/photos/icloud-users` (expect `1000:…`, mode
             755). It must exist before the deploy, or Docker creates it owned by root.
          2. In `infra/immich.yml`, service `immich`, add one volume line after the `icloud-mom` one:
             `- /storage/photos/icloud-users:/icloud-users:ro`.

          Change nothing else in the file: no comments, no reformatting (the file fails
          `prettier -c` at base; keep its style). CI runs `up -d` for every service a changed compose
          file defines, and compose recreates only the service whose config changed.

          Verify: `pnpm lilnas ci detect --base HEAD~1 --head HEAD --json` after your commit lists
          no image, `pull` empty, and `up` holding only services defined in `infra/immich.yml`.
          Report that JSON.
      - id: H1
        title: 'Go/no-go: push the Immich mount (Immich restarts once)'
        after:
          - T1
        files: []
        status: approved
        body: |-
          Approving lets an agent push one line to `main`: `infra/immich.yml` gains the read-only
          mount `/storage/photos/icloud-users:/icloud-users`. CI then recreates the `immich`
          container, so Immich is down for about 30 seconds. It also recreates the `auth`
          container, because auth bind-mounts every `infra/*.yml` file: sign-ins and every
          site behind lilnas-auth fail for about 10 seconds. Nothing else deploys.

          Approve when a short Immich and auth restart is fine right now. Rollback, if needed, is yours:
          revert the commit on `main` and push.
      - id: T2
        title: Push the Immich mount to main, watch CI, verify production
        after:
          - H1
        files: []
        status: done
        commit: 3304953a78352d2f98b15d74457ceb174a264f4b
        body: |-
          A human approved this push. Push the Immich mount to `main`, watch the deploy and verify
          production. Commit nothing.

          Before pushing, all of these must hold. If one does not, stop and report without pushing:
          - `git fetch origin main`, then `git merge-base --is-ancestor origin/main HEAD` succeeds
            (never rebase, merge or force)
          - `git diff --stat origin/main..HEAD` touches only `infra/immich.yml` and `docs/**`.
            Anything under `apps/`, `packages/`, a lockfile or the root compose files means app code
            would ship early
          - the `infra/immich.yml` diff is exactly one added line, the `icloud-users` mount
          - `/storage/photos/icloud-users` exists and is owned by uid 1000
          - `pnpm lilnas ci detect --base origin/main --head HEAD --json` has `full: false`, no
            images, `pull` empty, and `up` naming only services from `infra/immich.yml`.
            `forceRecreate` is expected to be exactly `["auth"]`: auth bind-mounts every
            `infra/*.yml`, so the deploy recreates it. Anything else there is a reason to stop
          - record `git rev-parse origin/main` as the rollback sha

          Push with `git push origin HEAD:main`. Find the run with
          `gh run list --workflow ci.yml --branch main --event push --limit 5 --json databaseId,headSha,status,url`
          (match `headSha`) and follow it with `gh run watch <id> --exit-status`. If it is red, report
          the failing job's log and stop.

          After the deploy, check production (read-only):
          - `docker compose -p lilnas ps immich` shows a new, running container
          - `docker inspect lilnas-immich-1 --format '{{json .Mounts}}'` includes
            `/storage/photos/icloud-users` at `/icloud-users`, read-only, and still lists the
            `icloud`, `icloud-mom`, `google-photos`, `home-movies` and upload mounts
          - `curl -s -o /dev/null -w '%{http_code}' https://immich.lilnas.io/api/server/ping` is 200
          - `docker logs lilnas-immich-1 --since 10m` has no error about a mount or a library
          - auth came back after its recreate: `docker compose -p lilnas ps auth` shows it running
            and healthy, and `curl -s -o /dev/null -w '%{http_code}' https://auth.lilnas.io/login`
            is 200

          Report the pushed sha, the rollback sha, the CI run URL and each check. Rollback is a
          revert on `main` by a human; do not do it yourself. Put any failed check under `defects:`.
      - id: T3
        title: 'Mockups: every icloud-backup screen at 1280 and 390'
        after: []
        files:
          - docs/features/icloud-backup/
        status: done
        commit: d884a0ab5cb0a9dc10aae4abf10b0b34e3e7109e
        body: |-
          Design the whole `icloud-backup.lilnas.io` UI as static mockups, before any code exists.
          Read `DESIGN.md`, `docs/designs/voice.md`, `docs/designs/components.md` and
          `docs/designs/mockup-kit/README.md` first; open
          `docs/features/design-system/designs/index.html` for the components. Scaffold with
          `pnpm --filter @lilnas/cli build && pnpm exec lilnas mockups new icloud-backup`, replace the
          scaffold, and use the shared kit (`docs/designs/mockup-kit/`) as
          `docs/features/portal/designs/src` does. Build with `pnpm mockups`; commit the generated
          `*.html`. No behavioural JS.

          The audience is family, not developers: plain words, one thing to do per screen, comfortable
          density. The app bar carries the doorplate `icloud-backup.lilnas.io`.

          Pages, each at desktop 1280 and phone 390, with every state side by side:
          1. `index.html`: links to the pages below.
          2. `start.html`: the pre-flight page and sign-in.
             - Pre-flight checklist: "Advanced Data Protection must be off", "Access iCloud Data on the
               Web must be on", "You need an Apple device nearby for the 6-digit code; text-message
               codes and security keys don't work here". Each with one line on where the setting is
               on an iPhone. A "Continue" button.
             - Apple ID and password form. Say that the password goes to Apple and is not saved.
               States: empty, submitting, "That password didn't work, try again", server low on
               space (start disabled).
             - Waiting for a turn: "Someone else is signing in. You're next, this page moves on by
               itself." No input.
             - Code entry: six digits, "Enter the code shown on your Apple device". States: empty,
               checking, "That code didn't work, try again".
             - Signed in, handing over to the backup.
          3. `backup.html`: the page a signed-in person sees from then on.
             - Queued to download.
             - "Apple is still preparing your library. Trying again in 2 minutes" (attempt 2 of 6).
             - Downloading: "1,204 of 18,532 photos and videos", a progress bar, size so far
               ("12.4 GB"), the current file name in mono, a live dot, "You can close this tab".
               A "Stop" button.
             - Review before download, shown once to a person whose existing folder was adopted:
               "18,316 of your photos are already on the server. 212 are new. Download them?" with
               "Download" and "Not now", and the warning variant when the new count is large
               ("This looks like most of your library. Check with Jeremy before continuing").
             - Finishing: creating the Immich account and library.
             - Done: last backup time, item count, size, "Open my photos" to
               `https://immich.lilnas.io`, the Immich sign-in email, a "Create a temporary password"
               button, then the state after pressing it (password shown once in mono with a copy
               button and "You'll be asked to change it"), and the variant for a person who already
               had an Immich account (no password button). A "Sync now" button.
             - "Apple wants you to sign in again" with a button back to sign-in.
             - Paused: "The server is low on space" with what to do.
             - Failed: one screen with a slot for the reason, covering "Apple refused access. Check
               the two settings" (link back to pre-flight), "Sign-in timed out", and a generic
               "Something went wrong" with "Try again".
             - Reconnecting banner for a dropped live connection.
          4. `admin.html`: a read-only table for admins: person (lilnas email), Apple ID, state
             badge, last backup, items, size on disk, Immich account (linked/none). States: rows,
             empty, loading, error. On the phone it becomes a list. Below it, "Existing libraries":
             a short list of presets (lilnas email, folder, Immich library name) with "Remove", and
             a form to add one (email, folder name, a select of Immich external libraries), with
             its validation errors.

          Put copy and sample data in `src/data/*.mjs`. Report the page paths.
      - id: T25
        title: 'Mockups: one Nexus review frame per state, both widths in each frame'
        after:
          - T3
        files:
          - docs/features/icloud-backup/
          - docs/designs/mockup-kit/mock.pug
          - docs/designs/mockup-kit/README.md
        status: done
        commit: 869f27d75edc7defef860f49eb67de1801a0094b
        body: |-
          The mockups in `docs/features/icloud-backup/designs/` (`start.html`, `backup.html`,
          `admin.html`, built from `src/pages/*.pug`, `src/mixins/*.pug` and `src/data/*.mjs`) are
          finished, but a human reviews them in Nexus's review canvas, which lays a page out as
          **frames** and lets them pin comments per frame. These pages have no frame markup, so
          each one shows as a single huge frame with a Desktop/Mobile switch. Rebuild the harness
          around the screens so every state is its own frame. Do not change any screen: the copy,
          the states, the sample data and the screen mixins' output stay as they are.

          How Nexus finds frames (it reads the built HTML; nothing is configured):
          - a frame is a direct `<section class="sec …">` child of the first element in the
            document that has the class `page`
          - children of `.page` before the first section are the cover band (title and intro),
            shown above the frames
          - a frame's title is the text of its `h2.sec-title`; an optional `.sec-num` holds a
            number such as `01`
          - frames are laid out on a grid of cells as wide as the `.page` content, in any order,
            and sometimes one at a time, so each section must stand alone: its own title and
            caption, no "as above", nothing that depends on a control outside it
          `sec`, `sec-title`, `sec-num` and `page` are marker classes only; they need no CSS.

          **Kit.** In `docs/designs/mockup-kit/mock.pug` add one mixin and use it from all three
          pages:
          ```pug
          //- One Nexus review frame: a direct child of the `.page` column.
          mixin mockFrame(id, title, opts)   //- opts: num ('01'), caption
            section(class='sec …' id=id)&attributes(attributes)
              //- header: span.sec-num (when given), h2.sec-title, the caption
              block
          ```
          Style it with the kit's existing tokens, like `mockSection` and `stateRow` in the same
          file. Document it in `docs/designs/mockup-kit/README.md`: a row in the `mock.pug` table
          and a short "Nexus review frames" section giving the rules above and saying a page
          opts in by putting `class='page'` on its column. Change nothing else in the kit: no
          other feature's built `*.html` may change (`git status` after `pnpm mockups` shows
          only files under `docs/features/icloud-backup/` and the two kit files).

          **Pages.** In `start.pug`, `backup.pug` and `admin.pug`:
          - override `block page` and call `+mockPage('max-w-[1760px]')(class='page')`, so a
            1280 screen and a 390 screen fit side by side (1280 + 390 + a gap)
          - `+mockHead(…)` stays first, as the cover band. Reword its last sentence: each state is
            a frame showing 1280 and 390 side by side
          - remove the `vp-scope` wrapper, `+viewportToggle`, both `+viewportPanel`s, the
            `+stateRow`/`+stateCell` wrappers and the two trailing `+frameLabel`s
          - then one `+mockFrame(key, label, { num, caption })` per state, each a direct child of
            the `.page` column, in the order the desktop panel has today. Keep each state's
            existing `key` as the section `id` (`start.html#preflight` is linked from
            `backup.html`). Inside: a row with the desktop screen (`+startScreen('desktop', …)`,
            `+backupScreen('desktop', …)`, `+adminScreen('desktop', …)`) and the mobile screen
            beside it, top-aligned, each with a `+frameLabel` (`Desktop · 1280`, `Mobile · 390`)
          - `start.pug` groups its phone screens by `s.group` today; drop the grouping, and put
            the group name in the frame's caption if it is not already clear from the label
          - `index.html` is a list of links and needs no frames
          Update `docs/features/icloud-backup/designs/README.md` where it mentions the viewport
          switch.

          No behavioural JS and no `<script>` of any kind. Run `pnpm mockups` and commit the
          rebuilt `*.html`.

          Verify and report, per page: the number of direct `section.sec` children of the `.page`
          element in the built HTML (it must equal the number of states in that page's data), the
          frame titles in order, and that no `vp-radio` or `data-viewport-panel` is left. Open each
          built page in a browser at a 1800 px wide window, take a screenshot, and confirm the two
          screens of a frame sit side by side without overflow or clipping and that every screen
          looks as it did before (compare against `git show HEAD:<path>` of the same page at
          both widths for two states per page). Delete the screenshots and any temp files.
      - id: T26
        title: 'Mockups: drop the review-before-download states and the admin "Existing libraries" section'
        after:
          - T25
        files:
          - docs/features/icloud-backup/
        status: done
        commit: 7a63ef446c953df0cc9d4f3dea361c63d0ea811d
        body: |-
          The mockups in `docs/features/icloud-backup/designs/` (`start.html`, `backup.html`,
          `admin.html`, built from `src/pages/*.pug`, `src/mixins/*.pug` and `src/data/*.mjs`; read
          `docs/designs/mockup-kit/README.md` first) still show a feature that was cut: a special
          path for people whose iCloud folder existed before this service. The decision now is
          that such a person is treated like anyone else: they sign in, the service finds their
          folder and their Immich library by their email, and the download skips what is already
          there. There is no admin form and no question before the download.

          Remove, from the data, mixins, pages and `README.md`:
          - `backup`: the states `review` and `review-large` (the "N new photos, Download / Not
            now" screens) and any copy elsewhere that refers to them, such as "Checking which
            photos are already here" on the queued screen
          - `admin`: the "Existing libraries" section (the preset list, its "Remove" button and
            the add form), in every admin state, at both widths
          Keep everything else as it is, including `done-existing` (the done screen for a person
          whose Immich account already existed: "Sign in with your existing Immich account") and
          the frame markup: one `+mockFrame` per state, 1280 and 390 side by side.
          `grep -rniE 'preset|review|adopt|already here' docs/features/icloud-backup/designs/src`
          must find nothing that belongs to the cut feature afterwards.

          Run `pnpm mockups` and commit the rebuilt `*.html`. `git status` must show only files
          under `docs/features/icloud-backup/`.

          Verify and report, per page: the number of direct `section.sec` children of the `.page`
          element in the built HTML (it must equal the number of states in that page's data) and
          the frame titles in order. Open `backup.html` and `admin.html` in a browser at a 1800 px
          wide window and confirm the remaining frames look as before and the admin page has no
          empty gap where the section was. Delete screenshots and temp files.
      - id: T27
        title: 'Wire contract: remove the preview states and the preset types'
        after:
          - T4
        files:
          - apps/icloud-backup/src/
        status: done
        commit: e8585746ca13effba9da87563fb7bb8b011be589
        body: |-
          `apps/icloud-backup/src/shared/contract.ts` (types and zod schemas shared by the backend
          and the frontend) and `src/shared/__tests__/contract.spec.ts` still describe a feature
          that was cut before anything used it: a special path for people whose iCloud folder
          existed before this service (an admin "preset" and a count-then-ask step before their
          first download). Such a person is now treated like anyone else, so the contract needs
          none of it.

          Remove from `contract.ts`, with their zod schemas and exports:
          - the job states `previewing` and `review_download`
          - `previewItems` on the job view
          - `adopted` on the account view
          - `AdminPreset`, `AdminLibraryOption` and `PresetBody`
          Then `grep -rnE 'previewing|review_download|previewItems|adopted|Preset|AdminLibraryOption' apps/icloud-backup/src`
          and remove every remaining use (the spec, any placeholder that lists states). Change
          nothing else: no other state, field or schema is renamed or reordered. Update
          `apps/icloud-backup/README.md` only if it mentions these.

          Tests: the spec no longer covers the removed items and still covers every remaining
          state and schema; add one case that `previewing` and `review_download` are rejected by
          the job-state schema.
      - id: H2
        title: Review the icloud-backup mockups
        after:
          - T3
          - T25
          - T26
        files:
          - docs/features/icloud-backup/designs/start.html
          - docs/features/icloud-backup/designs/backup.html
          - docs/features/icloud-backup/designs/admin.html
        status: todo
        body: |-
          Each state is one frame with the 1280 and the 390 screen side by side; pin comments on
          the frame they belong to. Things to decide here, because the frontend is built
          from what you approve:
          - the pre-flight wording a family member reads before typing an Apple password
          - the "you're next" waiting screen
          - what the done screen shows: the Immich link, the sign-in email and the temporary-password
            button
          - the columns of the admin table
      - id: H3
        title: Create the Immich API key and save it to a file
        after: []
        files: []
        status: approved
        body: |-
          The service needs an Immich admin API key. Only you can create it, and it must not pass
          through a chat.

          1. Sign in to `https://immich.lilnas.io` as the admin. Account Settings, API Keys, New API
             Key. Name it `icloud-backup`. Select only these permissions: `adminUser.create`,
             `adminUser.read`, `adminUser.update`, `library.create`, `library.read`,
             `library.update`, `library.statistics`.
          2. Save the key as the only line of a file readable only by you:
             ```bash
             mkdir -p ~/.config/lilnas && umask 077 && cat > ~/.config/lilnas/icloud-backup-immich-api-key
             ```
             Paste the key, press Enter, then Ctrl-D.

          Approve when the file exists. Do not paste the key into the approval note.
      - id: T4
        title: 'Scaffold `apps/icloud-backup`: Nest + Next skeleton, wire contract, image with icloudpd'
        after:
          - T2
        files:
          - apps/icloud-backup/
          - pnpm-lock.yaml
        status: done
        commit: 5a0493fc586272cd37229ca7584ab055f8d5acca
        body: |-
          Create the app every later task fills in. Later tasks each own one directory and must not
          need to edit a shared file, so this task creates every shared file in its final form.
          `T2` pushed to `main`; from here nothing is pushed until the end of the run.

          **Package.** `apps/icloud-backup/package.json` named `@lilnas/icloud-backup`, modelled on
          `apps/dev/package.json` (same scripts, `dev:frontend` as `next dev -p ${FRONTEND_PORT:-8080}`,
          `start:frontend` as `node frontend/apps/icloud-backup/server.js`), plus
          `db:generate: drizzle-kit generate`. Dependencies, at the versions the repo already pins
          where it has them: what `apps/dev` has, plus `@nestjs/platform-ws`, `@nestjs/websockets`,
          `@nestjs/schedule`, `ws`, `drizzle-orm`, `pg`, `nestjs-zod`, `@lilnas/ui`; dev:
          `@types/pg`, `@types/ws`, `drizzle-kit`, `@electric-sql/pglite` (latest). Copy and adapt
          from `apps/dev`: `tsconfig.json`, `nest-cli.json`, `eslint.config.cjs`, `jest.config.js`
          (projects `node` and `jsdom`, setup file `src/__tests__/setup-dom.ts`),
          `postcss.config.cjs`, `next-env.d.ts`, `src/tailwind.css`. `drizzle.config.ts` with
          `dialect: 'postgresql'`, schema `./src/db/schema.ts`, out `./src/db/migrations`.

          **`next.config.js`.** `output: 'standalone'`, `allowedDevOrigins` as `apps/dev`, and the
          backend origin chosen by build phase exactly as `apps/auth/next.config.js` does:
          `http://localhost:8081` under `PHASE_DEVELOPMENT_SERVER`, else `http://icloud-backup:8081`.
          Rewrites: `/api/:path*` to `<backend>/:path*`, and `/ws` to `<backend>/ws`.

          **Backend skeleton** (`src/main.ts`, `src/bootstrap.ts`, `src/env.ts`, `src/app.module.ts`),
          following `apps/download`: `WsAdapter`, pino logger, `app.enableShutdownHooks()`, listen on
          `BACKEND_PORT`. `bootstrap.ts` does not run migrations or recovery itself; modules do that
          in lifecycle hooks. `app.module.ts` imports, once and for all: `HealthModule`, `AuthModule`,
          `DbModule`, `IcloudpdModule`, `ImmichModule`, `JobsModule`, `ApiModule`, `AdminModule`,
          `LoggerModule`, `ScheduleModule.forRoot()`. Create `src/db/db.module.ts`,
          `src/icloudpd/icloudpd.module.ts`, `src/immich/immich.module.ts`, `src/jobs/jobs.module.ts`,
          `src/api/api.module.ts`, `src/admin/admin.module.ts` as empty `@Module({})` classes; their
          owners fill them. Redact in the pino config: `req.headers.cookie`, `req.headers.authorization`,
          `req.body`, and any key named `password`, `code`, `apiKey`.

          `src/env.ts` `EnvKeys` (all read through `env()` from `@lilnas/utils/env`):
          ```ts
          BACKEND_PORT            // 8081
          NODE_ENV
          POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
          ICLOUDPD_BIN            // default /usr/local/bin/icloudpd
          ICLOUDPD_WEBUI_URL      // default http://127.0.0.1:8080
          ICLOUDPD_RECENT         // optional int; adds --recent N (dry runs only)
          PHOTOS_ROOT             // default /photos        (host /storage/photos/icloud-users)
          STATE_ROOT              // default /state         (cookies under <STATE_ROOT>/cookies/<slug>)
          MIN_FREE_BYTES          // default 200000000000
          MAX_DOWNLOADS           // default 2
          IMMICH_URL              // http://immich:2283
          IMMICH_API_KEY
          IMMICH_EXTERNAL_URL     // https://immich.lilnas.io
          IMMICH_IMPORT_ROOT      // default /icloud-users  (PHOTOS_ROOT as Immich sees it)
          IMMICH_EMAIL_PLUS_TAG   // optional; a@b.c becomes a+<tag>@b.c (dry runs only)
          ACCOUNT_SLUG_PREFIX     // optional; prefixes the folder name (dry runs only)
          DEV_USER_EMAIL, DEV_USER_ID   // dev-only identity fallback
          ```

          **`src/health/`**: `GET /health` returns `{ status: 'ok' }`.

          **`src/auth/`**: copy the idea of `apps/download/src/auth/forwarded-user.ts`,
          `forwarded-user.guard.ts`, `current-user.decorator.ts`, `admin-check.service.ts` and
          `admin.guard.ts`, without the Discord parts. Identity is `X-Forwarded-User` (email) and
          `X-Forwarded-User-Id`; a request without both is 401, except the dev fallback, which needs
          `NODE_ENV !== 'production'` and both `DEV_USER_*` set. `/health` is the only unguarded route.

          **`src/shared/contract.ts`**: the whole wire contract, zod schemas with inferred types:
          ```ts
          export const BACKUP_STATES = [
            'queued_login', 'need_password', 'checking_password', 'need_code', 'checking_code',
            'previewing', 'review_download',
            'queued_download', 'indexing_wait', 'downloading', 'provisioning',
            'done', 'needs_login', 'paused_low_disk', 'failed', 'cancelled',
          ] as const
          export const ERROR_CODES = [
            'wrong_password', 'login_timeout', 'interrupted_login', 'apple_access_denied',
            'apple_indexing', 'icloudpd_error', 'immich_error', 'internal',
          ] as const
          export interface JobView {
            id: string
            kind: 'first_backup' | 'sync'
            state: BackupState
            authError: 'wrong_password' | 'wrong_code' | null   // shown on the form being retried
            queuePosition: number | null      // 1 = next; only in queued_login
            previewItems: number | null       // files a download would fetch; set in review_download
            totalItems: number | null
            downloadedItems: number
            skippedItems: number
            downloadedBytes: number
            currentFile: string | null        // path relative to the person's folder
            attempt: number                   // indexing retries so far
            maxAttempts: number
            retryAt: string | null            // ISO; only in indexing_wait
            errorCode: ErrorCode | null
            startedAt: string
            finishedAt: string | null
          }
          export interface BackupView {
            email: string
            isAdmin: boolean
            lowDiskSpace: boolean
            account: null | {
              appleId: string
              appleIdLocked: boolean          // true once a download has started
              adopted: boolean                // linked to a folder and library that existed before
              lastBackupAt: string | null
              totalItems: number
              totalBytes: number
              immich: null | { email: string; createdByUs: boolean; url: string }
            }
            job: JobView | null               // the active job, else the most recent one
          }
          export interface AdminAccountRow {
            email: string; appleId: string; folder: string; state: BackupState | null
            lastBackupAt: string | null; totalItems: number; totalBytes: number; hasImmich: boolean
          }
          export interface AdminPreset {
