        body: |-
          Create one random token per caller and store each in two encrypted env files: auth's,
          under the caller's `INTERNAL_TOKEN_*` name, and the caller's own, as
          `AUTH_INTERNAL_TOKEN`. Production env files are committed encrypted with dotenvx
          (`docs/deploy.md`, Secrets); compose reads a gitignored `.decrypted` sibling.

          | Caller | In `apps/auth/.env.prod` | `AUTH_INTERNAL_TOKEN` in |
          | --- | --- | --- |
          | download | `INTERNAL_TOKEN_DOWNLOAD` | `apps/download/.env.prod` |
          | icloud-backup | `INTERNAL_TOKEN_ICLOUD_BACKUP` | `apps/icloud-backup/.env.prod` |
          | dev | `INTERNAL_TOKEN_DEV` | `apps/dev/.env.prod` (new) |
          | dev-idle-reaper | `INTERNAL_TOKEN_DEV_IDLE_REAPER` | `apps/dev-idle-reaper/.env.prod` (new) |

          How, without a value ever reaching your output or a file other than these:
          - Generate and set each pair in one shell command, with the value only in a shell
            variable: `T=$(openssl rand -hex 32)`, then
            `pnpm exec dotenvx set <NAME> "$T" -f <file> >/dev/null` for both files, then
            `unset T`. No `set -x`, no `echo`. `dotenvx set` needs only the
            `DOTENV_PUBLIC_KEY_PROD` line already in the file.
          - The two new files: start each with the dotenvx header comment and the
            `DOTENV_PUBLIC_KEY_PROD="…"` line copied from `apps/download/.env.prod`, so they share
            the existing PROD key and need no new private key on the host. Then `dotenvx set`.
          - Do not set `INTERNAL_TOKEN_ENFORCE` anywhere. Enforcement is a later task.
          - Do not run `pnpm lilnas secrets decrypt` and do not create any `.decrypted` file.

          Compose:
          - `apps/dev/deploy.yml`: add `env_file: [.env.prod.decrypted]` to `dev-dashboard`, in the
            file's own list style, and correct the header comment that says the app holds no
            secrets and has no `env_file`.
          - `apps/dev-idle-reaper/deploy.yml`: add the same `env_file` to `dev-idle-reaper`, with a
            comment that it carries the auth token.
          - No other compose change. `apps/download/deploy.yml` and
            `apps/icloud-backup/deploy.yml` already load `.env.prod.decrypted` on the backend
            service; the `icloud-backup-frontend` and `auth-frontend` services must not gain it.

