          Before approving:
          - read T3's result: every matrix row passed, above all "closing a stream frees a slot"
            and the per-address in-flight rows, and nothing was left running
          - read the phase 1 review
          - don't push anything else to `main` until the push task has finished (it stops if
            `origin/main` has moved)

          Rollback, by you. The labels live in the compose file, so the full rollback is to revert
          the pushed commits on `main` and push. If only the SSE change misbehaves,
          `cd /opt/lilnas && sudo -u deploy env LILNAS_TAG=<sha before the push> docker compose up -d auth`
          puts the old backend image back; the push task reports that sha.

          Request changes to hold the push.
      - id: T4
        title: Push 1 to main, watch CI, verify production
        after:
          - H3
        files: []
        status: todo
        body: |-
          A human approved this push. Push the phase 1 work to `main`, watch the deploy, verify
