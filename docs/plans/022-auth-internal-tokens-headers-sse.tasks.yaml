      - id: T5
        title: '`InternalTokenGuard` on the internal routes, allow-and-log unless enforced'
        after:
          - T4
        files:
          - apps/auth/src/internal/
          - apps/auth/src/admin/admin-check.controller.ts
          - apps/auth/src/admin/__tests__/admin-check.controller.spec.ts
          - apps/auth/src/app.module.ts
          - apps/auth/src/env.ts
          - apps/auth/README.md
        status: todo
        body: |-
          `GET /admin/check` (`src/admin/admin-check.controller.ts`), `GET /internal/discord-link`
          and `POST /internal/discord-identity` (`src/internal/discord-internal.controller.ts`) and
          `GET /internal/host-activity` (`src/internal/host-activity.controller.ts`) have no auth:
          any container on the Docker network can call them. Add a guard that knows each caller by
          its bearer token and each caller's scopes (the contract is in Context). This task ships
          it in observe mode: without `INTERNAL_TOKEN_ENFORCE=true` the guard never rejects.

          ```ts
          // apps/auth/src/internal/internal-callers.ts
          export const INTERNAL_SCOPES = [
            'admin-check', 'discord-link:read', 'discord-identity:write', 'host-activity:read',
          ] as const
          export type InternalScope = (typeof INTERNAL_SCOPES)[number]
          export const INTERNAL_CALLERS: Record<
            string,
            { tokenEnv: string; scopes: readonly InternalScope[] }
          > // download, icloud-backup, dev, dev-idle-reaper, exactly as in Context

          // apps/auth/src/internal/internal-token.guard.ts
          export const RequireInternalScope: (scope: InternalScope) => MethodDecorator
          @Injectable()
          export class InternalTokenGuard implements CanActivate {}
          export type InternalAuthOutcome = 'ok' | 'missing' | 'invalid' | 'forbidden'
          ```
          Put `@UseGuards(InternalTokenGuard)` on the four controller classes and
          `@RequireInternalScope(...)` on each handler; provide the guard in `AppModule`. Add the
          four token env names and `INTERNAL_TOKEN_ENFORCE` to `EnvKeys`.

          Guard rules:
          - Read the token from `Authorization: Bearer <token>` (scheme case-insensitive). No
            header: `missing`. Any other shape, or a token that matches no caller: `invalid`.
          - A caller's token is its env var's value. A value that is unset or shorter than 32
            characters disables that caller: nothing matches it. If two callers have the same
            value, both are disabled and one error is logged at startup. Never throw at startup:
            a boot failure of auth takes every gated site down.
          - Compare in constant time: `crypto.timingSafeEqual` over SHA-256 digests of the
            presented and the configured token.
          - A matched caller without the handler's scope: `forbidden`. A guarded handler with no
            scope metadata is `forbidden` for everyone.
          - Enforcing (`INTERNAL_TOKEN_ENFORCE` is exactly `true`): `missing` and `invalid` throw
            `UnauthorizedException`; `forbidden` throws `ForbiddenException`. Not enforcing: every
            outcome is allowed through.
          - Log one line per guarded request through `PinoLogger`:
            `{ event: 'internal-auth', outcome, caller, scope, enforced, remoteAddress }`, with
            `caller` the caller's name or null. Level info for `ok`, warn for the rest. Never log
            the token, the header or a digest.
          - Read the env per request or once at module init, but the spec must be able to set it.

          Edge cases:
          - `/verify`, `/strip-cookie`, `/health`, `/me`, `/requests/*`, the session-guarded
            `/admin/*` routes and `/sse/*` get no token guard. `AdminController` keeps `AdminGuard`
            only; `AdminCheckController` is the separate class at `/admin/check`.
          - Responses and status codes for an allowed request are unchanged, including the 200
            for an unknown Discord link and the 400s.
          - Rewrite the "Guard-free by design" comments in the three controller files: the network
            is no longer the only control.

          Docs, in `apps/auth/README.md`: a short "Internal routes" section (the caller and scope
          table, the header, the observe and enforce modes, how to add a caller) and rows in the
          env table for the four `INTERNAL_TOKEN_*` variables and `INTERNAL_TOKEN_ENFORCE` (unset
          in dev; production values come from `.env.prod` and `deploy.yml`). Update the "Residual
