            `auth.lilnas.io` are 404; `https://sonarr.lilnas.io/` is a 302 to the login page
          - starting a sign-in (`POST https://auth.lilnas.io/api/auth/sign-in/social` with JSON
            `{"provider":"google","callbackURL":"/"}` and `Origin: https://auth.lilnas.io`) returns
            a Google URL and sets cookies whose names start with `__Secure-lilnas-auth.`. Print
