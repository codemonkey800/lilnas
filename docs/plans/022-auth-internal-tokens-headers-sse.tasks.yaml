          Report the pushed sha, the rollback sha, the CI run URL, each check with what you
          observed, and the rollback steps for the human: revert the pushed commits on `main` and
          push; or, for the backend image only,
          `cd /opt/lilnas && sudo -u deploy env LILNAS_TAG=<rollback sha> docker compose up -d auth`.
