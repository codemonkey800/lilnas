      - id: H4
        title: Check sign-in, the pending page and the admin dashboard after push 1
        after:
          - T4
        files: []
        status: todo
        body: |-
          Push 1 is live. In a browser:
          1. Sign out at `https://auth.lilnas.io`, then open a gated site (for example
             `https://sonarr.lilnas.io`) and sign in with Google. You land on the site.
          2. Open `https://auth.lilnas.io/admin`. The dashboard loads; approving or editing
