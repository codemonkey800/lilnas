nexus-tasks: 1
phases:
  - key: '1'
    name: Headers and SSE limits
    tasks:
      - id: T1
        title: Security headers and an in-flight limit on the `auth` router; `x-powered-by` off
        after: []
        files:
          - apps/auth/deploy.yml
          - apps/auth/next.config.js
          - apps/auth/src/services/__tests__/auth-router-hardening.spec.ts
        status: done
        commit: 374a6bcbd442314bc78cce98731647b72cb00b25
        body: |-
          The `auth` router (labels on the `auth-frontend` service in `apps/auth/deploy.yml`) has no
          middlewares, and `https://auth.lilnas.io/login` answers with no HSTS, no
          `X-Frame-Options`, no CSP, and `x-powered-by: Next.js`. Add two middlewares to that
          router and turn the Next header off.

          Add exactly these labels to `auth-frontend`, beside the existing `auth` router labels:
          ```yaml
          - traefik.http.routers.auth.middlewares=auth-security-headers,auth-inflight
          - traefik.http.middlewares.auth-security-headers.headers.stsseconds=31536000
          - traefik.http.middlewares.auth-security-headers.headers.framedeny=true
          - traefik.http.middlewares.auth-security-headers.headers.contenttypenosniff=true
          - traefik.http.middlewares.auth-security-headers.headers.contentsecuritypolicy=frame-ancestors 'none'
          - traefik.http.middlewares.auth-inflight.inflightreq.amount=64
          - traefik.http.middlewares.auth-inflight.inflightreq.sourcecriterion.ipstrategy.depth=0
          ```
          Add a short comment above them: what each middleware is for; HSTS is for this host only
          (no `stsincludesubdomains`, no `stspreload`); the in-flight limit is per source IP, and
          the `ipstrategy` line is required because Traefik's default groups by request host, which
          would make 64 a global limit; the headers middleware comes first so a 429 from the limit
          also carries the headers.

          In `apps/auth/next.config.js` add `poweredByHeader: false` to the returned config (both
          build phases return the same object).

          In `apps/auth/deploy.yml`, extend the comment above the `/storage/app-data/lilnas-auth:/data`
          volume: the directory must be owned by UID 1000 with mode 700 and the database files mode
          600 (`chmod 700 /storage/app-data/lilnas-auth && chmod 600 /storage/app-data/lilnas-auth/lilnas-auth.db*`),
          because the database holds emails, session tokens and Google OAuth tokens and other host
          accounts must not read it. Keep the existing `chown` line. Comment only.

          Edge cases:
          - Labels go on `auth-frontend` only. The `auth` (backend) service keeps no `traefik.*`
            label; `frontend-isolation.spec.ts` checks that and must pass unedited.
          - Neither middleware name contains `lilnas-auth`.
          - Change nothing else in `deploy.yml`: no env, no healthcheck, no other label.
          - The file fails `prettier -c` at base; match its style, don't reformat it.

          Tests, in the new `auth-router-hardening.spec.ts` (backend project; parse the YAML the
          way `frontend-isolation.spec.ts` does):
          - the `auth` router's `middlewares` label is exactly `auth-security-headers,auth-inflight`
          - each of the six middleware labels exists on `auth-frontend` with exactly the value above
          - no label sets `stsincludesubdomains` or `stspreload` on `auth-security-headers`
          - no middleware defined in `apps/auth/deploy.yml` has a name containing `lilnas-auth`
          - `require('apps/auth/next.config.js')` called with `PHASE_PRODUCTION_BUILD`,
            `PHASE_PRODUCTION_SERVER` and `PHASE_DEVELOPMENT_SERVER` (from `next/constants`) returns
            `poweredByHeader === false` each time
      - id: T2
        title: '`/sse/pending` returns 401 without a session; a per-user cap on open streams'
        after: []
        files:
          - apps/auth/src/sse/
          - apps/auth/src/env.ts
          - apps/auth/.env.example
          - apps/auth/README.md
        status: done
        commit: 4e3f470a182cd2a0a53327c72c186fad1cd3a65b
        body: |-
          `GET /sse/pending` (`apps/auth/src/sse/sse.controller.ts`, public as `/api/sse/pending`
          through the Next rewrite) gives anyone, signed in or not, an endless keepalive stream.
          Reject requests that can never receive data, and cap how many streams one user holds.

          New provider in `SseModule`:
          ```ts
          // apps/auth/src/sse/sse-stream-limiter.service.ts
          @Injectable()
          export class SseStreamLimiter {
            /** Takes a slot for the user. Returns an idempotent release function, or null at the cap. */
            acquire(userId: string): (() => void) | null
            openStreams(userId: string): number
          }
          ```
          The cap is `SSE_MAX_STREAMS_PER_USER` (add to `EnvKeys`), default 6; a value that is not
          an integer of at least 1 falls back to 6. One count per user, shared by `/sse/pending` and
          `/sse/admin`.

          `pending()`:
          - no session (`accessCache.resolveSession(req.headers.cookie)` is null): throw
            `UnauthorizedException` before any stream starts. No slot is taken.
          - a session but no `host` query value (missing, empty or whitespace): throw
            `BadRequestException`. No slot is taken.
          - at the cap: throw `new HttpException('Too many open streams', HttpStatus.TOO_MANY_REQUESTS)`.
          - otherwise take a slot and return the same merged data and keepalive stream as today.

          `admin()`: `AdminGuard` stays as it is (401 and 403). After it, resolve the session the
          same way to get the `userId`, apply the same cap and 429, then return today's stream.

          Releasing a slot: call the release function both when the returned Observable is torn
          down and on the request's `close` event, so a slot is freed whichever comes first and is
          never left behind if Nest never subscribes. The release is idempotent. Delete a user's
          entry when the count reaches zero, so the map does not grow.

          Do not change `apps/auth/src/app/pending/pending-client.tsx` or
          `apps/auth/src/app/admin/admin-dashboard-client.tsx`. Both already handle a non-2xx
          answer: the browser closes the `EventSource` for good, the `error` handler rechecks and
          rebuilds it after 5 s, and a 30 s poll keeps the page correct with no stream. Read them
          to confirm, and say in your result what a signed-out pending tab and a seventh tab now do.

          Rewrite the comment block at the top of `sse.controller.ts`: the "no auth failure
          response, keepalive only" posture is gone. Keep comments that are still true.

          Docs: add `SSE_MAX_STREAMS_PER_USER` to the env table in `apps/auth/README.md` (dev and
          prod value unset, default 6) and, commented out, to `apps/auth/.env.example`.

          Tests. Replace the keepalive-for-anonymous cases in
          `src/sse/__tests__/sse.controller.spec.ts`; keep the topic-scoping cases. Add an
          HTTP-level spec that boots a real Nest app from a testing module (the controller, the
          limiter, `NotifyBusService`, a fake `AccessCacheService`; `AdminGuard` with the fake) on
          an ephemeral port and uses `node:http` as `src/verify/__tests__/strip-cookie.controller.spec.ts`
          does. Set `SSE_KEEPALIVE_MS` small. Cover:
          - no cookie: status 401, a JSON body, `content-type` is not `text/event-stream`, the
            response ends, `openStreams` is 0
          - session and host: 200, `text/event-stream`, a keepalive arrives, and a
            `status-changed` event arrives after `publishStatusChange` for that user and host only
          - session, no host: 400
          - six streams open for one user: the seventh is 429; another user still gets 200
          - closing one of the six from the client frees a slot: `openStreams` drops to 5 and a new
            request gets 200
          - `/sse/admin`: 401 with no session, 403 for a non-admin, 200 for an admin, and admin
            streams count toward the same cap as pending streams
          - release runs once when both the teardown and the `close` event fire (the count never
            goes below zero)
          - limiter unit cases: default 6, env override, invalid env values fall back to 6, entry
            removed at zero
      - id: T3
        title: 'Live rig: the labels on Traefik v3.7.15 and SSE through the real image'
        after:
          - T1
          - T2
        files:
          - apps/auth/scripts/hardening-rig/
        status: done
        commit: 623437e1802084db75752d404a092c2f93ce16c2
        body: |-
          The specs for the previous two tasks fake two boundaries: Traefik reading Docker labels,
          and the Next rewrite proxy between the browser and the backend. Cross both for real, in
          throwaway containers, and report what you find. Also prove the cookie-drop label that a
          later phase puts on turbo and emby.

          Write the rig as scripts under `apps/auth/scripts/hardening-rig/` with a short README
          (what it checks, how to run it, that it always tears down). Read
          `apps/auth/scripts/cookie-rig/README.md` first and reuse its pieces: `rig.sh` for the
          structure and teardown, `mint-session.mjs` for a signed session cookie against a
          throwaway database (it refuses a `DATABASE_PATH` under `/data` or `/storage`), and
          `echo.mjs` as a backend that reports the headers it received.

          Hard rules, because the production Traefik watches the same Docker daemon:
          - Never put `traefik.enable=true` on a rig container. Production Traefik runs with
            `exposedByDefault=false` and ignores containers without it.
          - Run the rig's own `traefik:v3.7.15` with the Docker socket mounted read-only,
            `--providers.docker.exposedByDefault=true`, a constraint such as
            ``--providers.docker.constraints=Label(`hardening-rig`,`1`)``, the rig network as
            `--providers.docker.network`, and `web` plus `websecure` entrypoints (default
            self-signed certificate). No published ports.
          - Prefix every rig router, service and middleware name with `rig-`, and use hosts under
            `rig.test`.
          - After the rig is up, check `docker logs lilnas-traefik-1 --since 5m` shows no line
            mentioning `rig-` and no new error. If it does, tear down at once and report it.
          - Build the auth image once from this worktree with a throwaway tag
            (`docker build -f apps/auth/Dockerfile -t hardening-rig-auth:<random> .`), with no other
            docker build or jest run going. Run the backend from it with `node dist/main`, test
            values for every secret, a throwaway database, and the network alias `auth` on the rig
            network (production builds proxy to `http://auth:8081`); run the frontend from it with
            `node frontend/apps/auth/server.js` and `AUTH_BACKEND_URL=http://auth:8081`. Never use
            `apps/auth/deploy.yml`.
          - If the build fails on a base image, `docker pull` the `ghcr.io/codemonkey800/lilnas-*`
            images the Dockerfile names (local copies can be stale). Do not run
            `infra/base-images/build-base-images.sh`.

          Matrix. Generate the rig's labels from the lines in `apps/auth/deploy.yml` (renamed with
          the `rig-` prefix) so the test covers what will ship:
          1. Headers, over TLS through the rig Traefik to the frontend: `/login` is 200 with
             `strict-transport-security: max-age=31536000` (no `includeSubDomains`, no `preload`),
             `x-frame-options: DENY`, `x-content-type-options: nosniff` and
             `content-security-policy: frame-ancestors 'none'`. The same headers are on a 404.
          2. `x-powered-by` is absent on `/login`, both straight from the frontend container and
             through Traefik.
          3. In-flight limit, with the rig copy's `amount` lowered to 3 and the `ipstrategy` line
             kept: client container A holds 3 requests open; A's fourth is 429 and carries the
             security headers; at the same moment client container B (a different address) gets
             200. As a control, remove the `ipstrategy` line and show B is then refused too.
          4. SSE through Traefik, the Next rewrite and the backend (`SSE_KEEPALIVE_MS=1000`):
             - `/api/sse/pending?host=x.rig.test` with no cookie: 401 within a second, not a stream
             - with a minted session and a host: 200, `text/event-stream`, a keepalive arrives
             - six streams open for the minted user: the seventh is 429
             - close one client: within 5 s a new request is 200. This is the main risk: if the
               slot is not released through the Next proxy, report it as a blocking defect
             - `/api/sse/admin` with a minted admin session: 200; with no cookie: 401
          5. Cookie drop: a rig router in front of `echo.mjs` with
             `traefik.http.middlewares.rig-drop-cookies.headers.customrequestheaders.Cookie=` (empty
             value). Over HTTP/1.1 cleartext, HTTP/1.1 TLS and HTTP/2 TLS, with cookies in one
             header and split over two, and on a WebSocket upgrade: the backend receives no
             `Cookie` header at all, while `Authorization` and `X-Emby-Token` arrive unchanged. A
             control router without the middleware shows the cookies arriving.
          6. Sign-in still starts: `POST /api/auth/sign-in/social` through the rig with JSON
             `{"provider":"google","callbackURL":"/"}` and a matching `Origin` returns a Google
             URL. Print cookie names only.

          Report a table of case, expected, observed. Put every mismatch under `defects:`, marked
          blocking when it would break or weaken the first push. Show the teardown: no container,
          network, image or temp file left, and nothing in `docker ps -a` or `docker network ls`
          with the rig prefix.
      - id: H1
        title: Check whether a signed-in Emby web session uses cookies
        after: []
        files: []
        status: approved
        body: |-
          This decides whether emby gets the cookie-drop middleware in phase 4. That middleware
          deletes every cookie on requests to emby, so it is only safe if Emby uses none.

          Known so far: unauthenticated responses from `emby.lilnas.io` set no cookie, and the web
          client's API code has no `document.cookie` (it uses local storage and `X-Emby-Token`). A
          signed-in session has not been checked.

          Check, in a browser signed in to Emby at `https://emby.lilnas.io`:
          1. DevTools, Application, Cookies, `https://emby.lilnas.io`. Ignore
             `__Secure-lilnas-auth.*` (domain `.lilnas.io`): that is the cookie being removed. Is
             any other cookie listed?
          2. DevTools, Network: reload, start playing something, and look at a few responses from
             `/emby/...`. Does any carry a `Set-Cookie` header?

          Approve with a note:
          - `emby uses no cookies`: emby gets the middleware.
          - `emby uses cookies`: emby is left as it is, and only turbo gets the middleware.
      - id: H2
        title: Tighten the auth database directory on the host
        after: []
        files: []
        status: approved
        body: |-
          `/storage/app-data/lilnas-auth` is mode 755 and its files 644, so any host account can
          read emails, session tokens and Google OAuth tokens. There is also a stale copy,
          `lilnas-auth.db.bak-20261012-211150`. Everything is owned by your account (uid 1000,
          also the container's user), so no sudo and no restart are needed.

          Run:
          ```bash
          chmod 700 /storage/app-data/lilnas-auth
          chmod 600 /storage/app-data/lilnas-auth/lilnas-auth.db*
          # the October copy: delete it ...
          rm /storage/app-data/lilnas-auth/lilnas-auth.db.bak-20261012-211150
          # ... or keep it somewhere private instead:
          # install -d -m 700 /storage/backups/lilnas-auth && mv /storage/app-data/lilnas-auth/lilnas-auth.db.bak-20261012-211150 /storage/backups/lilnas-auth/
          ```

          Check:
          - `stat -c '%a %n' /storage/app-data/lilnas-auth /storage/app-data/lilnas-auth/*` shows
            700 for the directory and 600 for each file
          - `docker compose -p lilnas ps auth` is healthy, and a gated site still loads

          Limit: this locks out other host accounts only. Anything running as you, or as root,
          still reads the files.

          Approve when done. The note in `apps/auth/deploy.yml` is updated by another task.
  - key: '2'
    name: Ship push 1; tokens sent and accepted, not required
    tasks:
