      - id: T13
        title: Cookie-drop middleware on turbo and emby; coverage spec and README
        after:
          - T12
          - H1
        files:
          - infra/shared.yml
          - infra/media.yml
          - apps/auth/src/verify/__tests__/router-cookie-coverage.spec.ts
          - apps/auth/README.md
        status: todo
        body: |-
          The lilnas session cookie is scoped to `.lilnas.io`, so a signed-in browser sends it to
          `turbo.lilnas.io` and `emby.lilnas.io`, which have no auth middleware and must not depend
          on auth being up. Neither needs any cookie: turbo takes a bearer token from CI, emby's
          clients send `X-Emby-Token`. Give each router a plain Traefik `headers` middleware that
          deletes the `Cookie` request header. It is not forwardAuth and does not call the auth
          backend.

          Read the verdict of the human check on Emby that this task follows. If its note says
          emby uses cookies, leave `infra/media.yml` untouched, keep `emby` in `EXEMPT` below with
          that reason, and do everything else for turbo only. Say which case you took.

          `infra/shared.yml`, on the `turbo` service, replacing the comment line that says it has
          no auth or cookie-strip middleware:
          ```yaml
          # Drops every Cookie header before the cache sees the request, so a signed-in
          # browser's lilnas session cookie never reaches it. A plain headers middleware, not
          # forwardAuth: it does not depend on lilnas-auth being up. Only valid for an app that
          # uses no cookies (turbo takes a bearer token).
          - traefik.http.routers.turbo.middlewares=turbo-drop-cookies
          - traefik.http.middlewares.turbo-drop-cookies.headers.customrequestheaders.Cookie=
          ```
          `infra/media.yml`, on the `emby` service, the same two labels with `emby` in place of
          `turbo` and a comment that Emby's clients authenticate with `X-Emby-Token`.

          The second label ends in `=`: an empty value is how Traefik removes a request header.
          Keep `Cookie` capitalised. Change no other label, service or file under `infra/`; both
          files fail `prettier -c` at base, so match their style.

          `apps/auth/src/verify/__tests__/router-cookie-coverage.spec.ts`: add a fourth state.
          - A router is `dropped` when its `middlewares` names a middleware for which some service
            in the scanned compose files carries the label
            `traefik.http.middlewares.<name>.headers.customrequestheaders.Cookie` with an empty
            value.
          - Every `lilnas.io` router is exactly one of gated, stripped, dropped or exempt.
          - `EXPECTED_DROPPED` is exactly `['emby', 'turbo']` (or `['turbo']`), sorted.
          - A drop middleware sets no other label than that one, and a router that has it has
            neither `lilnas-auth` nor `lilnas-cookie-strip`.
          - `EXEMPT` loses `turbo` and `emby` (or only `turbo`); `auth` and `immich` stay.
          - Update the header comment of the spec.

          `apps/auth/README.md`, "Cookie forwarding": add a bullet for routers that drop every
          cookie (which ones, that it is a `headers` middleware with no auth dependency, and that
          it is only for apps that use no cookies), and take them out of the "still receiving the
          cookie" list. immich, `rocky-roads.lilnas.io` and bare dev routes stay on that list.

          Tests: the spec above. Show it fails when the drop label's value is made non-empty, when
          the router's `middlewares` label is removed, and when a drop middleware is added to a
          gated router; restore the files afterwards.
      - id: T14
        title: 'Expose convention: public dev routes use `lilnas-cookie-strip`'
        after:
          - T12
        files:
          - docs/lilnas-expose.md
          - plugins/lilnas/skills/expose/
        status: todo
        body: |-
          The expose convention puts a Docker Compose project outside this repo at
          `https://<name>.dev.lilnas.io`. It ships the `lilnas-auth` middleware by default and
          today says: to go public, remove the label. A route with no middleware receives the
          signed-in visitor's lilnas session cookie, which passes `/verify` for every host that
          visitor may reach.

          Change the convention, in `docs/lilnas-expose.md`,
          `plugins/lilnas/skills/expose/SKILL.md`,
          `plugins/lilnas/skills/expose/examples/docker-compose.yml`,
          `plugins/lilnas/skills/expose/reference/convention.md` and
          `plugins/lilnas/skills/expose/reference/caveats.md`:
          - `middlewares=lilnas-auth` stays the shipped default.
          - Going public means swapping the label to `middlewares=lilnas-cookie-strip`, never
            removing the middleware. Every instruction that says "remove the label" becomes
            "swap it", including the completion message the skill prints.
          - A route with neither middleware is not part of the convention; say why in one place
            (the cookie) and point to it from the others.
          - Keep the cost stated: a `lilnas-cookie-strip` route returns errors while the auth
            backend is down or restarting, and it is still open to the internet with no login.
          - The example compose file keeps `lilnas-auth` active and shows the swap as the
            commented alternative, on both example services.

          Keep the documents' structure and wording style; this is a rule change, not a rewrite.
          These files fail `prettier -c` at base: match their style and don't reformat. No code
          and no test changes. In your result, list each place the old "remove" instruction stood
          and what it says now (`grep -rn "remove" docs/lilnas-expose.md plugins/lilnas/skills/expose`
          should leave no instruction to drop the middleware).
