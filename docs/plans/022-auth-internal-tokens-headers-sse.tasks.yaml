          - `.env.example` of download, icloud-backup and dev: `AUTH_INTERNAL_TOKEN=` with a
            one-line comment (empty in dev: the dev auth does not enforce).
          - `apps/auth/.env.example`: the four `INTERNAL_TOKEN_*` names and
            `INTERNAL_TOKEN_ENFORCE`, commented out, with a short comment.
          - `docs/deploy.md`, Secrets: the count of env files and the `apps/{…}/.env.prod` list
            now include `dev` and `dev-idle-reaper`.

