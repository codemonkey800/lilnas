nexus-tasks: 1
phases:
  - key: '1'
    name: Cookie strip in the auth app
    tasks:
      - id: T1
        title: Unique cookie prefix and a one-time revoke of every session
        after: []
        files:
          - apps/auth/src/auth/
          - apps/auth/src/verify/
          - apps/auth/src/db/migrations/
          - apps/auth/src/db/__tests__/
          - apps/auth/src/app/
          - apps/auth/README.md
          - apps/auth/.env.example
        status: done
        commit: 30af36879c3ce76ebe28689a2bc827b751e584a6
        body: |-
          Give lilnas-auth's Better Auth cookies a unique prefix, and delete every existing session
          once.

          Why: Better Auth's default cookie name (`better-auth.session_token`, with `__Secure-` in
          front on https) is also used by other apps under `*.lilnas.io` that run their own Better
          Auth (see `apps/tdr-code/src/proxy.ts`). Later tasks strip lilnas-auth's cookies by name
          before a request reaches a backend, so the names have to be unambiguous first. A token
          signed before the rename would still be valid if sent under the new name, so all session
          rows are deleted when the new image first boots. Everyone signs in again once; that is
          accepted.

          Changes:
          1. New `apps/auth/src/auth/cookie-names.ts`:
             ```ts
             export const COOKIE_PREFIX = 'lilnas-auth'
             export const SECURE_COOKIE_PREFIX = '__Secure-'
             /** `lilnas-auth.session_token` (http) and `__Secure-lilnas-auth.session_token` (https). */
             export const SESSION_COOKIE_NAMES: readonly [string, string]
             ```
          2. `src/auth/auth.ts`: add `cookiePrefix: COOKIE_PREFIX` under `advanced`, beside
             `crossSubDomainCookies`. Change no other Better Auth option.
          3. `src/verify/access-cache.service.ts`: `SESSION_COOKIE_NAMES` now comes from
             `cookie-names.ts`. The old names are no longer matched. Fix the comments that say the
             default prefix applies.
          4. A migration `src/db/migrations/0007_revoke_sessions_cookie_rename.sql` containing
             `DELETE FROM session;`, with its `meta/_journal.json` entry (`idx: 7`, `when` later
             than every existing entry). Generate it with
             `pnpm --filter @lilnas/auth exec drizzle-kit generate --custom --name=revoke_sessions_cookie_rename`.
             If drizzle-kit also wants to emit schema changes, stop and report that instead of
             committing them. `src/db/database.module.ts` already applies the folder at boot with
             drizzle's `migrate()`; it needs no change.
          5. `README.md` and `.env.example`: update wherever they name the cookie.

          Edge cases:
          - Dev (http `AUTH_HOST`) names have no `__Secure-`; prod (https) names do. Both forms stay
            matched by exact name.
          - `extractSessionCookieValue` keeps exact-name matching: `xlilnas-auth.session_token`,
            `lilnas-auth.session_tokenx` and both old `better-auth.session_token` forms return null.
          - `oauth_access_token` and `oauth_refresh_token` reference `session` (see
            `src/db/schema.ts`). The DELETE must succeed with `foreign_keys = ON` while rows in
            those tables point at a session.
          - Don't touch `apps/tdr-code`.

          Tests (extend the specs under `src/verify/__tests__`, `src/auth/__tests__`,
          `src/db/__tests__`; the session helper is `src/verify/__tests__/helpers/session-fixtures.ts`):
          - the sign-in callback sets `lilnas-auth.session_token` for an http `AUTH_HOST` and
            `__Secure-lilnas-auth.session_token` for an https one, with `Domain=` equal to
            `COOKIE_DOMAIN`, and sets no cookie whose name contains `better-auth`
            (`auth-mount.spec.ts` already drives the callback)
          - a real session sent under the old cookie name does not resolve: `resolveSession` finds
            no session and the `/verify` decision is a redirect
          - the `extractSessionCookieValue` cases above
          - the migration: build a database from migrations 0000 to 0006 only (copy the folder to a
            temp dir without 0007 and its journal entry), insert a user, a session, a grant, and an
            oauth token row that references the session if the schema allows one; then migrate with
            the full folder and assert `session` is empty, the user and grant remain, and a second
            `migrate()` changes nothing
          - specs under `src/app/**/__tests__` use `better-auth.session_token=abc123` as an opaque
            string; change them to the new name so no test documents the old one
      - id: T2
        title: '`/verify` returns the cookies minus lilnas-auth''s own on ALLOW'
        after:
          - T1
        files:
          - apps/auth/src/verify/
        status: done
        commit: 2a28fd43396aeb7fa226c80aaadd6d1274877653
        body: |-
          On an ALLOW, `/verify` returns a `Cookie` response header holding the request's cookies
          with every lilnas-auth cookie removed, and no `Cookie` header when nothing else remains.

          How Traefik uses it: for each header named in a forwardAuth middleware's
          `authResponseHeaders`, Traefik deletes that header from the client's request and then
          copies it from the auth response. An absent response header therefore means the backend
          gets none. `Cookie` is not in that list yet; a later task adds it after this code is
          deployed. Until then Traefik ignores the new header, so this task changes nothing for
          users.

          Changes:
          1. New `apps/auth/src/verify/strip-auth-cookies.ts`:
             ```ts
             /**
              * The Cookie header value with every lilnas-auth cookie removed, or undefined
              * when no other cookie remains (the caller then sends no header at all).
              */
             export function stripAuthCookies(cookieHeader: string | undefined): string | undefined
             ```
             - Split on `;`. A pair's name is the text before its first `=`, trimmed.
             - Remove a pair when its name starts with `lilnas-auth.` or `__Secure-lilnas-auth.`.
               Build both from `COOKIE_PREFIX` and `SECURE_COOKIE_PREFIX` in
               `src/auth/cookie-names.ts`. This covers `session_token`, `session_data`,
               `account_data`, `dont_remember` and the OAuth state cookies.
             - Case-sensitive, and the prefix must match from the first character of the name:
               `xlilnas-auth.session_token` and `better-auth.session_token` are kept.
             - Kept pairs are trimmed of surrounding whitespace and otherwise unchanged byte for
               byte (values containing `=`, `%` or quotes; pairs with no `=`), in their original
               order, joined with `; `. Empty segments are dropped.
             - `undefined`, empty or whitespace-only input returns `undefined`. So does a header
               with nothing left.
          2. `apps/auth/src/verify/verify.controller.ts`, ALLOW branch only: after the identity
             headers, set the `Cookie` response header to `stripAuthCookies(req.headers.cookie)`
             when it is defined. If sanitizing or `setHeader` throws, send no `Cookie` header (the
             backend then gets no cookies, which is the safe direction), log a warning with no
             cookie content, and still answer 200. The redirect and 500 branches do not change.
          3. Export `VERIFY_SANITIZED_HEADERS = ['Cookie'] as const` beside
             `VERIFY_RESPONSE_HEADERS` and use it for the header name. Leave
             `VERIFY_RESPONSE_HEADERS` and `__tests__/auth-response-headers.spec.ts` alone:
             `infra/proxy.yml` still lists exactly the two identity headers and that spec must keep
             passing unmodified.

          Tests:
          - a unit spec for `stripAuthCookies` covering each rule above, plus: both name forms in
            one header; the same stripped name twice; a kept cookie whose value contains the text
            `lilnas-auth.session_token=`; a 4 KB header
          - controller level (the "VerifyController integration" block in
            `__tests__/verify.service.spec.ts` shows the wiring): ALLOW with a session and other
            cookies returns `Cookie` equal to the others; ALLOW with only the session cookie returns
            no `Cookie` header; redirect and 500 return none; the identity headers are unchanged;
            `Set-Cookie` is never set
      - id: T3
        title: Always-allow `/strip-cookie` endpoint and a public-allowlist spec
        after:
          - T2
        files:
          - apps/auth/src/verify/
          - apps/auth/src/app.module.ts
          - apps/auth/README.md
        status: done
        commit: 2534bbe5468e3742458552ebeaf5ec9560e8d80c
        body: |-
          Add a backend endpoint that allows every request and only sanitizes cookies. Traefik
          routers with no auth never call `/verify`, so a later task points a second forwardAuth
          middleware at this endpoint for them.

          ```ts
          // apps/auth/src/verify/strip-cookie.controller.ts
          @Controller('strip-cookie')
          export class StripCookieController {
            @All()
            strip(@Req() req: Request, @Res() res: Response): void
          }
          ```
          - Always 200 with an empty body. The `Cookie` response header is
            `stripAuthCookies(req.headers.cookie)` (from `src/verify/strip-auth-cookies.ts`) when
            defined, and is omitted otherwise. Handle a throw the same way the ALLOW branch of
            `verify.controller.ts` does: no header, a warning with no cookie content, still 200.
          - No session lookup, no database, and no call to `GatedHostsService.recordSeen` or
            `HostActivityService.recordVisit`: these hosts are not gated, and recording them would
            list them as gated in `/admin`. The controller injects neither service.
          - `@All()` for the reason given in `VerifyController`'s comment.
          - Register it in `src/app.module.ts`.
          - It is reachable on the backend port only. Do not add a rewrite for it.

          New spec `apps/auth/src/verify/__tests__/public-allowlist.spec.ts`, a guard for what the
          internet can reach on the backend: load `apps/auth/next.config.js`, call `rewrites()`,
          and assert the `source` list is exactly `/api/auth/:path*`,
          `/.well-known/openid-configuration`, `/.well-known/oauth-authorization-server`,
          `/api/sse/:path*`, and that no destination path starts with `/verify`, `/strip-cookie`,
          `/internal`, `/admin`, `/me`, `/requests` or `/health`. Do not assert the destination
          host; a later task changes it.

          `README.md`: add `/strip-cookie` to the backend's routes in the "Two-process topology"
          table, with one line on what it is for.

          Tests for the controller (imitate how `src/auth/__tests__/auth-mount.spec.ts` or the
          VerifyController block in `verify.service.spec.ts` drive HTTP): no cookie gives 200 and
          no header; a lilnas-auth session cookie plus others gives the others; only the session
          cookie gives no header; another app's `__Secure-better-auth.session_token=x` is
          preserved; GET and POST both give 200.
      - id: T4
        title: Verification kit, and the isolated Traefik rig against the real backend
        after:
          - T3
        files:
          - apps/auth/scripts/cookie-rig/
        status: done
        commit: b43d6a3acfc25831ed9bf31478dd3276bbc89c18
        body: |-
          Build a small verification kit under `apps/auth/scripts/cookie-rig/`, then use it to prove
          the cookie strip end to end against the real Nest backend and traefik:v3.7.15 (the
          production version). An earlier rig with a fake auth server passed over HTTP/1.1 only.
          HTTP/2 on a TLS entrypoint and WebSocket upgrades are unverified and are the point of
          this task. Later tasks reuse the kit on production.

          Kit files (plain Node, no dependencies, prettier-clean):
          - `echo.mjs`: an HTTP and WebSocket echo server on `PORT`.
            - `GET /json` returns `{ httpVersion, method, cookieNames, authCookiePresent,
              forwardedUser, forwardedUserId, cookieHeaderCount }`. `authCookiePresent` is true when
              any cookie name starts with `lilnas-auth.` or `__Secure-lilnas-auth.`. Cookie values
              are included (as `cookies`) only when `ECHO_VALUES=1`.
            - `GET /` returns an HTML page that fetches `/json`, opens a WebSocket to `/ws`, and
              shows one PASS or FAIL banner (FAIL when `authCookiePresent` is true on either), the
              cookie names, `X-Forwarded-User`, and
              `performance.getEntriesByType('navigation')[0].nextHopProtocol`.
            - `/ws`: handle the `upgrade` event by hand, send one text frame with the same JSON for
              the upgrade request, then close.
            - It never logs or returns a cookie value without `ECHO_VALUES=1`.
          - `mint-session.mjs`: for throwaway databases only. Inserts a user and a session and
            prints a signed session cookie pair that the running backend accepts. Read how Better
            Auth signs the cookie (`better-auth` 1.7.12, `dist/cookies`) instead of guessing. It
            exits non-zero when `DATABASE_PATH` is under `/data` or `/storage`.
          - `rig.sh` with its Traefik file-provider config, and `client.mjs`: start the rig, run the
            matrix below, exit 1 on any mismatch, and always tear down.
          - `canary.private.yml` and `canary.shared.yml`: compose files for a canary on the
            production Traefik, run later by other tasks, not now. One service
            `cookie-canary-echo` (image `node:22-alpine`, `echo.mjs` mounted read-only, no
            `ECHO_VALUES`), network `lilnas-proxy` only (external), labels `traefik.enable=true`,
            `traefik.docker.network=lilnas-proxy`, `lilnas.idle-reap.enabled=false`, and two
            routers on `entrypoints=websecure` with `tls=true` (never `tls.certresolver`):
            `dev-cookie-canary` on `Host(cookie-canary.dev.lilnas.io)` and `dev-cookie-canary-open`
            on `Host(cookie-canary-open.dev.lilnas.io)`.
            - `canary.private.yml` defines its own middlewares on the same container:
              `dev-cookie-canary-auth` (forwardauth address `http://auth:8081/verify`,
              `authResponseHeaders=X-Forwarded-User,X-Forwarded-User-Id,Cookie`,
              `preserveLocationHeader=true`, no `trustForwardHeader`) on the first router, and
              `dev-cookie-canary-strip` (address `http://auth:8081/strip-cookie`,
              `authResponseHeaders=Cookie`) on the second.
            - `canary.shared.yml` uses `middlewares=lilnas-auth` and
              `middlewares=lilnas-cookie-strip` instead and defines none.
            - See `docs/lilnas-expose.md` and
              `plugins/lilnas/skills/expose/reference/naming-safety.md` for the label convention.
          - `README.md`: what each file is for and how to run it.

          The rig (everything on one new docker network with a unique name, no published ports):
          - the real backend from this worktree: build it (`pnpm --filter @lilnas/auth build:backend`,
            building `@lilnas/utils` first if needed) and run `node dist/main` with the worktree
            mounted, in a container whose Node major matches the host's (`node --version`; a
            matching `node:` image is local) so the native `better-sqlite3` loads. Use test env
            values only, an https `AUTH_HOST`, a throwaway `DATABASE_PATH`, and the minted user's
            email in `ADMIN_EMAILS` so `/verify` allows it on any host
          - `traefik:v3.7.15` with a file provider, entrypoints `web` and `websecure` (default
            self-signed certificate), and three routers to the echo backend: `gated` (forwardAuth
            to `/verify` with `authResponseHeaders` `X-Forwarded-User`, `X-Forwarded-User-Id`,
            `Cookie`), `open` (forwardAuth to `/strip-cookie` with `authResponseHeaders` `Cookie`),
            and `baseline` (forwardAuth to `/verify` without `Cookie`, as production is today)
          - the echo backend with `ECHO_VALUES=1`, and the client in a container on the network
          - first confirm `/verify` called directly returns 200 for the minted cookie

          Matrix. Run every HTTP case over HTTP/1.1 cleartext, HTTP/1.1 on TLS, and HTTP/2 on TLS
          (assert the negotiated protocol really is h2):
          1. baseline, session + another cookie: the session cookie reaches the backend (control)
          2. gated, session + others: only the others arrive, same order and bytes;
             `X-Forwarded-User` is the minted email
          3. gated, session only: the backend sees no `Cookie` header
          4. gated, no cookie: 302 to the login page
          5. gated, the session value sent under the old name `__Secure-better-auth.session_token`
             only: 302
          6. gated, session + `lilnas-auth.session_data=x` + `__Secure-lilnas-auth.dont_remember=1`
             + another: only the other arrives
          7. gated, forged `X-Forwarded-User` and `X-Forwarded-User-Id`: overwritten
          8. gated, cookies split over two `Cookie` headers (HTTP/1.1) and over separate cookie
             header fields (HTTP/2): merged, session stripped
          9. gated, a POST with a 1 MB body: arrives intact
          10. open, no cookie: 200, no `Cookie` header
          11. open, session + other: only the other
          12. open, session only: none
          13. open, another app's `__Secure-better-auth.session_token=keep`: arrives unchanged
          14. WebSocket upgrade through gated and through open with session + other: 101, and the
              upgrade request the backend saw carries only the other cookie
          15. open with the backend stopped: record the status code Traefik returns

          Result: the matrix as a table of expected against observed, the Traefik and Node
          versions, and proof of cleanup (`docker ps -a`, `docker network ls`, temp paths). Report
          every mismatch under `defects:`. Any mismatch in cases 2 to 14 is blocking, because it
          means the approach does not hold on that transport.
  - key: '2'
    name: Ship the auth image, prepare the labels
    tasks:
      - id: H1
        title: 'Go/no-go: push the auth image (signs everyone out once)'
        after:
          - T4
        files: []
        status: approved
        body: |-
          Approving lets the next task push phase 1 to `main`. CI then rebuilds and redeploys the
          `auth` service only.

          What the deploy does:
          - renames the session cookie to `__Secure-lilnas-auth.session_token` and deletes every
            session row on boot, so everyone is signed out once
          - makes `/verify` return a sanitized `Cookie` header, which Traefik ignores until the
            labels change, and adds `/strip-cookie` on the backend port
          - restarts auth: gated sites return errors for about 10 s

          Before approving:
          - read T4's result: every matrix case passed on HTTP/2 and WebSocket, and nothing was
            left running
          - read the phase 1 review
          - pick a quiet time, and don't push anything else to `main` until the push task has
            finished (it stops if `origin/main` has moved)

          Rollback, by you, if gated sites break:
          `cd /opt/lilnas && sudo -u deploy env LILNAS_TAG=<sha before the push> docker compose up -d auth`.
          The push task reports that sha. Sessions stay deleted either way.

          Request changes to hold the push.
      - id: T5
        title: Push the auth image to main, watch CI, verify production
        after:
          - H1
        files: []
        status: done
        commit: e227add1a7a3517d37296fcecdf78571da25dd97
        body: |-
          A human approved this push. Push the cookie work in `apps/auth` to `main`, watch the
          deploy, and verify production. Commit nothing.

          Before pushing, all of these must hold. If one does not, stop and report it without
          pushing:
          - `git fetch origin main`, then `git merge-base --is-ancestor origin/main HEAD` succeeds
            (never rebase, merge or force)
          - `git diff --stat origin/main..HEAD` touches only `apps/auth/**` and `docs/plans/**`.
            Anything under `infra/`, `plugins/` or another app's `deploy.yml` means the Traefik
            labels would ship too early
          - `HEAD` contains the work: `apps/auth/src/verify/strip-cookie.controller.ts`,
            `apps/auth/src/auth/cookie-names.ts`, the `0007` migration and
            `apps/auth/scripts/cookie-rig/` exist
          - `pnpm lilnas ci detect --base origin/main --head HEAD --json` lists image `auth` only,
            and `pull` is `["auth"]`
          - record `git rev-parse origin/main` as the rollback sha

          Push with `git push origin HEAD:main`. Find the run with
          `gh run list --workflow ci.yml --branch main --event push --limit 5 --json databaseId,headSha,status,url`
          (match `headSha`) and follow it with `gh run watch <id> --exit-status`. If the run is red
          or the auth image was held back, report it with the failing job's log and stop: the old
          image is still running, and that is safe.

          After the deploy, check production (read-only):
          - `docker compose -p lilnas ps auth` shows a new, healthy container;
            `docker logs lilnas-auth-1 --since 15m` has no error and shows the migration ran
          - inside the container (`docker exec lilnas-auth-1 node -e ...` with `fetch` against
            `http://localhost:8081`): `/strip-cookie` with
            `Cookie: __Secure-lilnas-auth.session_token=x; a=1; __Secure-better-auth.session_token=y`
            answers 200 with `Cookie: a=1; __Secure-better-auth.session_token=y`; with only the
            lilnas-auth cookie it answers 200 and no `Cookie` header; `/verify` with no cookie,
            `X-Forwarded-Host: sonarr.lilnas.io` and `X-Forwarded-Proto: https` answers 302 to
            `https://auth.lilnas.io/login...`
          - the session table was emptied: a read-only row count from inside the container
            (`better-sqlite3` with `{ readonly: true }` on `/data/lilnas-auth.db`) is small, and
            every row was created after the deploy. Print counts only
          - from the internet: `https://auth.lilnas.io/login` is 200, `/api/auth/ok` is 200,
            `/.well-known/openid-configuration` is 200; `/verify`, `/strip-cookie`,
            `/internal/host-activity?host=x.lilnas.io&hours=1`, `/admin/check?email=a@b.c`, `/me`,
            `/health` and `/requests/status` on `auth.lilnas.io` are all 404;
            `https://sonarr.lilnas.io/` is a 302 to the login page
          - starting a sign-in (`POST https://auth.lilnas.io/api/auth/sign-in/social` with JSON
            `{"provider":"google","callbackURL":"/"}` and `Origin: https://auth.lilnas.io`) returns
            a Google URL and sets cookies whose names start with `__Secure-lilnas-auth.` with
            `Domain=.lilnas.io`, and none containing `better-auth`. Print names and attributes only

          Report the pushed sha, the rollback sha, the CI run URL, each check with what you
          observed, and this rollback command for the human:
          `cd /opt/lilnas && sudo -u deploy env LILNAS_TAG=<rollback sha> docker compose up -d auth`.
          Do not run it yourself. Put any failed check under `defects:`.
      - id: T6
        title: Start the canary on the production Traefik with private middlewares
        after:
          - T5
        files: []
        status: done
        commit: bf5e9111a054aab0316a82db03e63655d4f0dcda
        body: |-
          Production's auth backend now returns a sanitized `Cookie` header on `/verify` and
          serves `/strip-cookie`, but the shared Traefik middlewares do not use them yet. Start a
          canary that does, so the strip is exercised on the real Traefik (TLS, HTTP/2,
          WebSocket) for two throwaway hosts before the shared middlewares change. Commit nothing.

          Steps:
          1. Copy `apps/auth/scripts/cookie-rig/echo.mjs` and `canary.private.yml` to
             `/tmp/lilnas-cookie-canary/` (the worktree may be deleted while the canary is still
             needed) and run
             `docker compose -p cookie-canary -f /tmp/lilnas-cookie-canary/canary.private.yml up -d`.
             This is its own compose project on the external `lilnas-proxy` network, the
             documented way to expose a dev service (`docs/lilnas-expose.md`); it is not the
             `lilnas` project.
          2. With no session, `https://cookie-canary.dev.lilnas.io/` must be a 302 to
             `https://auth.lilnas.io/login...`.
          3. On `https://cookie-canary-open.dev.lilnas.io/json`, with fake values only:
             - `curl --http2` with
               `Cookie: __Secure-lilnas-auth.session_token=fake.sig; theme=dark; __Secure-better-auth.session_token=keep`:
               `cookieNames` is `theme` and `__Secure-better-auth.session_token`,
               `authCookiePresent` is false, and curl's `%{http_version}` is 2
             - the same over `--http1.1`
             - over HTTP/2 with the cookies split across two `cookie:` headers: same result
             - only the lilnas-auth cookie: `cookieNames` is empty
             - no cookie: `cookieNames` is empty, status 200
             - a WebSocket upgrade to `wss://cookie-canary-open.dev.lilnas.io/ws` (a short Node
               script) with the first cookie set: the frame shows `authCookiePresent` false and
               the other two names
          4. `docker logs lilnas-auth-1 --since 5m` shows no error from these requests.

          Leave the canary running; a human checks the gated host next and a later task removes
          it. Report both URLs, each observation, and the removal command
          (`docker compose -p cookie-canary down` and `rm -rf /tmp/lilnas-cookie-canary`). If a
          check fails, stop the canary, remove the temp dir, and report it under `defects:` as
          blocking.
      - id: H2
        title: Sign in again and check the gated canary in your browser
        after:
          - T6
        files: []
        status: todo
        body: |-
          The new auth image is live and you were signed out. Check what an agent can't:
          1. Open `https://auth.lilnas.io` and sign in with Google. In devtools, Application,
             Cookies: there is a `__Secure-lilnas-auth.session_token` on `.lilnas.io`.
          2. Open two gated apps, for example `https://sonarr.lilnas.io` and
             `https://grafana.lilnas.io`. They load as before.
          3. Open `https://cookie-canary.dev.lilnas.io`. The banner says PASS; the page shows your
             email as `X-Forwarded-User`, protocol `h2` (or `h3`), no `lilnas-auth` cookie among
             the cookie names for the page or the WebSocket, and any other cookies by name.
          4. Open `https://cookie-canary-open.dev.lilnas.io`. PASS as well.
          5. Sign in to `https://tdr-code.lilnas.io` as usual. It still works.

          Approve if all five hold. Request changes with what you saw otherwise. If sign-in itself
          is broken, roll back with the command in T5's result.
      - id: T7
        title: 'Traefik labels: `Cookie` on lilnas-auth, the strip middleware, six open routers'
        after:
          - T5
        files:
          - infra/proxy.yml
          - infra/shared.yml
          - apps/dashcam/deploy.yml
          - apps/equations/deploy.yml
          - apps/theater/deploy.yml
          - apps/tdr-code/deploy.yml
          - apps/auth/src/verify/
          - apps/auth/src/services/__tests__/
        status: done
