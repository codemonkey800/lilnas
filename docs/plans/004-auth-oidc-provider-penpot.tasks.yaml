             earlier by `manage.py`, with its projects) with no password prompt and no
             lilnas consent screen. Note: because the profile was created with a
             password, Penpot links it through lilnas's verified email claim.
          2. In a private window: sign in to lilnas as fallenskateboarder808@gmail.com
             (no grants). Open https://penpot.lilnas.io → ForwardAuth should already
             send you to lilnas-auth's pending page for penpot.lilnas.io; that is the
             outer gate. To test the OIDC gate itself, open
             https://auth.lilnas.io/api/auth/oauth2/authorize?response_type=code&client_id=penpot&redirect_uri=https%3A%2F%2Fpenpot.lilnas.io%2Fapi%2Fauth%2Foidc%2Fcallback&scope=openid%20profile%20email&state=e2e
             in that window: expect a redirect to
             https://auth.lilnas.io/pending?redirect=https%3A%2F%2Fpenpot.lilnas.io%2F
             and NO code in any URL.
          3. In https://auth.lilnas.io/admin grant that account `penpot.lilnas.io`,
             then in the private window open https://penpot.lilnas.io again and click
             "lilnas": expect Penpot's one-time "create account" form (name prefilled),
             then the workspace. Revoke the grant afterwards and confirm a fresh
             authorize URL (step 2) goes back to /pending.
          4. Optional: block the account in /admin and repeat step 2 → /blocked.
          Approve if all of 1–3 behave as described. If something fails, Request
          changes with what you saw (URL, page, console/network error) so a fix task
          can be written. After Land, redeploy from `/home/jeremy/lilnas` once
          (`docker-compose up -d auth penpot-frontend`) so the containers' bind mounts
          point at the main checkout instead of the run's worktree.
