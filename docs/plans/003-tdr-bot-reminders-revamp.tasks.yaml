          Add `apps/tdr-bot/src/api/reminders.controller.ts` (`@Controller('reminders')`,
          registered in `api.module.ts`, which imports `RemindersModule`) backed by
          `ReminderService` and the discord `Client`:
          ```
          GET    /reminders?status=active|completed|cancelled|missed|all&userId=   → ReminderView[]   (status default active)
          GET    /reminders/members                                                 → MemberInfo[]
          POST   /reminders/preview   { schedule }                                  → { runs: string[]; description: string }
          POST   /reminders           CreateReminderBody                            → ReminderView (201)
          PATCH  /reminders/:id       UpdateReminderBody                            → ReminderView
          DELETE /reminders/:id                                                     → ReminderView (now cancelled)
          ```
          Types in `api.types.ts`:
          ```ts
          export interface ReminderView {
            id: string; status: ReminderStatus; source: ReminderSource; what: string
            userId: string; userName: string; targetUserId: string | null; targetUserName: string | null
            guildId: string; channelId: string | null; channelName: string | null
            isRecurring: boolean; cronExpression: string | null; scheduledAt: string | null
            endsAt: string | null; scheduleDescription: string; nextRunAt: string | null
            lastRunAt: string | null; runCount: number; actionType: ReminderActionType
            createdAt: string; updatedAt: string; cancelledAt: string | null
          }
          export interface MemberInfo { id: string; username: string; displayName: string; avatarUrl: string | null }
          export type ScheduleBody = { kind: 'once'; at: string } | { kind: 'recurring'; cron: string; endsAt?: string | null }
          export interface CreateReminderBody { userId: string; what: string; schedule: ScheduleBody; scheduleDescription?: string; channelId?: string | null; targetUserId?: string | null; actionType?: ReminderActionType }
          export type UpdateReminderBody = Partial<Omit<CreateReminderBody, 'userId'>>
          ```
          `reminders.schema.ts` holds the zod schemas for the three bodies (zod 4:
          `z.iso.datetime({ offset: true })` for dates, `.strict()` objects,
          `what` trimmed 1–500, cron non-empty) used through `ZodValidationPipe`.
          `reminder-views.ts` exports `toReminderView(row, resolve)` where `resolve`
          is `{ userName(id): string | null; channelName(id): string | null }`; the
          controller builds it from `client.users.cache` / the guild's
          `members.cache` (display name, falling back to the stored `userName`, then
          the id) and `client.channels.cache`. Dates are ISO strings.

