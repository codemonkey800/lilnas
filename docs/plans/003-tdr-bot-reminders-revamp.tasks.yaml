            Status chip (ok=active, muted=completed, warn=missed, bad=cancelled),
            What, Who ("jeremy → @sam" when a target differs from the creator; "admin"
            when created from this page), Schedule (human line, e.g. "every Tuesday at
            10:00 AM", with the cron in monospace under it or "once"), Next run
