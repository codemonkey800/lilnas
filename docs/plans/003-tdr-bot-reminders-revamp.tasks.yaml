            row actions Edit and Cancel (Cancel hidden unless active). Ten rows mixing
            one-time and recurring, every status, every action type, a targeted
            reminder, an admin-created one, an ended recurring one.
          - **Mobile** (narrow frame ≤ 420 px): the same list as stacked cards: what,
