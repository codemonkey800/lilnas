        status: done
        commit: 1a775afcfb2306c0855af66bd94eee62e68f75ea
        body: |-
          Replace `apps/tdr-bot/src/llm/skills/reminder.skill.ts` (delete it and its
          test) with a `src/llm/skills/reminder/` directory laid out like `chat/` and
          `math/`: `skill.ts` (`ReminderSkill`, id `reminder`), `prompts.ts`
          (extraction, topic-switch, cancel-resolution, ask-missing and confirm
          prompts — moved out of `src/reminders/reminder.prompts.ts`, which keeps only
          the three delivery prompts), `schemas.ts` (LLM output schemas, moved out of
          `src/reminders/reminder.types.ts`, which keeps `ReminderActionType`),
          `format.ts` (deterministic reply text) and `__tests__/`. Update every
          import, including `src/llm/testing/live/*.live.test.ts` and the
          `reminder.prompts.test.ts` / `reminder.types.test.ts` under
          `src/reminders/__tests__/`. Register the new class in `skills.module.ts`.

          Schemas (strict-output safe: every field required, nullable not optional):
          ```ts
          export const ReminderIntentSchema = z.object({
            action: z.enum(['create', 'list', 'cancel', 'cancel_all']),
            what: z.string().max(500).nullable(),
            isRecurring: z.boolean().nullable(),
            day: z.string().nullable(),                 // same rules as today's prompt
            time: z.string().nullable(),
            scheduleDescription: z.string().nullable(), // "tomorrow at 9:00 AM", "every Tuesday at 10:00 AM until Nov 1"
            scheduledAt: z.string().nullable(),         // ISO local, one-time only
            cronExpression: z.string().nullable(),      // recurring only
            endsAt: z.string().nullable(),              // ISO local, recurring only ("until Friday", "for two weeks")
            channelId: z.string().nullable(),
            targetUserId: z.string().nullable(),
            actionType: z.enum(ReminderActionType),
          })
          export const CancelResolutionSchema = z.object({ matchIds: z.array(z.string()), confident: z.boolean() })
          export const ContinuationSchema = z.object({ continuing: z.boolean() })
          export type ReminderFollowUp =
            | { stage: 'create'; partial: Partial<ReminderIntent> }
            | { stage: 'cancel'; candidateIds: string[]; rounds: number }
            | { stage: 'cancelAll'; ids: string[] }
          ```
          LLM operations: `reminder.extract` (reasoning; prompt built with now +
          weekday + `REMINDER_TIMEZONE` + existing partial, keep today's examples and
          add ones for `cancel_all`, `endsAt` and `scheduleDescription`),
          `reminder.topicSwitch` (reasoning, `ContinuationSchema`, falls back to
          continuing on error), `reminder.resolveCancel` (reasoning,
          `CancelResolutionSchema`; input is a numbered JSON list of the user's active
          reminders `{ id, index, what, scheduleDescription, isRecurring }` plus the
          message), `reminder.askMissing` and `reminder.confirm` (chat, as today).

          Flow in `run()`:
          - With a live follow-up: run the topic-switch check first; `continuing:
            false` → `{ messages: [], followUp: null, reroute: true }`.
          - `create`: merge non-null fields over the partial; missing `what` or `day`
            → ask (`reminder.askMissing`) and return `{ stage: 'create', partial }`.
            Build the `ReminderSchedule` (`isRecurring` ? `{ kind: 'recurring', cron,
            endsAt }` : `{ kind: 'once', at: new Date(scheduledAt) }`); a one-time
            `at` that is invalid or in the past replies "that time has already
            passed, when should I remind you?" and keeps a `create` follow-up with
            `day`/`time`/`scheduledAt` cleared; an invalid or sub-minute cron replies
            likewise with `cronExpression` cleared. No `guildId` → the existing
            DM-refusal text. Call `reminderService.create({ userId, userName:
            input.discord.username, guildId, what, schedule, scheduleDescription,
            channelId, targetUserId, actionType })`; a `ReminderError` becomes
            friendly text from a `code → message` map in `format.ts` (e.g.
            `limit_reached` → "you already have 25 active reminders — cancel one
            first"). Confirm via `reminder.confirm` with the details block as today
            (what, schedule description, next run formatted `MMM D, YYYY [at] h:mm A`,
            channel, target, ends).
          - `list`: `formatReminderList(reminders, userId)` — deterministic: "You have
            N reminders:" then one numbered line each: `**what** — schedule
            description · next <MMM D, h:mm A>` with "(recurring)", "(for @<target>)"
            when the user is the target or creator respectively, "in #<channel>" when
            set, "until <date>" when it ends; "You don't have any reminders right now."
            when empty. No LLM call.
          - `cancel_all`: none active → the empty text; otherwise the list plus "Reply
            **yes** to cancel all N." and `{ stage: 'cancelAll', ids }`. On that
            follow-up: `/^\s*(y|yes|yep|yeah|yup|sure|do it|confirm)\b/i` →
            `cancelAllForUser` → "Cancelled N reminders."; any other continuing
            message → "Okay, I kept them." and clear.
          - `cancel`: none active → the empty text. Otherwise `reminder.resolveCancel`
            over the active list; exactly one id and `confident` → `cancel(id, {
            userId })` → `formatCancelled(reminder)` ("Cancelled: **what** — schedule");
            zero → "I couldn't tell which one you meant:" + the numbered list and `{
            stage: 'cancel', candidateIds: all, rounds: 1 }`; several → "Which one?" +
            the numbered candidates and the same follow-up. On a `cancel` follow-up:
            a bare number or ordinal in 1..n resolves deterministically, otherwise
            `reminder.resolveCancel` against the candidates only; still ambiguous
            after `rounds` reaches 2 → "Let's start over — tell me which reminder to
            cancel." and clear. A `forbidden`/`not_active` error → "That reminder is
            already gone." plus the fresh list.
          - Fast path: `match()` returns true for messages starting with `remind
            me|us|<@…>`, `set (up )?(a )?reminder`, `list|show|what are|what's|do i
            have … reminders`, or `cancel|delete|remove|clear … reminder(s)`
            (case-insensitive, leading whitespace allowed). Keep the id and
            description text so `router-cases.ts` still routes.

          Golden data: keep every current reminder router case, add "remove my dentist
