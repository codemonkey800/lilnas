        commit: 1a1ebc62644a1f88fb0da78393aa6fc638873948
        body: |-
          Change the `reminders` table in `apps/tdr-bot/src/db/schema.ts` to:
          ```ts
          export const REMINDER_STATUSES = ['active', 'completed', 'cancelled', 'missed'] as const
          export type ReminderStatus = (typeof REMINDER_STATUSES)[number]
          export const REMINDER_SOURCES = ['discord', 'admin'] as const
          export type ReminderSource = (typeof REMINDER_SOURCES)[number]

          export const reminders = pgTable('reminder', {
            id: text('id').primaryKey(),
            userId: text('user_id').notNull(),                      // creator
            userName: text('user_name').notNull().default(''),      // creator's Discord username at creation; 'admin' from the admin page
            guildId: text('guild_id').notNull().default(''),
            what: text('what').notNull(),
            isRecurring: boolean('is_recurring').notNull().default(false),
            cronExpression: text('cron_expression'),                // recurring only
            scheduledAt: timestamp('scheduled_at', { mode: 'date' }), // one-time only
            endsAt: timestamp('ends_at', { mode: 'date' }),         // recurring only, optional
            scheduleDescription: text('schedule_description').notNull().default(''),
            channelId: text('channel_id'),
            targetUserId: text('target_user_id'),
            actionType: text('action_type').notNull().default('default'),
            status: text('status').$type<ReminderStatus>().notNull().default('active'),
            source: text('source').$type<ReminderSource>().notNull().default('discord'),
            nextRunAt: timestamp('next_run_at', { mode: 'date' }),
            lastRunAt: timestamp('last_run_at', { mode: 'date' }),
            runCount: integer('run_count').notNull().default(0),
            createdAt: timestamp('created_at', { mode: 'date' }).notNull().defaultNow(),
            updatedAt: timestamp('updated_at', { mode: 'date' }).notNull().defaultNow(),
            cancelledAt: timestamp('cancelled_at', { mode: 'date' }),
          }, table => [
            index('reminder_status_next_run_at_idx').on(table.status, table.nextRunAt),
            index('reminder_user_id_idx').on(table.userId),
          ])
          ```
          `day_description` and `time_description` are dropped. Generate migration
          `0004` with drizzle-kit (command in Context), then hand-edit the SQL so the
          backfill runs **before** the two `DROP COLUMN`s:
          `UPDATE "reminder" SET "schedule_description" = trim(concat_ws(' ', "day_description", "time_description"));`
          and after the adds: `UPDATE "reminder" SET "next_run_at" = "scheduled_at" WHERE "is_recurring" = false;`
          (recurring rows keep `next_run_at` NULL; the scheduler computes it at boot).
          Keep `meta/0004_snapshot.json` and the journal entry drizzle-kit wrote.

          Add to `reminder.constants.ts`: `REMINDER_TIMEZONE = 'America/Los_Angeles'`,
          `MIN_CRON_INTERVAL_MS = 60_000`, `REMINDER_TICK_MS = 30_000`,
          `MAX_LATE_DELIVERY_MS = 60 * 60 * 1000`, `DUE_BATCH_SIZE = 50`,
          `FINISHED_RETENTION_DAYS = 90`. Delete `MAX_TIMEOUT_MS` and
          `MAX_PENDING_DELIVERIES` (and their uses).

          New `apps/tdr-bot/src/reminders/schedule.ts`, pure functions on `cron`'s
          `CronTime` with `REMINDER_TIMEZONE`:
          ```ts
          export type ReminderSchedule =
            | { kind: 'once'; at: Date }
            | { kind: 'recurring'; cron: string; endsAt?: Date | null }
          export type CronCheck = { ok: true } | { ok: false; reason: 'invalid' | 'too_frequent' }
          export function validateCron(expr: string): CronCheck          // invalid expression, or two consecutive runs closer than MIN_CRON_INTERVAL_MS
          export function nextCronRun(expr: string, from: Date, endsAt?: Date | null): Date | null  // strictly after `from`; null once past endsAt
          export function nextRunFor(r: Pick<Reminder, 'isRecurring' | 'cronExpression' | 'scheduledAt' | 'endsAt'>, from: Date): Date | null
          export function previewRuns(schedule: ReminderSchedule, from: Date, count: number): Date[]
          export function scheduleOf(r: Reminder): ReminderSchedule
          export function describeSchedule(schedule: ReminderSchedule): string  // fallback text: "Oct 8, 2026 at 9:00 AM" / "cron 0 9 * * * until Oct 31, 2026"
          ```
          Tests (`__tests__/schedule.test.ts`): `*/1 * * * *` too frequent, `0 9 * * *`
          ok, garbage invalid, next run respects `endsAt` and the timezone (a DST
          boundary case), one-time in the past → null, preview count and ordering.

          New `apps/tdr-bot/src/reminders/reminder.repository.ts` (`@Injectable`,
          Drizzle only, no business rules), exported from `reminders.module.ts`:
          ```ts
          export interface ReminderListFilter { status?: ReminderStatus | 'all'; userId?: string; limit?: number }
          export class ReminderRepository {
            insert(row: NewReminder): Promise<Reminder>
            findById(id: string): Promise<Reminder | null>
            list(filter: ReminderListFilter): Promise<Reminder[]>      // default status 'active'; ORDER BY next_run_at ASC NULLS LAST, created_at DESC
            listActiveForUser(userId: string): Promise<Reminder[]>     // status active AND (user_id = ? OR target_user_id = ?)
            countActiveCreatedBy(userId: string): Promise<number>
            listDue(now: Date, limit: number): Promise<Reminder[]>     // status active AND next_run_at <= now, oldest first
            listActiveWithoutNextRun(): Promise<Reminder[]>
            update(id: string, patch: Partial<NewReminder>): Promise<Reminder | null>  // always sets updatedAt
            countActiveByType(): Promise<{ recurring: number; oneTime: number }>
            deleteFinishedBefore(cutoff: Date): Promise<number>        // status in (completed, cancelled, missed) AND updated_at < cutoff
          }
          ```
          Test it with the fake-chain + `sqlToQuery` pattern from
          `src/llm/audit/__tests__/llm-calls.repository.test.ts`: every method's SQL
          contains the expected predicates and ordering.

          Keep the existing `ReminderService` and `ReminderSkill` compiling with the
