        commit: c6d67eaf4e7e26d9dd9290c0eba151c2b5dbc205
        body: |-
          Rewrite `apps/tdr-bot/src/reminders/reminder.service.ts` on top of
          `ReminderRepository` and `schedule.ts`; no `SchedulerRegistry`, no timers,
          no delivery callback:
          ```ts
          export type ReminderErrorCode =
            | 'limit_reached' | 'invalid_cron' | 'cron_too_frequent' | 'in_past'
            | 'ends_before_start' | 'not_found' | 'forbidden' | 'not_active'
          export class ReminderError extends Error { constructor(readonly code: ReminderErrorCode, message: string) }

          export interface CreateReminderInput {
            userId: string; userName: string; guildId: string; what: string
            schedule: ReminderSchedule; scheduleDescription?: string   // empty → describeSchedule()
            channelId?: string | null; targetUserId?: string | null
            actionType?: ReminderActionType; source?: ReminderSource    // default 'discord'
          }
          export type UpdateReminderInput = Partial<Pick<CreateReminderInput,
            'what' | 'schedule' | 'scheduleDescription' | 'channelId' | 'targetUserId' | 'actionType'>>

          export class ReminderService {
            create(input: CreateReminderInput): Promise<Reminder>
            update(id: string, patch: UpdateReminderInput): Promise<Reminder>   // active rows only, else not_active; recomputes nextRunAt when schedule changes
            cancel(id: string, opts?: { userId?: string }): Promise<Reminder>  // with userId: must equal userId or targetUserId, else forbidden; not_found / not_active otherwise
            cancelAllForUser(userId: string): Promise<number>                   // creator or target
            get(id: string): Promise<Reminder | null>
            listForUser(userId: string): Promise<Reminder[]>                    // active, creator or target, soonest first
            list(filter: ReminderListFilter): Promise<Reminder[]>
            preview(schedule: ReminderSchedule, count?: number): Date[]         // validates like create, throws ReminderError
          }
          ```
          Validation in `create`/`update`/`preview`: `what` trimmed, 1–500 chars;
          once → `at` must be in the future (`in_past`); recurring → `validateCron`
          (`invalid_cron` / `cron_too_frequent`), `endsAt` must be in the future and
          after the first run (`ends_before_start`); `MAX_REMINDERS_PER_USER` counts
          active rows created by the user and applies to `source: 'discord'` only.
          `create` sets `nextRunAt = nextRunFor(row, now)`, `status: 'active'`,
          `scheduleDescription` (given or `describeSchedule`). `cancel` sets
          `status: 'cancelled'`, `cancelledAt`, `nextRunAt: null`. Metrics:
          `reminderCreated(type)`, `reminderCancelled(type)` as today.

          New `apps/tdr-bot/src/reminders/reminder-scheduler.service.ts`:
          ```ts
          export class ReminderSchedulerService implements OnModuleInit {
            onModuleInit(): Promise<void>        // reconcile(), then refreshActiveGauge()
            @Interval(REMINDER_TICK_MS) tick(): Promise<void>
            reconcile(): Promise<void>
            prune(): Promise<void>               // @Cron('0 4 * * *'): deleteFinishedBefore(now - FINISHED_RETENTION_DAYS)
          }
          ```
          `reconcile`: for every active row with `nextRunAt` null — recurring →
          `nextCronRun(cron, now, endsAt)` or `completed` if null; one-time →
          `scheduledAt` if still future, `missed` (with `reminderFailed('missed')`)
          if more than `MAX_LATE_DELIVERY_MS` in the past, else `nextRunAt = now`
          (deliver late on the first tick). `tick`: return at once if a tick is
          already running or `client.isReady()` is false; otherwise `listDue(now,
          DUE_BATCH_SIZE)`, and for each row, sequentially: `delivery.deliver(row)`,
          then advance regardless of delivery outcome — one-time → `status:
          'completed'`; recurring → `nextRunAt = nextCronRun(cron, now, endsAt)` or
          `completed` when that is null; both set `lastRunAt: now`, `runCount + 1`.
          Log one line per delivered row and one per tick with a non-zero count. Call
          `metrics.reminderDelivered()` on success, `metrics.reminderFailed(reason)`
          on failure, and `refreshActiveGauge()` (a new
          `TdrBotMetricsService.setActiveReminders({ recurring, oneTime })` that
          `set`s the `tdr_reminders_active` gauge per type) at the end of a tick that
          changed anything. Remove `reminderActiveDecrement` from the metrics service
          and `createMockMetricsService`; add `setActiveReminders`.

          `reminder-delivery.service.ts`: drop `OnModuleInit`/`setDeliveryFunction`
          and the `ReminderService` dependency (inject `TdrBotMetricsService` for the
          failure reasons it records); `deliver(reminder): Promise<DeliveryResult>`
          with `type DeliveryResult = { ok: true } | { ok: false; reason: string }`,
          never throws. Strategies (default / search / math), the sanitised
          `<reminder_topic>` prompting, `channelId` resolution with the
          `tdr-bot-chat` fallback and the 2000-char truncation stay as they are.
          Delivery prompts stay in `src/reminders/reminder.prompts.ts`.

          `reminders.module.ts` provides and exports `ReminderService`,
          `ReminderRepository`, `ReminderDeliveryService`, `ReminderSchedulerService`
          (import `DiscordModule`/the `Client` provider the way the current module
          gets the discord `Client`). Update the current `ReminderSkill` and the
          integration test's `ReminderService` mock to the new signatures with the
          smallest change (`create` takes `schedule`, `cancel(id, { userId })`).

          Tests: `__tests__/reminder.service.test.ts` (every validation code, cap only
          for discord source, cancel forbidden/not_active, update recomputes
          nextRunAt), `__tests__/reminder-scheduler.service.test.ts` (fake clock via
          `jest.useFakeTimers({ now })`: reconcile cases above, tick delivers due rows
          in order, advances one-time to completed and recurring to the next cron run,
          ends at `endsAt`, still advances on a failed delivery, overlapping tick is
          skipped, not-ready client is skipped, prune cutoff), and the existing
          delivery tests adjusted to `DeliveryResult`.
