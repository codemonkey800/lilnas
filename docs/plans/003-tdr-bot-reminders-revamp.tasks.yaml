  - key: R2
    name: Review remediation
    tasks:
      - id: R3
        title: P1 Tick advance overwrites a concurrent cancel/edit and resurrects the reminder
        after: []
        files:
          - apps/tdr-bot/src/reminders/reminder-scheduler.service.ts
        status: done
        commit: c6e039475cb3071903a991902f801fee14f87c5c
        body: |-
          Finding: F1 (P1)

          From the review of phase 1 (cycle 1): a P1 finding.

          Where: apps/tdr-bot/src/reminders/reminder-scheduler.service.ts:123

          Why: `process()` calls `repository.update(id, { status: next ? 'active' : 'completed', nextRunAt: next, ... })` with no check that the row is still active. `listDue` read the batch earlier, and delivery of earlier rows (LLM, search) takes seconds. So a cancel (or schedule edit) made after `listDue` but before this update is overwritten. `ReminderRepository.update` is a plain `WHERE id = ?`.

          Failure scenario: A recurring reminder is due in a tick whose batch has several rows. The user says 'cancel it' while earlier rows are still delivering. `ReminderService.cancel` sets status 'cancelled' and nextRunAt null. The tick then runs `process()` for that row, delivers it anyway, and writes status 'active' with a new nextRunAt. The reminder keeps firing after the cancel was confirmed. An edited schedule's nextRunAt is likewise overwritten.

          Suggested fix: Make the advance conditional on the row still being active and unchanged. For example add `repository.advanceIfActive(id, expectedNextRunAt, patch)` using `WHERE id = ? AND status = 'active' AND next_run_at = <the value read>`, and use it in `process()`. Alternatively re-read the row just before delivering and skip it if it is no longer active. Add a scheduler test where the row is cancelled between `listDue` and the advance, and assert it stays cancelled.
