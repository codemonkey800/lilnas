nexus-tasks: 1
phases:
  - key: '1'
    name: Backend, data layer and mockup
    tasks:
      - id: T1
        title: 'Mockup: invited people on the admin dashboard'
        after: []
        files:
          - docs/features/auth/designs/invited.html
          - docs/features/auth/designs/
        status: done
        commit: c9e4058cf8c1b649e12a96a3630211a6b269703d
        body: |-
          Draw how the auth admin dashboard shows people who were added with "Add a person" but
          have not signed in yet. This is a static mockup for a human design review; no app code
          changes here.

          Read first: `docs/designs/mockup-kit/README.md` (the kit, the "Nexus review frames"
          section and the rules), `DESIGN.md`, `docs/features/auth/designs/README.md`,
          `docs/features/auth/designs/src/pages/admin.pug`, `src/mixins/auth.pug` and
          `src/data/admin.mjs` in that project (the existing admin dashboard mockup), and
          `docs/features/icloud-backup/designs/src/pages/admin.pug` (a page built from review
          frames). The real screen is `apps/auth/src/app/admin/people-list.tsx`,
          `edit-access-modal.tsx`, `add-person-modal.tsx` and `stat-tiles.tsx`.

          **Create** a new page `docs/features/auth/designs/invited.html`, built from
          `src/pages/invited.pug` and `src/data/invited.mjs`. Use review frames: override
          `block page`, call `+mockPage('max-w-[1760px]')(class='page')`, then `+mockHead` and one
          `+mockFrame` per state. Each frame shows the 1280 screen and the 390 screen side by side
          with a `+frameLabel` under each, and stands alone (no viewport switch, no "as above").
          Reuse the mixins in `src/mixins/auth.pug` (`adminShell`, `statTiles`, `peopleSection`,
          `authDataList`, the dialog mixins) and add what is missing there. Add a link card to
          `src/data/index.mjs` and a row to the Pages table in the project `README.md`.

          **Frames**, in this order:
          1. People with invited rows. Stat tiles, then the People table holding an Admin row, a
             Granted row, a No access row and two invited rows: one with two services, one with
             six services plus the rule `*.dev.lilnas.io`. An invited row shows the email only
             (no name is known before sign-in), an "Invited" badge, the pending services as the
             same badges granted services use, a note such as "Invited Nov 23", no Discord chip,
             and one action, "Edit access". It has no Block button. Choose the badge tone from
             the tones `@lilnas/ui`'s `Badge` already has (accent, ok, warn, bad, mute); do not
             invent a tone. Default counts: the People tile and the section count include invited
             people; Granted does not. If you think an "Invited" tile reads better, draw it and
             say so in the caption.
          2. Search that matches an invited person: only that row, count 1.
          3. Edit access for an invited person. A dialog over the dimmed People list: the email,
             a line saying when they were invited and that they have not signed in yet, the
             service checkbox grid with their pending services checked, the access rules field,
             and a destructive "Cancel invite" button where "Remove access" sits for a normal
             person. No Discord field, no "Sign out everywhere", no "Remove access". Footer
             buttons: "Cancel" and "Save access". The dialog now has both "Cancel" and "Cancel
             invite"; if that reads badly, propose better copy for one of them in the caption.
          4. Cancel invite confirm. The destructive confirm dialog, naming the person and what
             they lose, e.g. title "Cancel erlyne@example.com’s invite?", body "They won’t get
             these 2 services when they sign in. You can add them again any time.", buttons
             "Cancel invite" and "Keep invite".
          5. Add person with no service selected: the field error under the service grid, e.g.
             "Pick at least one service or rule."
          6. Toasts, one of each: "Invited erlyne@example.com" (email had no account),
             "Access granted to jane.doe@example.com" (email had an account), "Invite updated",
             "Invite cancelled", and the warning shown when the person signed in before the
             change was saved, e.g. "erlyne@example.com has signed in. Edit their access from
             their row."
          7. Alternative, for comparison only: the same people with the invited ones in their own
             "Invited" section under People instead of in the table. Say in the caption that this
             is the option not chosen by default.

          Use invented people (`example.com` addresses) and the real service names from
          `src/data/shared.mjs`. Keep copy in `src/data/invited.mjs` and layout in the `.pug`.

          **Edge cases**
          - No `<script>` and no behavioural JS; states are drawn, not interactive.
          - Do not change how any existing page renders. After
            `pnpm --filter @lilnas/cli build && pnpm mockups`, `git status` must show changes
            only under `docs/features/auth/designs/`, and of the built pages only `invited.html`
            (new) and `index.html`. If `admin.html` or another feature's HTML changed, undo the
            cause.
          - `pnpm mockups:lint` must pass (`pnpm mockups:lint:fix` formats).

          Commit the sources and the generated `invited.html` and `index.html`. There are no
          tests for mockups; open `invited.html` in a browser at 1800 px wide and check each
          frame renders both viewports without overflow. In your result, list the frame titles
          in order, the badge tone you chose and why, and any copy you changed from this brief.
      - id: H1
