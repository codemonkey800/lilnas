  - key: '2'
    name: Turbo remote cache in image builds
    tasks:
      - id: T11
        title: Turbo remote cache inside the Docker builds
        after:
          - T1
          - T2
          - T3
          - T4
          - T5
          - T6
          - T7
          - T8
          - T9
          - T10
        files:
          - .github/workflows/ci.yml
          - packages/cli/src/utils/__tests__/ci-workflow-shape.spec.ts
          - apps/auth/Dockerfile
          - apps/dashcam/Dockerfile
          - apps/dev/Dockerfile
          - apps/download/Dockerfile
          - apps/equations/Dockerfile
          - apps/me-token-tracker/Dockerfile
          - apps/portal/Dockerfile
          - apps/tdr-bot/Dockerfile
          - apps/theater/Dockerfile
          - docs/deploy.md
        model: strong
        status: done
        commit: a8607ca6aade099603366fbcb3988c76f8aeeadb
        body: |-
          Make the `pnpm build --filter=@lilnas/<x>` step in each Docker build hit the
          self-hosted Turbo remote cache (`turbo` in `infra/shared.yml`, https://turbo.lilnas.io)
          instead of compiling. Use one pattern for all nine app Dockerfiles (not
          `apps/dev-idle-reaper`).

          **Workflow (`.github/workflows/ci.yml`):**
          - `build-images` → "Build and push" step: pass `TURBO_API`, `TURBO_TEAM` (repo `vars`),
            `TURBO_TOKEN` and `TURBO_REMOTE_CACHE_SIGNATURE_KEY` (repo `secrets`) as BuildKit
            secrets via build-push-action's `secrets:` input, one `id=value` line each, ids
            equal to the env names. The `check` job's `env:` block already reads them this way.
          - `check` → "Build dependencies": change `--filter="{./${PACKAGE}}^..."` to
            `--filter="{./${PACKAGE}}..."`, so the package itself is built and pushed to the
            cache. Keep the `pnpm install --frozen-lockfile --offline` after it, and rewrite
            the comment above. Confirm the filter with
            `pnpm turbo run build --filter="{./apps/tdr-bot}..." --dry=json`.
          - Building the app first must not break the later lint/type-check steps (for example
            via `next-env.d.ts` or `.next/types`). For each app with a Next frontend (auth, dev,
            download, portal, tdr-bot, theater): build it, then run its `lint` and
            `type-check`. Report the results.

          **Dockerfiles:**
          - Wrap the build in
            `RUN --mount=type=secret,id=TURBO_API,env=TURBO_API --mount=…` with all four
            secrets. Add `# syntax=docker/dockerfile:1` if the `env=` option needs it.
          - Secrets are optional (`required=false` is the default). With none, the build must
            behave exactly as today: a local compile.
          - Injected-deps trap: a cache hit restores `packages/*/dist` but does not sync the
            injected copies in `apps/<x>/node_modules/@lilnas/*`. Sync only happens when the
            build script runs. A cached `@lilnas/utils` plus an uncached app build therefore
            sees a stale copy. Build `--filter=@lilnas/<x>^...` first, then re-sync the
            injected deps, then build `--filter=@lilnas/<x>`.
