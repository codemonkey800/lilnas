nexus-tasks: 1
phases:
  - key: '1'
    name: CI knobs and smaller images
    tasks:
      - id: T1
        title: 'ci.yml: max-parallel 12 and buildx `cleanup: false`'
        after: []
        files:
          - .github/workflows/ci.yml
          - packages/cli/src/utils/__tests__/ci-workflow-shape.spec.ts
        status: done
        commit: a2c622e2de556898e369facc025435cab7b2fad2
        body: |-
          Two edits to `.github/workflows/ci.yml`, each with a one-line comment giving the reason:
          - `build-images` → `strategy.max-parallel: 4` becomes `12`. The repo is public, so the job
            concurrency limit is 20. The `check` matrix has finished before `build-images` starts.
          - Every `docker/setup-buildx-action@v4` step gets `with: cleanup: false`. There are two:
            one in `base-images`, one in `build-images`; keep the existing `if:`. Runners are
            ephemeral, and the post-step `docker buildx rm` took 24–94 s per image job.

          Change nothing else in the workflow.

          Extend `packages/cli/src/utils/__tests__/ci-workflow-shape.spec.ts`. The `Job`/`Step`
          interfaces at the top need a `strategy` field and a `with` that allows booleans. Add:
          - `build-images` has `strategy['max-parallel'] === 12`
          - every step in every job that `uses` `docker/setup-buildx-action@` has
            `with.cleanup === false`, and there is at least one such step

          Run the spec. Each new assertion must fail when you revert its yaml line, then pass again.
      - id: H1
        title: Push T1 to main and watch the CI run
        after:
          - T1
        files: []
        status: approved
        body: |-
          Cherry-pick T1's commit onto `main` and push it. This deploys. Any `.github/workflows/**`
          change makes the run full: all 11 images are rebuilt, every service is redeployed, and
          everything is decrypted.

          In the GitHub run, check three things:
          - `build-images` runs as a single wave. Baseline: ~9.5 min in three waves of 4.
          - The "Post Set up Docker Buildx" step takes about 0 s. Baseline: 24–94 s.
          - `summary` is green.

          Approve if green. Request changes with the failing job's log if not.
      - id: T2
        title: 'portal: run from the Next standalone build only'
        after: []
        files:
          - apps/portal/Dockerfile
        status: done
        commit: 8b0b191cbaae7b3701af98751a0e422f0443c4f8
        body: |-
          `@lilnas/portal` is a pure Next app (`start`: `NODE_ENV=production node server.js`).
          Today `apps/portal/Dockerfile` copies a full `pnpm deploy --prod` tree (378M
          `node_modules`) plus the whole `.next` (161M, with 33M of `.next/cache`) into `/app`.

          New layout: `/app` is the contents of `apps/portal/.next/standalone`. Next writes
          `apps/portal/{server.js,package.json,.next/,node_modules}` there, plus a traced root
          `node_modules`. Add:
          - `.next/static` → `/app/apps/portal/.next/static`
          - `public/` → `/app/apps/portal/public`
          - `WORKDIR /app/apps/portal`
          - `ENTRYPOINT ["pnpm","start"]` (keep it)

          Drop the `pnpm deploy` step and the `.next`/`server.js` copies. Copy straight from the
          builder's `/source/apps/portal/...` paths. Use `cp -a` or `COPY`, both of which keep
          the standalone tree's relative symlinks. Keep a `test -f` guard on the new `server.js`
          path. The app runs as root and talks to the Docker socket through `node-docker-api`;
          keep that.

          Check that `apps/portal/.next/standalone/apps/portal/package.json` still has the
          `start` script, so `pnpm start` works there. No `apps/portal/package.json` change is
          expected; if one turns out to be needed, stop and report it.

          Verify, as described in Context:
          - Build `plan016/portal:after`.
          - Run it with the default entrypoint. `/` and one `/_next/static/…` asset taken from
            its HTML must return the same status as the baseline image does.
          - Report the before/after table.
      - id: T3
        title: 'equations: stop duplicating /app with `chown -R`'
        after: []
        files:
          - apps/equations/Dockerfile
        status: done
        commit: 36dd26572ed287f8d838a3e170b70dbd284892bc
        body: |-
          `apps/equations/Dockerfile` is the outlier: `node:26.12.0-bookworm` builder,
          `-bookworm-slim` runtime with ~2.5G of texlive. **Keep every apt package exactly as it
          is.** That is a user decision.

          The runtime stage does `COPY --from=build /app /app` and then `RUN chown -R app:app /app`.
          That writes a second full copy of `/app` as a new layer. Because it is a RUN after the
          COPY, BuildKit in CI must also pull and extract the texlive layers under it on every
          build. Changes:
          - Create the `app` user before the copy.
          - `COPY --from=build --chown=app:app` the deploy tree and the ImageMagick policy, as
            each needs.
          - Leave no `RUN` after the app COPY.
          - Keep `USER app`, `WORKDIR /app`, the label and `ENTRYPOINT ["pnpm","start"]`.

          Also look at what `pnpm deploy` puts in `/app`, and drop anything the backend doesn't
          load at runtime, if any. Do not change `apps/equations/package.json`.

          Verify:
          - `docker history plan016/equations:after` shows no layer that re-copies `/app`.
          - `pnpm start` boots no worse than the baseline under the same throwaway env (Context).
          - `node -e "require('./dist/app.module')"` inside the image throws no module-not-found.
          - Report the before/after table and the layer list.
      - id: T4
        title: 'me-token-tracker: trim the runtime image'
        after: []
        files:
          - apps/me-token-tracker/Dockerfile
        status: done
        commit: 95b2d8e84d666b53273607b5220a338c36cda487
        body: |-
          `apps/me-token-tracker` is a Nest-only Discord bot (`start`:
          `NODE_ENV=production node dist/main`) on `lilnas-node-runtime`. Its `/app` is 94M,
          nearly all `node_modules`.

          Look at what the deploy tree and the image hold, and trim only what isn't loaded at
          runtime: stray files and duplicate layers. Dockerfile only. Don't change
          `apps/me-token-tracker/package.json`. If a dependency looks unused, list it in your
          result instead.

          If you can't cut at least 5% of the image size, leave the Dockerfile unchanged, say so,
          and commit nothing.

          Otherwise verify:
          - Build `plan016/me-token-tracker:after`.
          - `node -e "require('./dist/app.module')"` inside the image throws no module-not-found.
          - `pnpm start` under the throwaway env fails no worse than the baseline. It will fail
            at Discord login.
          - Report the before/after table.
      - id: T5
        title: 'dashcam: cached deps layer in the build stage'
        after: []
        files:
          - apps/dashcam/Dockerfile
        status: done
        commit: 61fb697886c8548609413a9549ead658cddf8155
        body: |-
          `apps/dashcam/Dockerfile` builds on `node:26.12.0`. It runs `COPY ../.. /source`, then
          `npm install -g pnpm`, then a full-monorepo `pnpm install --frozen-lockfile`. So any
          source change re-runs the whole install. Its nginx runtime (69M) is already minimal;
          leave that stage alone.

          Rewrite the build side on the pattern `apps/portal/Dockerfile` uses at `base`:
          - stage `deps`: `FROM ghcr.io/codemonkey800/lilnas-monorepo-builder:latest`
          - copy `package.json pnpm-lock.yaml pnpm-workspace.yaml` and the package.json files
            dashcam's workspace graph needs: `apps/dashcam`, `packages/utils`, `packages/cli`,
            `packages/eslint-config-lilnas`, `packages/prettier-config-lilnas`, and the whole
            `packages/tsc7/` dir. Check `apps/dashcam/package.json` and those packages for
            anything else.
          - `RUN --mount=type=cache,id=pnpm,target=/pnpm/store pnpm install`
          - stage `builder`: `FROM deps`, `COPY . .`, `RUN pnpm build --filter=@lilnas/dashcam`
          - nginx stage: copies `/source/apps/dashcam/dist` as before

          Verify:
          - Build `plan016/dashcam:after`.
          - Touch a file in `apps/dashcam/src` and rebuild. The install step must show `CACHED`.
            Report both build times.
          - The two images' `/usr/share/nginx/html` file lists match, apart from hashed asset
            names.
          - The new image serves `/` with 200 on a random port. Container port 80; use
            `-p 127.0.0.1::80`.
          - Report the before/after table.
