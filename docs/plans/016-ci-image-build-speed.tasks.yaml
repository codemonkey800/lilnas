      - id: T12
        title: 'Docker builder stage: skip the full-workspace pre-run install'
        after:
          - T11
        files:
          - apps/auth/Dockerfile
          - apps/dashcam/Dockerfile
          - apps/dev/Dockerfile
          - apps/download/Dockerfile
          - apps/equations/Dockerfile
          - apps/me-token-tracker/Dockerfile
          - apps/portal/Dockerfile
          - apps/tdr-bot/Dockerfile
          - apps/theater/Dockerfile
        status: done
        commit: 5a2ff134a9eab513cb8976d6c654503d785ea38e
        body: |-
          Each of the nine `apps/*/Dockerfile` files (not `apps/dev-idle-reaper`) has a `deps`
          stage. That stage copies only the root manifests plus the package.json files of the app's
          workspace subset, then runs `pnpm install`. The builder stage then runs `COPY . .` and:
          ```sh
          pnpm build --filter='@lilnas/<x>^...' \
            && pnpm install --frozen-lockfile --offline \
            && pnpm build --filter=@lilnas/<x>
          ```
          The `COPY . .` brings in all 18 workspace package.json files. pnpm 12's
          verify-deps-before-run sees the install as stale, so the first `pnpm build` runs a
          full-workspace install: "Packages: +394 -124", ~258 downloads, ~5 s plus network on every
          image build. The offline install after it only works today because that install already
          fetched every package.

          Fix, in every builder stage:
          - Set `ENV pnpm_config_verify_deps_before_run=false` (stage-scoped, in the builder stage
            only; the runtime base images already set it).
          - Filter the re-sync install to the app's subset:
            `pnpm install --frozen-lockfile --offline --filter='@lilnas/<x>...'`. Use the package's
            real name from its package.json. The install's purpose is unchanged: it re-syncs the
            injected copies in `apps/<x>/node_modules/@lilnas/*` after a Turbo cache hit restored
            `packages/*/dist`. Update the comment above the RUN if it needs it.
          - Drop the dead `--mount=type=cache,id=pnpm,target=/pnpm/store` from each deps-stage
            `pnpm install`. pnpm's store is `/root/.local/share/pnpm/store/v11`, so the mount is
            never used. Do not move the store: it is hardlinked with `node_modules` inside the deps
            layer (one 1.16 GB layer, not two), and the builder's offline install needs it there
            when the deps layer comes from the registry cache on a fresh runner.
          - Keep everything else: the secret mounts, the build order, `pnpm deploy`, the guards.
          - `apps/equations` builds on `node:26.12.0-bookworm` with pnpm installed by npm; same
            change. `apps/dashcam` too.

          Edge cases:
          - The filtered offline install must not need a package that the deps stage didn't fetch.
            If an app's install fails offline, its deps stage is missing a package.json the app's
            graph needs: add that COPY, and report it.
          - `pnpm deploy --prod` after the build must still succeed with no network fetch beyond
            what it does today.

          Verify, one build at a time, on a brand-new builder each time
          (`docker buildx create --name plan016-fresh`, build with `--builder plan016-fresh --load`,
          `docker buildx rm plan016-fresh` after). Pass no Turbo secrets.
          - tdr-bot, before and after: report the builder RUN step's time from `--progress=plain`.
            The after log must show no "Packages: +" line from the first `pnpm build`.
          - Injected-deps re-sync still works: in the after builder stage (`--target builder`),
            delete `apps/tdr-bot/node_modules/@lilnas/utils/dist`, run the filtered offline install,
            and confirm the dir is back and matches `packages/utils/dist` (`diff -r`).
          - Every one of the nine images builds on the fresh builder.
          - For tdr-bot and one Nest-only app (me-token-tracker), compare `/app` outside
            `node_modules` with an image built from the T11 Dockerfile: same file list and bytes.
            `require('./dist/app.module')` throws no module-not-found.
          - Report a table of builder-step times for tdr-bot before/after, and the build result
            of each of the nine images.

          If removing the pre-run install saves under 3 s on tdr-bot's builder step, revert,
          commit nothing, and say so with the numbers.
