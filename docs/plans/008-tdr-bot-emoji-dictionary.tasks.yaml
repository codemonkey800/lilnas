          Note: Luna's docs say function calling on Chat Completions needs reasoning
          effort `none`. LangChain picks `response_format` JSON schema (not tool
          calling) by default for non-gpt-3/gpt-4 models, so this should pass as is.
          If it fails or returns empty output (e.g. `finish_reason: length`), try in
