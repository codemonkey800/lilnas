          `console.log` so the run output shows them.

          Run it from `apps/tdr-bot` in bash, reading the key from the main
          checkout's prod env file without ever printing it:
          ```bash
          OPENAI_API_KEY="$(grep -m1 '^OPENAI_API_KEY=' /home/jeremy/lilnas/apps/tdr-bot/.env.prod | cut -d= -f2-)" \
            LIVE_LLM=1 pnpm exec jest --testMatch '**/emoji-describe.live.test.ts' --runInBand
