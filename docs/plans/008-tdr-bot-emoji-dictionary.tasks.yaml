          `docs/features/tdr-bot/designs/README.md` first. Imitate
          `src/pages/reminders.pug`: `extends ../layout/page.pug`, `include
          ../mixins/ui.pug`, one `+frame(label, note)` section per state, sample data
          as Pug locals at the top (or `src/data/emojis.mjs`), Tailwind utilities from
          `src/theme.css` only. The app bar nav becomes Settings · Transcript ·
          Reminders · Emojis; update the nav in the shared layout or mixin so every
          page shows it.

          The page is the admin's view of the bot's custom-emoji dictionary. Each
          emoji has an id, name, animated flag, description (or none yet), source
          (`manual`, `ai`, or none while pending), model (for AI rows), described-at
          time, and deleted-at time (the emoji was removed from Discord). For sample
          images use `https://cdn.discordapp.com/emojis/<id>.png` (or `.gif` when
          animated) with real ids from `apps/tdr-bot/src/utils/emojis.ts`, e.g.
          HYPERS 564310072822333480, residentsleeper 564330871851712553,
          peepoWine (animated) 1266528661318926369, Loading 1275667821757464687.

          Frames, each a full page under the app bar:
          - **Populated (desktop)**: header row with a filter toggle (All · Needs
            description · AI · Manual · Deleted, with counts), a search box ("name or
            description"), and a "Run reconcile now" button with a status line under
            it ("Last reconcile 3 min ago (boot) · 140 synced · 2 described · 0
            failed"). Table columns: image (32 px), name (`:HYPERS:` with an
            "animated" chip when animated), description, source chip (manual / ai /
            pending), model (monospace, "—" for manual), described ("Oct 14, 9:02 AM"),
            and row actions Edit and Re-describe. Twelve rows mixing manual, AI,
            pending (no description, shown as muted "Waiting for a description"),
            animated, and one deleted row (dimmed, "deleted Oct 2" chip, no actions).
          - **Reconcile running**: the button shows a spinner and "Reconciling…",
            pending rows show "Describing…".
          - **Inline edit**: one row's description cell as a textarea with a
            character counter (max 300) and Save / Cancel; a note that saving marks
            it manual.
          - **Re-describe confirmation** for a manual row: "Replace this hand-written
            description with an AI one?" showing the current text; Keep / Re-describe.
          - **Mobile** (≤ 420 px): stacked cards with image, name, source chip,
            description, actions.
          - **Empty** (no emojis synced yet, with the Run reconcile button) and
            **loading** (skeleton rows).
