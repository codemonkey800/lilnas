        commit: 35e195238de112b79f2c991240dfa3062b42b77b
        body: |-
          Add to `apps/tdr-bot/src/db/schema.ts`, after `llmCalls`, with doc
          comments like the other tables:

          ```ts
          export const EMOJI_SOURCES = ['manual', 'ai'] as const
          export type EmojiSource = (typeof EMOJI_SOURCES)[number]

          /** One row per Discord custom emoji the bot has seen; the prompt's emoji dictionary. */
          export const emojiDictionary = pgTable('emoji_dictionary', {
            id: text('id').primaryKey(),            // Discord emoji snowflake
            guildId: text('guild_id').notNull(),
            name: text('name').notNull(),
            animated: boolean('animated').notNull().default(false),
            description: text('description'),        // null until described
            source: text('source').$type<EmojiSource>(), // null until described
            model: text('model'),                    // set for source 'ai'
            describedAt: timestamp('described_at', { mode: 'date' }),
            deletedAt: timestamp('deleted_at', { mode: 'date' }),
            createdAt: timestamp('created_at', { mode: 'date' }).notNull().defaultNow(),
            updatedAt: timestamp('updated_at', { mode: 'date' }).notNull().defaultNow(),
          }, table => [index('emoji_dictionary_guild_id_idx').on(table.guildId)])
          export type EmojiRow = typeof emojiDictionary.$inferSelect
          export type NewEmojiRow = typeof emojiDictionary.$inferInsert
          ```
          Then run `pnpm db:generate` in `apps/tdr-bot` and commit the generated
          `drizzle/0007_*.sql`, `drizzle/meta/0007_snapshot.json` and the
          `_journal.json` change. Do not hand-edit the SQL; do not apply it anywhere.

          Create `apps/tdr-bot/src/emojis/emoji-dictionary.repository.ts`, an
          `@Injectable()` taking `DrizzleService` (imitate
          `src/reminders/reminder.repository.ts`). No module yet; T6 creates it.

          ```ts
          export interface EmojiMeta { id: string; guildId: string; name: string; animated: boolean }
          export interface EmojiDescription {
            description: string
            source: EmojiSource
            model: string | null
          }
          export class EmojiDictionaryRepository {
            /** INSERT … ON CONFLICT (id) DO UPDATE guild_id, name, animated,
             *  deleted_at = NULL, updated_at = now(). Never touches description,
             *  source, model or described_at. No-op for []. */
            upsertMeta(rows: EmojiMeta[]): Promise<void>
            /** Sets deleted_at = now() on live rows whose id is not in keepIds,
             *  except rows whose guild_id is in skipGuildIds. Returns the count. */
            softDeleteMissing(keepIds: string[], skipGuildIds: string[]): Promise<number>
            /** Sets deleted_at = now() if not already deleted. */
            softDelete(id: string): Promise<void>
            /** description IS NULL AND deleted_at IS NULL. */
            listUndescribed(): Promise<EmojiRow[]>
            /** description IS NOT NULL AND deleted_at IS NULL (the prompt set). */
            listActiveDescribed(): Promise<EmojiRow[]>
            /** Every row, for the admin page. */
            listAll(): Promise<EmojiRow[]>
            get(id: string): Promise<EmojiRow | undefined>
            /** Live rows with source 'manual' and a description, ORDER BY id, LIMIT. */
            listManualExamples(limit: number): Promise<EmojiRow[]>
            /** UPDATE … SET description, source, model, described_at = now(),
             *  updated_at = now() WHERE id = ? AND description IS NULL.
             *  Returns true when a row changed. Used by sync, never clobbers. */
            fillDescription(id: string, value: EmojiDescription): Promise<boolean>
            /** Same SET, unconditional. Used by admin edit and re-describe.
             *  Returns the updated row, or undefined for an unknown id. */
            setDescription(id: string, value: EmojiDescription): Promise<EmojiRow | undefined>
          }
          ```
          Edge cases: `softDeleteMissing([], [])` soft-deletes every live row (the bot
          sees no emojis); an empty `skipGuildIds` adds no guild filter.

          Tests (fake Drizzle chain + `PgDialect().sqlToQuery`, as in
          `src/llm/audit/__tests__/llm-calls.repository.test.ts`): the upsert's
          conflict target and SET list exclude the description columns and clear
          `deleted_at`; `fillDescription`'s WHERE includes `description is null` and
          it returns false when no row is returned; `softDeleteMissing` with and
          without skip guilds and with empty keepIds; the list filters.
      - id: T4
        title: Emoji describer service
        after:
