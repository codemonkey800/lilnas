          Add `docs/features/tdr-bot/designs/src/pages/emojis.pug`, link it from
          `src/pages/index.pug` with a one-line description, build with `pnpm mockups`
          from the repo root, run `pnpm run mockups:lint:fix`, and commit the Pug plus
