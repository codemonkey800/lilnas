      - id: T7
        title: Two-phase reconcile, event upserts and re-describe
        after:
          - T4
          - T6
        files:
          - apps/tdr-bot/src/emojis/emoji-sync.service.ts
          - apps/tdr-bot/src/emojis/emoji-seed.ts
          - apps/tdr-bot/src/emojis/emojis.module.ts
          - apps/tdr-bot/src/emojis/__tests__/emoji-sync.service.test.ts
          - apps/tdr-bot/src/emojis/__tests__/emoji-seed.test.ts
        status: done
        commit: 4e743e5c1962698fd8a7d07f91b5196048c31859
        body: |-
          Build the one routine that keeps `emoji_dictionary` in step with Discord.
          T8 wires its triggers and T9 its admin endpoints.

          `src/emojis/emoji-seed.ts`: `export function seedDescriptions(): Map<string,
          string>` parses the keys of `emojis` from `src/utils/emojis.ts`
          (`/^<a?:([^:]+):(\d+)>$/`) into `id → description`. This file is the only
          importer of `emojis.ts`, so the follow-up that deletes it touches one place.

          `src/emojis/emoji-sync.service.ts`:
          ```ts
          export type ReconcileTrigger = 'boot' | 'cron' | 'admin' | 'event'
          export interface ReconcileSummary {
            trigger: ReconcileTrigger
            synced: number        // emojis upserted in phase 1
            softDeleted: number
            seeded: number        // filled from emojis.ts
            described: number     // filled by the LLM
            failed: number
            durationMs: number
            finishedAt: string    // ISO
          }
          export interface ReconcileStatus { running: boolean; last: ReconcileSummary | null }
          export class EmojiNotFoundError extends Error {}
          export class EmojiDeletedError extends Error {}

          @Injectable()
          export class EmojiSyncService {
            constructor(client: Client, repo: EmojiDictionaryRepository,
                        describer: EmojiDescriberService, dictionary: EmojiDictionaryService)
            /** Both phases under the mutex. A call while a reconcile is running
             *  returns that run's promise instead of starting another. */
            reconcile(trigger: ReconcileTrigger): Promise<ReconcileSummary>
            /** emojiCreate / emojiUpdate: upsert this emoji, then phase 2, under the mutex. */
            syncEmoji(emoji: GuildEmoji): Promise<void>
            /** emojiDelete: soft-delete, refresh the dictionary, under the mutex. */
            removeEmoji(id: string): Promise<void>
            /** Describe one emoji now with the LLM and overwrite its description
             *  (source 'ai'), even a manual one. Ignores the seed. */
            redescribe(id: string): Promise<EmojiRow>
            status(): ReconcileStatus
          }
          ```
          Use `Mutex` from `async-mutex` (already a dependency).

          Phase 1: if `!client.isReady()`, log and return a zero summary. For each
          guild in `client.guilds.cache`: if `guild.available` is false, add its id to
          `skipGuildIds`; else map `guild.emojis.cache` to `EmojiMeta` (skip emojis
          whose `name` is null). Then `repo.upsertMeta(all)`,
          `repo.softDeleteMissing(allIds, skipGuildIds)`, `dictionary.refresh()`.

          Phase 2: `rows = repo.listUndescribed()`. First, for every row whose id is in
          `seedDescriptions()`, `fillDescription(id, { description, source: 'manual',
          model: null })`, then `dictionary.refresh()`. Next, load
          `repo.listManualExamples(EMOJI_EXAMPLE_COUNT)` once and describe the
          remaining rows with at most `EMOJI_DESCRIBE_CONCURRENCY` calls in flight (a
          small worker pool, no new dependency), storing each with
          `fillDescription(id, { description, source: 'ai', model })`. A failed
          describe is logged with `logger.warn({ emojiId, name, error }, …)`, counted
          in `failed`, and left NULL for the next run. Finish with
          `dictionary.refresh()` and one `logger.log({ ...summary }, 'emoji.reconcile')`.
          `fillDescription` returning false (someone edited it meanwhile) is not a
          failure and isn't counted.

          `redescribe`: unknown id → `EmojiNotFoundError`; `deleted_at` set →
          `EmojiDeletedError`; else describe with the manual examples, `setDescription`
          with `source: 'ai'`, refresh, return the row. Errors from the describer
          propagate.

          `src/emojis/emojis.module.ts`: `EmojisModule` imports
          `EmojiDictionaryModule` and `LlmCoreModule`, provides `EmojiDescriberService`
          and `EmojiSyncService`, exports `EmojiSyncService` and
          `EmojiDictionaryModule`. Not yet imported anywhere (T8 adds it to
          `AppModule`).

          Tests (fake repository, fake dictionary, `FakeLlmClient` or a mocked
          describer, a fake client with a `guilds.cache` `Map` of plain guild objects;
          add a per-file `jest.mock('discord.js', …)` if you import its values):
          first run on an empty table upserts all, seeds a seed-map id without an
          LLM call, describes the rest; a second run with everything described makes
          no LLM calls; a rename upserts the new name and keeps the description; a
          vanished emoji is soft-deleted and an unavailable guild's rows are not; a
          describe failure is counted and the run continues; concurrency never
          exceeds 4; two concurrent `reconcile` calls share one run; `syncEmoji`
          waits for a running reconcile; `redescribe` overwrites a manual row and
          throws the two errors; `status()` reports running and the last summary.
