        commit: 9d7f295bbef5a834d12688ec43273184876bd1e4
        body: |-
          Create the describer: one vision LLM call that turns an emoji's name and
          picture into a one-line "when to use it" hint. Not registered in any module
          yet (T7 does that).

          `apps/tdr-bot/src/emojis/emoji.constants.ts`:
          ```ts
          /** Model for emoji descriptions. Must be in the catalog with vision. Switch to 'gpt-6.1-sol' here. */
          export const EMOJI_DESCRIBER_MODEL = 'gpt-6-luna'
          export const EMOJI_DESCRIBER_REASONING_EFFORT = 'low'
          /** Reasoning tokens count against this cap, so keep headroom. */
          export const EMOJI_DESCRIBE_MAX_TOKENS = 400
          export const EMOJI_DESCRIPTION_MAX_CHARS = 120
          export const EMOJI_EXAMPLE_COUNT = 10
          export const EMOJI_DESCRIBE_CONCURRENCY = 4
          export const EMOJI_RECONCILE_CRON = '30 4 * * *'
          ```

          `emoji-describer.prompts.ts`: `buildEmojiDescriberSystemPrompt(examples:
          EmojiExample[]): SystemMessage` (dedent). It says: you write one-line usage
          hints for a Discord friend group's custom emojis; describe WHEN to use the
          emoji (the mood, reaction or situation), not what it looks like; short,
          imperative, like the examples, at most 120 characters; the name usually
          carries the meaning, and the picture tells similar names apart; animated
          emojis are shown as a still frame. Then the examples, one per line as
          `- <name>[ (animated)]: <description>`. Also export
          `FALLBACK_EMOJI_EXAMPLES: EmojiExample[]`, these eight entries copied from
          `src/utils/emojis.ts` (don't import that file): HYPERS, Jebaited,
          residentsleeper, salute1, gasp, jackded, pathetic, Loading.

          `emoji-describer.service.ts`:
          ```ts
          export interface DescribeInput { id: string; name: string; animated: boolean }
          export interface EmojiExample { name: string; animated: boolean; description: string }
          export interface DescribeResult { description: string; model: string }
          export const EmojiDescriptionSchema = z.object({
            description: z.string().min(1).max(EMOJI_DESCRIPTION_MAX_CHARS),
          })
          /** Static PNG on Discord's CDN; a still frame for animated emojis. */
          export function emojiPngUrl(id: string): string // https://cdn.discordapp.com/emojis/<id>.png

          @Injectable()
          export class EmojiDescriberService {
            constructor(llm: LlmClient, registry: ModelRegistry)
            describe(emoji: DescribeInput, examples: EmojiExample[]): Promise<DescribeResult>
          }
          ```
          `describe` throws before calling the LLM if
          `registry.get(EMOJI_DESCRIBER_MODEL).capabilities.vision` is false (an
          unknown id already throws `UnknownModelError`). When fewer than 8 examples
          are given, top them up from `FALLBACK_EMOJI_EXAMPLES` (skip names already
          present) and cap at `EMOJI_EXAMPLE_COUNT`. The call:
          ```ts
          llm.call({
            operation: 'emoji.describe', role: 'chat', schema: EmojiDescriptionSchema,
            overrides: { model: EMOJI_DESCRIBER_MODEL, maxTokens: EMOJI_DESCRIBE_MAX_TOKENS,
                         reasoningEffort: EMOJI_DESCRIBER_REASONING_EFFORT },
            messages: [systemPrompt, new HumanMessage({ content: [
              { type: 'text', text: `Name: ${name}${animated ? ' (animated)' : ''}` },
              { type: 'image_url', image_url: { url: emojiPngUrl(id), detail: 'low' } },
            ] })],
          })
          ```
          Return the trimmed description and `result.model`. LLM errors propagate.

          Tests with `FakeLlmClient` and a real `ModelRegistry`: message shape (text
          block, `.png` URL for an animated emoji too, `detail: 'low'`); model,
          maxTokens and reasoningEffort overrides; examples rendered in the system
          prompt and topped up from the fallback when short; a non-vision model is
          rejected without a call (test by mocking `registry.get`); output trimmed.
