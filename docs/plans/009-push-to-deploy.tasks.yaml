nexus-tasks: 1
phases:
  - key: '1'
    name: Repo changes (nothing touches the host)
    tasks:
      - id: T1
        title: 'Compose: project name, GHCR image tags, decrypted env_file paths'
        after: []
        files:
          - docker-compose.yml
          - apps/auth/deploy.yml
          - apps/dashcam/deploy.yml
          - apps/dev-idle-reaper/deploy.yml
          - apps/download/deploy.yml
          - apps/equations/deploy.yml
          - apps/me-token-tracker/deploy.yml
          - apps/portal/deploy.yml
          - apps/tdr-bot/deploy.yml
          - apps/theater/deploy.yml
          - apps/tdr-bot/deploy.dev.yml
          - infra/design.yml
          - infra/immich.yml
          - infra/l4d2.yml
          - infra/palworld.yml
          - infra/proxy.yml
          - infra/shared.yml
          - infra/shared.dev.yml
          - infra/valheim.yml
          - .dockerignore
        model: frontier
        status: done
        commit: e2d2d6ff2b4afbfd9a30d514e2e3b3d490205743
        body: |-
          Three mechanical edits across the compose files, plus `.dockerignore`.

          1. `docker-compose.yml`: add `name: lilnas` as the first key, with a comment
             explaining it pins the project name so the same project is managed from
             `/opt/lilnas` (CI) and `/home/jeremy/lilnas` (manual) — mirror the comment
             style already in `docker-compose.dev.yml` (`name: lilnas-dev`).
          2. Every locally built service gets an `image:` line directly above its
             existing `build:` (keep `build:` — emergency `docker compose up -d --build`
             from the dev tree must still work):
             ```yaml
             image: ghcr.io/codemonkey800/lilnas-<name>:${LILNAS_TAG:-latest}
             ```
             Services and names: `auth`, `dashcam`, `dev-idle-reaper`, `download`,
             `equations`, `me-token-tracker`, `portal`, `tdr-bot`, `theater` (in
             `apps/<name>/deploy.yml`) and `l4d2` (in `infra/l4d2.yml`). Not `tdr-code`
             (its service is plain nginx), not `tdr-bot-db`.
          3. Repoint every `env_file:` that names a file T8 will encrypt to its
             gitignored decrypted sibling, `<file>.decrypted`:
             - `apps/{auth,download,equations,me-token-tracker,tdr-bot,theater}/deploy.yml`
               (`tdr-bot` has two services loading `.env.prod`) → `.env.prod.decrypted`
             - `apps/tdr-bot/deploy.dev.yml`: the `path: .env.prod` entry →
               `.env.prod.decrypted` (keep `required: true`; `.env` stays as is)
             - `infra/immich.yml` (two services) `.env` → `.env.decrypted`;
               `infra/design.yml`, `l4d2.yml`, `palworld.yml`, `proxy.yml`, `shared.yml`
               (`storage` and `turbo`), `shared.dev.yml` (two services), `valheim.yml` →
               `<name>.decrypted`
             - `docker-compose.yml` `include:` entry `env_file: ./infra/.env.nexus-code`
               → `./infra/.env.nexus-code.decrypted`
             Leave the commented-out `.env.forward-auth-truereflection` block in
             `infra/proxy.yml` alone, and leave every plain dev `.env` / `.env.dev-remote`
             reference alone.
          4. `.dockerignore` (root): add `**/.env*` and `.env.keys` so neither encrypted
             nor `.decrypted` files ever enter a build context (no Dockerfile copies an
             env file — verified at planning time; re-grep to be sure).

          Verify: `grep -rn "env_file" -A2 apps/*/deploy.yml apps/*/deploy.dev.yml infra/*.yml docker-compose.yml`
          shows no bare reference to an encrypted file; then touch empty placeholders
          at every `.decrypted` path (gitignored once T3 lands — if `.gitignore` doesn't
          ignore `*.decrypted` yet in your worktree, delete the placeholders before
          committing) and run `docker compose -f docker-compose.yml config -q` and
          `docker compose -f docker-compose.dev.yml config -q`; both must exit 0, and
          `docker compose -f docker-compose.yml config --format json | jq '.name'` must be
          `"lilnas"`. Do not run `up`.
      - id: T2
        title: Dockerfiles and base-image script point at GHCR
        after: []
        files:
          - apps/auth/Dockerfile
          - apps/download/Dockerfile
          - apps/me-token-tracker/Dockerfile
          - apps/portal/Dockerfile
          - apps/tdr-bot/Dockerfile
          - apps/theater/Dockerfile
          - infra/base-images/
        model: frontier
        status: done
        commit: 86dce72ee085af4e76c1c925567f0ffebb8cce98
        body: |-
          Repoint every `FROM lilnas-<x>` to `FROM ghcr.io/codemonkey800/lilnas-<x>:latest`:
          - apps: `auth`, `download`, `me-token-tracker`, `portal`, `tdr-bot`, `theater`
            (`monorepo-builder` and `nextjs-runtime`/`node-runtime` stages). `dashcam`,
            `equations`, `dev-idle-reaper`, `l4d2` use public bases already — leave them.
          - `infra/base-images/lilnas-monorepo-builder.Dockerfile`,
            `lilnas-node-runtime.Dockerfile`, `lilnas-nextjs-runtime.Dockerfile`,
            and the dev-only `lilnas-dev.Dockerfile` (it stays locally built but its
            `FROM lilnas-node-base` must resolve too).

          Rewrite `infra/base-images/build-base-images.sh`:
          - builds the four prod images in order (node-base → monorepo-builder →
            node-runtime → nextjs-runtime) tagged `ghcr.io/codemonkey800/lilnas-<x>:latest`,
            and keeps the short local alias tag (`lilnas-<x>`) for anything that still
            references it; then `lilnas-dev` local-only as today.
          - `--push` pushes the four GHCR tags (requires a prior `docker login ghcr.io`);
            `--tag <sha>` additionally tags `:<sha>`. Context stays the repo root.
          - Comment at the top: CI (`.github/workflows/ci.yml`, job `base-images`) is the
            normal publisher; this script is for local rebuilds and the one-time bootstrap.
          Keep `set -e`, the colour helpers, and the exit-on-failure behaviour.

          Verify with `docker build --check` is not available for every stage, so run
          `bash -n` on the script and `grep -n '^FROM' apps/*/Dockerfile infra/base-images/*.Dockerfile`
          — every `lilnas-*` base must be the GHCR name. Do not build or push images.
      - id: T3
        title: dotenvx, gitignore flip, and `lilnas secrets decrypt|verify`
        after: []
        files:
          - package.json
          - pnpm-lock.yaml
          - .gitignore
          - packages/cli/
        model: frontier
        status: done
        commit: 98fa2dbecc08212c65025ea4b0070a69b3357a3b
        body: |-
          1. Add `@dotenvx/dotenvx` `2.38.0` (exact) as a root devDependency;
             `pnpm install` so `pnpm-lock.yaml` updates and `node_modules/.bin/dotenvx`
             exists (`pnpm exec dotenvx --version` → 2.38.0).
          2. `.gitignore`: the encrypted env files become tracked, the key file and
             decrypted siblings never are. Replace the `.env` / `.env.*` block with rules
             that produce exactly this:
             - ignored: `.env`, `.env.*` everywhere **except** the committed set
               (`apps/*/.env.prod`, `infra/.env`, `infra/.env.*`), plus the existing
               `!.env.*.example`, `!.env.example`, `!.env.fish` exceptions
             - ignored again, after the negations: `.env.keys`, `**/.env.keys`,
               `*.decrypted`, `infra/.env.*.example` stays tracked, and the dev-only
               `apps/*/.env`, `apps/*/.env.dev-remote`, `apps/tdr-code/.env`, root
               `.env.turbo` stay ignored
             Prove it with `git check-ignore -v` on: `apps/tdr-bot/.env.prod` (NOT
             ignored), `infra/.env.storage` (NOT), `infra/.env` (NOT), `.env.keys`
             (ignored), `apps/tdr-bot/.env.prod.decrypted` (ignored),
             `infra/.env.storage.decrypted` (ignored), `apps/tdr-bot/.env` (ignored),
             `apps/download/.env.dev-remote` (ignored), `apps/tdr-code/.env` (ignored),
             `infra/.env.storage.example` (NOT ignored). Put that list in a comment
             beside the rules.
          3. New oclif topic `secrets` in `packages/cli` (add to `src/index.ts` and the
             `oclif.topics` map), with the shared logic in `src/utils/secrets.ts`:
             ```ts
             // src/utils/secrets.ts
             export function listEncryptedEnvFiles(root: string, trackedFiles: string[]): string[]
             //   applies the discovery rule from Context to a `git ls-files` listing; sorted
             export function decryptedPathFor(file: string): string      // `${file}.decrypted`
             export function privateKeyNameFor(file: string): string     // 'DOTENV_PRIVATE_KEY' | 'DOTENV_PRIVATE_KEY_PROD' | 'DOTENV_PRIVATE_KEY_NEXUS_CODE' …
             export function stripDotenvxHeader(decrypted: string): string
             //   drops the `#/---…/` banner lines and the DOTENV_PUBLIC_KEY line, keeps everything else verbatim
             export function isFullyEncrypted(content: string): { ok: boolean; plaintextKeys: string[] }
             //   every non-blank, non-comment line is KEY=encrypted:… (optionally quoted) or DOTENV_PUBLIC_KEY=…
             ```
             - `lilnas secrets decrypt [--keys <path>] [--dry-run]`: for each encrypted file
               runs `<root>/node_modules/.bin/dotenvx decrypt -fk <keys> -f <file> --stdout`
               (default keys `<root>/.env.keys`; error out with a clear message if the
               keys file is missing), strips the header, writes `<file>.decrypted`
               atomically (temp file + rename) with mode 0600, prints one line per file.
               Never echoes contents. Exit 1 if any file fails to decrypt.
             - `lilnas secrets verify`: runs `isFullyEncrypted` over every encrypted env
               file, prints `ok <file>` / `PLAINTEXT <file>: KEY1, KEY2`, exits 1 on any
               plaintext. This is the guard T8 and the docs rely on.
          4. Pre-commit guard: with 2.38.0, check which of `pnpm exec dotenvx ext precommit --install`
             (deprecated) or `pnpm exec dotenvx protect` installs a working hook that
             refuses to commit a plaintext `.env*` file. Try it in a throwaway git repo,
             not in the worktree. Record the working command in the `secrets` topic
             description and in the command's `--help` examples; T7 puts it in the docs.
          5. Jest for `packages/cli`: copy `packages/utils/jest.config.js` and its
             `jest`/`ts-jest`/`@types/jest` devDependency versions, add `"test": "jest"`.
             Tests in `src/utils/__tests__/secrets.spec.ts` must cover: discovery
             (includes the 15 names, excludes `.example`, `.decrypted`, `apps/x/.env`,
             `apps/tdr-code/.env`, `infra/env/.env.storage`), `decryptedPathFor`,
             `privateKeyNameFor` for `.env.prod`, `infra/.env`, `.env.nexus-code`,
             `.env.turbo`, header stripping (banner + public key removed, comments and
             blank lines kept, no trailing-newline change), and `isFullyEncrypted` for a
             clean file, a quoted `encrypted:` value, one plaintext key, and an empty
             value. `pnpm --filter @lilnas/cli test` must pass.
      - id: T4
        title: '`lilnas ci detect`: change → build/deploy plan'
        after:
          - T3
        files:
          - packages/cli/
        model: frontier
        status: done
        commit: 20e3d2b8f525e327488b33780ff30c4e0a86970e
        body: |-
          Add `lilnas ci detect --base <sha> --head <sha> [--full] [--json]` (topic
          `ci`, logic in `src/utils/ci-detect.ts`, pure and testable; the command only
          gathers inputs). It prints one JSON object the workflow feeds to its jobs:
          ```ts
          interface DetectResult {
            full: boolean            // treat as "everything changed"
            baseImages: boolean      // rebuild+push the four base images first
            images: ImageBuild[]     // app images to build+push (sorted by name)
            pull: string[]           // services whose image was rebuilt → `compose pull` then `up -d`
            up: string[]             // services to `up -d` (compose or env change)
            forceRecreate: string[]  // services to `up -d --force-recreate` (bind-mounted config changed)
            decrypt: boolean         // an encrypted env file changed
            testPackages: string[]   // 'apps/x' | 'packages/y' dirs with a "test" script (same semantics as test.yml today)
            changedFiles: string[]
          }
          interface ImageBuild { name: string; image: string; context: string; dockerfile: string; services: string[] }
          ```
          Inputs, gathered by the command: `git diff --name-only <base>..<head>` (if
          `base` is unset, all zeros, or not an ancestor, set `full: true`),
          `turbo ls --affected --output json` with `TURBO_SCM_BASE`/`TURBO_SCM_HEAD`
          set (`packages.items[].path`), and the compose files parsed with js-yaml:
          root `include:` list (strings or `{path, env_file}`), each included file's
          `services` map with `build` (string or `{context, dockerfile}`), `env_file`
          (string or `{path}` or a list), and `volumes` (string `host:container[:ro]`
          or `{source}`) — resolve every relative path against the compose file's
          directory and normalise to repo-relative.

          Rules (in this order, union of results, `full` short-circuits to: every
          image, `up` = every service, `baseImages: true`, every test package):
          - `.github/workflows/**` or `docker-compose.yml` → `full`.
          - `infra/base-images/**` except `lilnas-dev.Dockerfile` → `baseImages` and
            every image whose Dockerfile has a `FROM ghcr.io/codemonkey800/lilnas-` line.
          - An image is rebuilt when: turbo lists its `apps/<x>` package as affected,
            or any changed file is under its Dockerfile's directory, or under its build
            context when that context is not the repo root (`dev-idle-reaper`), or is
            its Dockerfile. Images are the services with both `image:` starting with
            `ghcr.io/codemonkey800/lilnas-` and a `build:`; `name` is the image suffix.
            Never `tdr-code`; never `apps/tdr-code/**` beyond its deploy.yml.
          - `apps/<x>/deploy.yml` or `infra/<name>.yml` changed → `up` for every service
            in that file. `*.dev.yml` and `docker-compose.dev.yml` → ignored.
          - A changed file that a service bind-mounts (exact path or an ancestor
            directory of a mounted path, or a mounted directory containing the file) →
            `forceRecreate` for that service.
          - A changed file that some service loads via `env_file` (match on the
            encrypted name: the compose file references `<file>.decrypted`) or that the
            root `include:` lists as `env_file` → `decrypt: true` and `up` for those
            services (every service in the included file, for the include-level one).
          - `testPackages`: dirs under `apps/` and `packages/` with a `"test"` script in
            `package.json` that have a changed file (or all of them when `full`).
          Services in `pull` are removed from `up`/`forceRecreate`; `forceRecreate`
          wins over `up`. Output sorted, deterministic.

          Tests (`src/utils/__tests__/ci-detect.spec.ts`) run the pure function over a
          fixture tree written to a temp dir (a mini root compose including two app
          deploy files, one infra file with a bind mount and an env file, one include
          with `env_file`, a `tdr-code`-style service, a `dev-idle-reaper`-style `build: .`)
          and cover: each rule above, the `full` short-circuit, `pull` removing from `up`,
          `forceRecreate` beating `up`, `*.dev.yml` ignored, `tdr-code` ignored, unknown
          base → `full`, and an unrelated file (`README.md`) → everything empty. Also
          run the real command once in the worktree, e.g.
          `pnpm lilnas ci detect --base HEAD~3 --head HEAD --json`, and sanity-check the
          output against the real compose tree (paste a trimmed sample in the result).
      - id: T5
        title: Host deploy scripts, entrypoint, and installer
        after: []
        files:
          - scripts/deploy/
        model: frontier
        status: done
        commit: 6ce525e7513a3e3e1610f6714beaa823940f856f
        body: |-
          Create `scripts/deploy/` with four files. All bash, `set -euo pipefail`,
          `bash -n` clean, no secrets echoed. Paths and users are constants at the top of
          each script (`DEPLOY_ROOT=/opt/lilnas`, `KEYS_FILE=$DEPLOY_ROOT/.env.keys`,
          `DOTENVX=@dotenvx/dotenvx@2.38.0`, `REPO=git@github.com:codemonkey800/lilnas`
          — use `https://github.com/codemonkey800/lilnas.git` so the deploy user needs no
          GitHub key).

          `decrypt-env.sh [root] [keys-file]` — the host twin of `lilnas secrets decrypt`
          (same discovery rule from Context, same header stripping, atomic 0600 write).
          Decrypts with `pnpm dlx @dotenvx/dotenvx@2.38.0 decrypt -fk "$KEYS" -f "$f" --stdout`
          (system `/usr/bin/pnpm`; set `COREPACK_ENABLE_STRICT=0` and run from `/tmp`
          or with `--dir`-free invocation if pnpm complains about the repo's
          `packageManager` field — test both ways and pick the one that works).
          Prints one `decrypted <file>` line per file; exit 1 on any failure.

          `lilnas-deploy.sh <sha> [--dry-run] [--full] [--decrypt] [--pull a,b] [--up c,d] [--force-recreate e,f]`
          — runs inside `$DEPLOY_ROOT` *after* the entrypoint has checked out `<sha>`:
          1. `decrypt-env.sh` when `--decrypt`, `--full`, or any `.decrypted` file is
             missing (first run).
          2. `docker compose config -q` — abort before touching anything if it fails.
          3. `docker compose pull <pull>` then `docker compose up -d <pull>`;
             `docker compose up -d <up>`; `docker compose up -d --force-recreate <force>`;
             `--full` → `docker compose pull --ignore-buildable` then `docker compose up -d`.
             `LILNAS_TAG` is never set here (`:latest`); it is the manual rollback lever.
          4. `docker image prune -f` (dangling only), then `docker compose ps` of the
             touched services as the final output.
          `--dry-run` prints every command it would run (prefixed `[dry-run]`) instead of
          running it, but still runs the decrypt and `config -q` steps. Log a one-line
          summary to `logger -t lilnas-deploy` at start and end.

          `lilnas-deploy-entry.sh` — the forced command. Installed by the installer to
          `/home/deploy/bin/lilnas-deploy-entry` (outside the repo, so a bad commit can't
          replace it). Reads `$SSH_ORIGINAL_COMMAND`, accepts exactly
          `deploy <40-hex-sha> [flags as above]` (reject anything else, including
          shell metacharacters; service lists match `^[a-z0-9-]+(,[a-z0-9-]+)*$`), takes
          `flock -w 600 $DEPLOY_ROOT/.deploy.lock`, then `git -C $DEPLOY_ROOT fetch --prune origin`,
          verifies the sha is reachable from some `origin/*` ref, `git checkout --detach <sha>`,
          copies `scripts/deploy/lilnas-deploy.sh` and `decrypt-env.sh` from the checkout
          to a `mktemp -d` and execs the copy (bash reads scripts lazily; never run the
          one being checked out). Also accepts `deploy --help`.

          `install-host.sh` — run once as root by Jeremy (H3), idempotent:
          creates system user `deploy` (home `/home/deploy`, shell bash, groups `docker`);
          clones the repo to `/opt/lilnas` as `deploy` if absent (else leaves it);
          copies `/home/jeremy/lilnas/.env.keys` to `/opt/lilnas/.env.keys` (deploy:deploy
          0600) — fail loudly if the source is missing; installs the entrypoint to
          `/home/deploy/bin/`; generates `/home/deploy/.ssh/ci-deploy-key` (ed25519, no
          passphrase) if absent and writes `authorized_keys` with
          `command="/home/deploy/bin/lilnas-deploy-entry",restrict <pubkey>`;
          appends `deploy` to `AllowUsers` in `/etc/ssh/sshd_config.d/10-hardening.conf`
          if missing and `sshd -t && systemctl reload sshd`; ends by printing the exact
          next steps: `gh secret set DEPLOY_SSH_KEY < /home/deploy/.ssh/ci-deploy-key`,
          then `shred -u` the private key, and the smoke test
          `ssh -i <key> deploy@lilnas.tail77e8b0.ts.net "deploy $(git rev-parse HEAD) --dry-run --full"`.

          `known_hosts` — one line, the tailnet host key from the plan's Planner notes
          (public; CI writes it to `~/.ssh/known_hosts`). Regenerate with
          `ssh-keyscan -t ed25519 127.0.0.1 | sed 's/^127.0.0.1/lilnas.tail77e8b0.ts.net/'`
          and confirm it matches.

          Test without touching prod: `bash -n` all four; create a throwaway git clone
          of the worktree under `/tmp`, generate throwaway dotenvx keys there
          (`pnpm exec dotenvx encrypt -fk .env.keys -f <copy of apps/auth/.env.example>`),
          run `decrypt-env.sh` against it (expect a `.decrypted` sibling, mode 600, no
          banner, no `DOTENV_PUBLIC_KEY`), and run `lilnas-deploy.sh <sha> --dry-run --pull auth --up prometheus --force-recreate grafana`
          with `DEPLOY_ROOT` pointed at the clone — expect the printed compose commands
          and exit 0. Simulate the entrypoint by exporting `SSH_ORIGINAL_COMMAND` and
          check it rejects `deploy abc`, `deploy <sha>; id`, and `deploy <sha> --up "a b"`.
          Clean up `/tmp` afterwards.
      - id: T6
        title: '`ci.yml`: detect → test → build images → deploy over Tailscale'
        after:
          - T4
          - T5
        files:
          - .github/workflows/
        model: frontier
        status: done
        commit: 623ebf335f288b2023444e8a691f2b9862423fa1
        body: |-
          Replace `.github/workflows/test.yml` with `.github/workflows/ci.yml` (delete
          the old file). Keep the existing test / lint-and-typecheck matrix behaviour
          (Node `25.0.0`, pnpm `10.18.2`, store cache, `pnpm install --frozen-lockfile`,
          `pnpm run build`, per-package `pnpm test` / `lint` / `type-check`, artifact
          upload, `fail-fast: false`) but key the matrices off the detect job's
          `testPackages`.

          Triggers: `pull_request` (branches main), `push` (branches main), and
          `workflow_dispatch` with boolean inputs `dry_run` (default true), `full`
          (default false), `build_base_images` (default false). Top-level
          `permissions: { contents: read, packages: write }`.

          Jobs:
          - `detect`: checkout `fetch-depth: 0`, setup pnpm/node + install, then
            `pnpm lilnas ci detect --json --base "$BASE" --head "$HEAD"` where BASE is
            `github.event.pull_request.base.sha` on PRs, `github.event.before` on push,
            and for dispatch the previous commit on the ref (`HEAD~1`); pass `--full`
            when `inputs.full` is true. `inputs.build_base_images` does not go to
            detect: it only forces the `base-images` job to run. Expose each field as
            an output (`fromJson` later). Print the plan as a step summary table.
          - `test`, `lint-and-typecheck`: as today, over `testPackages`, skipped when empty.
          - `base-images`: only on push to main or dispatch, when `baseImages` (or
            `inputs.build_base_images`); `docker/setup-buildx-action`, `docker/login-action`
            to ghcr.io with `GITHUB_TOKEN`, then `docker/build-push-action` four times in
            order (node-base → monorepo-builder → node-runtime → nextjs-runtime), each
            tagged `:latest` and `:${{ github.sha }}`, `cache-from/cache-to:
            type=registry,ref=ghcr.io/codemonkey800/lilnas-<x>:buildcache,mode=max`,
            context `.`. Base images always push `:latest` (a dispatch from a branch
            republishes them; accepted in the plan).
          - `build-images`: `needs: [detect, test, lint-and-typecheck, base-images]`,
            `if: !cancelled() && needs.detect.outputs.images != '[]' && needs.test.result != 'failure' && needs.lint-and-typecheck.result != 'failure' && needs.base-images.result != 'failure'`
            (skipped upstream jobs must not block), only on push to main or dispatch.
            Matrix over `images` (`name`, `context`, `dockerfile`, `image`), `max-parallel: 4`,
            `docker/metadata-action` tags `type=sha,format=long,prefix=` (the bare
            40-hex sha) and `type=raw,value=latest` — the deploy step always deploys
            `:latest`, so every push-to-main or dispatch build tags it (PR builds never
            reach this job). Registry cache per image as above. Labels from
            metadata-action so GHCR links the package to the repo.
          - `deploy`: `needs: [detect, build-images]`, same `!cancelled()`/no-failure
            guard, only on push to main or dispatch, `concurrency: { group: deploy, cancel-in-progress: false }`,
            `environment: production`. Steps: `tailscale/github-action@v4` with
            `oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}`, `oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}`,
            `tags: tag:ci`; write `${{ secrets.DEPLOY_SSH_KEY }}` to `~/.ssh/id_ed25519`
            (0600) and `scripts/deploy/known_hosts` to `~/.ssh/known_hosts`; build the
            command from detect outputs:
            `deploy ${{ github.sha }} [--dry-run] [--full] [--decrypt] [--pull …] [--up …] [--force-recreate …]`
            (`--dry-run` when `inputs.dry_run`; `--full` when `full` or `inputs.full`);
            skip the SSH entirely (with a summary line) when there is nothing to do;
            `ssh -o BatchMode=yes -o ConnectTimeout=30 deploy@lilnas.tail77e8b0.ts.net "$CMD"`
            and append the output to the step summary.
