        body: |-
          Finding: F7 (P1)

          From the review of phase 2 (cycle 1): a P1 finding.

          Where: apps/dev/src/lib/stack-display.ts:35

          Why: The task says 'disable what the state makes meaningless'. displayState returns env-missing for any non-running, non-busy stack, which includes `partial` (some containers running) and `stopped`. actionAvailability then turns off every action, but the backend's PREFLIGHT_ACTIONS covers only up, recreate and restart, so stop and down still work and still make sense.

          Failure scenario: tdr-bot is `partial` (one container running, another exited) and apps/tdr-bot/.env.prod.decrypted is missing. The card shows 'env missing' with Stop and Down disabled, so the running container can't be stopped or removed from the dashboard.

          Suggested fix: In actionAvailability, for env-missing keep up, restart and recreate off. Set stop to stack.services.some(isRunning) and down to stack.services.some(s => s.container) (or stack.state !== 'absent'). Add a jsdom test with a partial stack plus a missing env file that asserts Stop and Down are enabled and Up is disabled.

          How to fix it:
          1. First write a test that reproduces the failure scenario and fails on the
             current code, in the package's test style, beside the tests the file
             already has. Keep it: it is the regression test.
          2. Then change the code so it passes, and run the plan's checks.
          3. If you cannot make the scenario fail — the guard, type, or test that
             already covers it — change nothing: delete the attempted test, leave the
             tree clean, commit nothing, and report `status: done` with `commits: []`.
             Open `notes` with `Not reproduced:` and say where the behaviour is covered.
