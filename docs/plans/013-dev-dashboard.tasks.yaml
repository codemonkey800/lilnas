    tasks:
      - id: T8
        title: 'Stacks API: aggregation, actions, SSE for operations, logs and events'
        after:
          - T3
          - T4
          - T5
          - T6
        files:
          - apps/dev/src/stacks/
        status: done
        commit: 44e912405ea6d3d82eda5166de559abfc32a5502
        body: |-
          Fill `apps/dev/src/stacks/` (`StacksModule` is stubbed; import the Docker,
          Registry, Compose and Activity modules there). The results of the four
          `after` tasks define the services you compose: `DockerEngineService`
          (`listContainers`, `inspect`, `stats`, `logs`, `events`), `RegistryService`
          (`list`, `get`, `findByContainerName`), `ComposeRunnerService` (`preflight`,
          `start`, `get`, `runningFor`, `stream`, `StackBusyError`, `PreflightError`),
          `HostActivityService.get` + `estimateReap`.

          ```ts
          export type StackState = 'running' | 'partial' | 'stopped' | 'absent' | 'busy'
          export interface ServiceView extends StackService { container?: ContainerSummary; stats?: ContainerStats; reap: ReapEstimate }
          export interface StackView extends Omit<Stack, 'services'> { state: StackState; services: ServiceView[]; operation?: Operation }
          export interface Overview { stacks: StackView[]; host: { containers: number; memoryBytes: number; generatedAt: string } }
          ```
          `StacksService.overview()` matches containers to services by labels
          `com.docker.compose.project` = `stack.projectName` and `com.docker.compose.service`
          = `service.name` (fall back to the container name), inspects running ones for
          health, fetches stats for running ones in parallel (a failed stats call leaves
          `stats` undefined), asks activity for each route host with `hours = maxIdleHours`
          and calls `estimateReap`. `state`: `busy` when `runningFor(stack.id)`, else
          `running` when every service has a running container, `partial` when some,
          `stopped` when containers exist but none run, `absent` when none exist.

          Controller routes (Nest, JSON unless noted):
          - `GET /stacks` → Overview; `GET /stacks/:id` → StackView, 404 unknown.
          - `POST /stacks/:id/actions/:action` → 202 `{ operation }`; 400 unknown action;
            404 unknown stack; 409 busy (`{ operation }`); 412 preflight
            (`{ missing: string[] }`). `actor` = `x-forwarded-user` header when present.
            Only ids the registry returned can ever reach the runner.
          - `GET /operations/:opId` → Operation (404); `GET /operations/:opId/stream` →
            SSE of `OpEvent`s, completes after `done`.
          - `GET /containers/:name/logs?tail=200&timestamps=0` → SSE of `LogLine`s
            (`follow: true`), 404 unless `findByContainerName(name)` resolves — never
            stream a container that is not part of a discovered stack. Clamp `tail` to
            [1, 5000].
          - `GET /events` → SSE; on each Docker container event whose
            `com.docker.compose.project` label matches a discovered stack emit
            `{ type: 'stacks-changed', stackIds: string[] }` (debounced 500 ms); plus
            `{ type: 'keepalive' }` every 25 s. Every SSE route assigns an explicit
            incrementing `id` (see `apps/auth/src/sse/sse.controller.ts` for why).
          Tests (`__tests__/stacks.controller.spec.ts`, `__tests__/stacks.service.spec.ts`)
          with `@nestjs/testing` and in-memory fakes of the four services: each state
          derivation; container matching by labels and by name; stats failure tolerated;
          every status code above; the 404 for a foreign container name; tail clamping;
          event debouncing; SSE ids increment from 0.
