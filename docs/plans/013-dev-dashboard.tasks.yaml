      - id: T3
        title: 'DockerEngineService: containers, stats, log and event streams'
        after:
          - T1
        files:
          - apps/dev/src/docker/
        status: done
        commit: 18debbe3bf4fe0a48a4c3fb257208d9ce4ba7b88
        body: |-
          Fill `apps/dev/src/docker/` (module already stubbed as `DockerModule` in
          `docker.module.ts`; register and export the service there). Raw HTTP over the
          Unix socket with Node's `http`, like `apps/portal/src/utils/docker-engine.ts`;
          socket path from env `DOCKER_SOCKET` (default `/var/run/docker.sock`). No
          dockerode.

          ```ts
          export type ContainerState = 'created'|'running'|'paused'|'restarting'|'removing'|'exited'|'dead'
          export interface ContainerSummary {
            id: string; name: string            // name without the leading '/'
            state: ContainerState; status: string // Docker's human "Up 2 hours (healthy)"
            health?: 'starting'|'healthy'|'unhealthy'
            image: string; startedAt?: string; finishedAt?: string; exitCode?: number
            labels: Record<string, string>; tty: boolean
            ports: { ip?: string; publicPort?: number; privatePort: number }[]
          }
          export interface ContainerStats { cpuPercent: number; memoryBytes: number; memoryLimitBytes: number }
          export interface LogLine { stream: 'stdout'|'stderr'; text: string; ts?: string }
          export interface DockerEvent { action: string; id: string; name?: string; labels: Record<string,string>; time: number }
          export class DockerEngineError extends Error { statusCode: number }

          @Injectable() export class DockerEngineService {
            listContainers(labelFilters?: string[]): Promise<ContainerSummary[]>  // GET /containers/json?all=true&filters={"label":[…]}
            inspect(idOrName: string): Promise<ContainerSummary | null>           // null on 404
            stats(id: string): Promise<ContainerStats>                            // ?stream=false&one-shot=true
            logs(id: string, opts: { tail: number; timestamps: boolean; follow: boolean }): Observable<LogLine>
            events(): Observable<DockerEvent>                                     // GET /events?filters={"type":["container"]}
          }
          ```
          Details: `listContainers` reads `Names[0]`, `State`, `Status`, `Image`,
          `Labels`, `Ports`; health, startedAt, finishedAt, exitCode and tty come from
          `inspect` (`State.Health.Status`, `State.StartedAt`, `Config.Tty`), so
          `listContainers` leaves them undefined and `inspect` fills them. CPU % uses the
          `docker stats` formula from `cpu_stats`/`precpu_stats`
          (`cpu_delta / system_delta * online_cpus * 100`); memory is `usage - (stats.inactive_file ?? 0)`.
          `logs`: `GET /containers/{id}/logs?stdout=1&stderr=1&tail=&timestamps=&follow=`.
          When the container is not a TTY the body is multiplexed: 8-byte frame
          headers (`[type,0,0,0,size(BE u32)]`, type 1 stdout / 2 stderr); frames and
          lines may split across chunks, so keep a carry buffer. TTY containers send raw
          text (treat as stdout). With `timestamps`, split the leading RFC3339 stamp into
          `ts`. Unsubscribing aborts the request. `events` parses one JSON object per
          line, keeps `Actor.ID`, `Actor.Attributes.name`, `Actor.Attributes` as labels.
          Non-2xx → `DockerEngineError(statusCode, message)`.

          Tests (`__tests__/docker-engine.service.spec.ts`, node project): start a fake
          engine with `http.createServer` listening on a socket path under `os.tmpdir()`
          (this is the real socket path crossing — no mocking `http`), point the service
          at it via a constructor option or env, and cover: list + inspect mapping; 404 →
          null; 500 → DockerEngineError; stats formula on fixed numbers; a multiplexed
          log body delivered in three chunks that split a header and a line, yielding
          the right stdout/stderr lines; TTY raw mode; timestamps split; unsubscribe
          ends the request (server sees `close`); events stream parsing. Close servers
          and unlink sockets in `afterEach`.
      - id: T4
        title: 'RegistryService: discover lilnas and ~/dev stacks from compose files'
        after:
          - T1
        files:
          - apps/dev/src/registry/
        status: done
        commit: ef82d3f9c156f90a1c40a6307af8f94c1fed889c
        body: |-
          Fill `apps/dev/src/registry/` (`RegistryModule` is stubbed; register and export
          the service). Parse compose YAML with the `yaml` package — pass `{ merge: true }`
          so `<<:` merge keys (used by `apps/tdr-bot/deploy.dev.yml`) resolve. Never run
          `docker compose config`; this is file parsing only. Compose variable
          interpolation (`${X:-y}`) is left verbatim.

          ```ts
          export type StackSource = 'lilnas' | 'dev'
          export interface Route { router: string; host: string; url: string; pathPrefix?: string; gated: boolean; port?: number }
          export interface EnvFileRef { path: string; required: boolean; exists: boolean }  // absolute path
          export interface IdleReap { enabled: boolean; maxIdleHours: number; reason: 'label'|'auto'|'none' }
          export interface StackService {
            name: string; containerName: string      // container_name or `${project}-${name}-1`
            routes: Route[]; idleReap: IdleReap
            loopbackPorts: string[]                  // published ports as written, e.g. '127.0.0.1:8090:8080'
          }
          export interface Stack {
            id: string            // 'lilnas:download' | 'dev:hop-road:docker-compose.dev.yml'
            source: StackSource; name: string
            composeFile: string; projectDir: string; projectName: string
            composeArgs: string[] // lilnas: ['-p','lilnas-dev','-f',composeFile]; dev: ['-f',composeFile]
            services: StackService[]; envFiles: EnvFileRef[]
            warnings: string[]    // e.g. "route foo.lilnas.io shadows a production name" (reserved list from docs/lilnas-expose.md)
          }
          @Injectable() export class RegistryService {
            list(): Promise<Stack[]>              // cached 10 s
            get(id: string): Promise<Stack | undefined>
            findByContainerName(name: string): Promise<{ stack: Stack; service: StackService } | undefined>
          }
          ```
          Discovery:
          - lilnas: `${LILNAS_REPO}/apps/*/deploy.dev.yml`, kept only when some service
            has a `traefik.http.routers.<r>.rule` label whose `Host(\`…\`)` ends in
            `.dev.lilnas.io`. `name` = app dir, `projectName` = `lilnas-dev`,
            `projectDir` = the app dir.
          - dev: `${DEV_PROJECTS_ROOT}/*/` × `compose.yml|compose.yaml|docker-compose.yml|docker-compose.yaml|docker-compose.dev.yml|compose.dev.yml`,
            kept when any service's `networks` (list or map form) names `lilnas-proxy`.
            One stack per file (hop-road yields two). `projectName` = top-level `name:`
            else the directory basename lowercased; `name` = basename plus ` (dev)` when
            the file is a `*.dev.yml` variant and the dir has another compose file.
          - Routes from labels (list or map form): per router, `rule` → every
            `Host(\`h\`)` (and `PathPrefix(\`p\`)` if present), `middlewares` containing
            `lilnas-auth` → `gated`, `service` label or router name → `traefik.http.services.<s>.loadbalancer.server.port`.
            `url` = `https://<host><pathPrefix ?? ''>`.
          - idleReap: label `lilnas.idle-reap.enabled` `false` → disabled (`label`),
            `true` → enabled (`label`), else enabled (`auto`) when any route host ends in
            `.dev.lilnas.io`, else `none`. `maxIdleHours` from
            `lilnas.idle-reap.max-idle-hours`, default env `DEFAULT_MAX_IDLE_HOURS` (2).
          - envFiles: `env_file` as string, list of strings, or list of
            `{ path, required }` (default required true), resolved against the compose
            file's dir, de-duplicated, `exists` by `fs.stat`.
          - Unreadable or invalid YAML → skip the file and log a warning; never throw.
          Tests (`__tests__/registry.service.spec.ts`): build a fixture tree in a tmp dir
          covering: a lilnas app with a `.dev.lilnas.io` route (listed) and one with
          `*.localhost` only (not listed); a tdr-bot-like file with merge keys and
          `{path, required}` env files, one missing; a ~/dev project with two compose
          files (two stacks, correct names/projectNames); `name:` override; map-form
          labels and networks; a project without `lilnas-proxy` (excluded); gated vs
          public routes; PathPrefix router; idle-reap label false / auto / custom
          hours; container_name vs default naming; a shadowing-name warning; a broken
          YAML file skipped. Run the real scan against this checkout once in a test
          guarded by `fs.existsSync('/home/jeremy/dev')` and assert download, tdr-bot
          and theater appear.
      - id: T5
        title: 'ComposeRunnerService: allowlisted actions, preflight, operation log stream'
        after:
          - T1
        files:
          - apps/dev/src/compose/
        status: done
        commit: e7b768cf3d32b2cbd1d07a8201c3c2c095b0289d
        body: |-
          Fill `apps/dev/src/compose/` (`ComposeModule` is stubbed; register and export
          the service). Spawns the `docker` binary (env `DOCKER_BIN`, default `docker`)
          with `['compose', ...composeArgs, ...actionArgs]`, `cwd: stack.projectDir`,
          env `{ ...process.env, COMPOSE_ANSI: 'never', DOCKER_CLI_HINTS: 'false' }`,
          `stdio: ['ignore','pipe','pipe']`. The caller passes the stack shape from the
          registry (`composeArgs: string[]`, `projectDir`, `envFiles: { path, required, exists }[]`,
          `id`); this service never reads compose files itself.

          ```ts
          export type StackAction = 'up' | 'stop' | 'restart' | 'down' | 'recreate'
          export const ACTION_ARGS: Record<StackAction, string[]> = {
            up: ['up', '-d'], stop: ['stop'], restart: ['restart'],
            down: ['down'],                 // never --volumes, never --remove-orphans
            recreate: ['up', '-d', '--force-recreate'],
          }
          export interface OpLine { stream: 'stdout'|'stderr'; text: string; ts: string }
          export interface Operation {
            id: string; stackId: string; action: StackAction; actor?: string
            status: 'running'|'succeeded'|'failed'; startedAt: string; finishedAt?: string
            exitCode?: number; command: string[]; lines: OpLine[]
          }
          export type OpEvent = { type: 'line'; line: OpLine } | { type: 'done'; operation: Operation }
          export interface Preflight { ok: boolean; missing: string[] }  // required env files that do not exist
          @Injectable() export class ComposeRunnerService {
            preflight(stack): Preflight
            start(stack, action: StackAction, actor?: string): Operation  // throws StackBusyError when one is running for stackId
            get(opId: string): Operation | undefined
            runningFor(stackId: string): Operation | undefined
            stream(opId: string): Observable<OpEvent>  // replays existing lines, then live; completes after 'done'
          }
          ```
          Keep the last 50 operations in memory; cap each at 2000 lines (drop oldest,
          note the drop as a line). Kill the child after 15 minutes with `SIGTERM` and
          mark failed. Log one pino line per start and per finish with stackId, action,
          actor, exitCode. `preflight` only checks `required` env files; `start` of
          `up`/`recreate`/`restart` with a failing preflight throws `PreflightError`
          (carrying `missing`); `stop`/`down` skip the preflight.

          Tests (`__tests__/compose-runner.service.spec.ts`): write a stub `docker` shell
          script into a tmp dir (records `"$@"` and `$PWD` to a file, prints the lines in
          `$STUB_LINES`, exits `${STUB_EXIT:-0}`), point `DOCKER_BIN` at it, and cover:
          argv and cwd for each of the five actions with lilnas-style and dev-style
          composeArgs; stdout/stderr captured in order with stream tags; exit 0 →
          succeeded, exit 2 → failed with exitCode; a second `start` while running →
          StackBusyError, allowed again after it finishes; `stream` replays lines to a
          late subscriber and completes with `done`; preflight failure for `up` and the
          skip for `down`; the line cap.
      - id: T6
        title: HostActivityService + reap estimate (auth /internal/host-activity)
        after:
          - T1
        files:
          - apps/dev/src/activity/
        status: done
        commit: 0ef8f5f1cfa1b91d20f8fdcc1aee0285b0bffac9
        body: |-
          Fill `apps/dev/src/activity/` (`ActivityModule` is stubbed; register and export
          the service and the pure function). Mirrors what `apps/dev-idle-reaper/reaper.sh`
          computes, so the dashboard predicts the reaper rather than guessing.

          ```ts
          export interface HostActivity { host: string; windowHours: number; activeUsers: number; lastVisitAt: string | null }
          @Injectable() export class HostActivityService {
            // GET `${AUTH_URL}/internal/host-activity?host=<h>&hours=<n>` with a 3 s timeout.
            // Returns null on any non-200, timeout, network error or unexpected body. Cached 30 s per (host, hours).
            get(host: string, hours: number): Promise<HostActivity | null>
          }
          export interface ReapEstimate {
            enabled: boolean; maxIdleHours: number
            lastActiveAt?: string; idleHours?: number; reapsAt?: string
            activeUsers?: number; basis: 'auth' | 'container-start' | 'unknown' | 'disabled'
          }
          // startedAt: the running container's StartedAt (undefined when not running);
          // activities: one entry per routed host, null where the lookup failed.
          export function estimateReap(idleReap: { enabled: boolean; maxIdleHours: number }, startedAt: string | undefined, activities: (HostActivity | null)[], now?: Date): ReapEstimate
          ```
          Rules: disabled → `basis: 'disabled'`. Not running → `enabled` with no times.
          Any null activity, or no routes → `basis: 'unknown'` (the reaper also refuses
          to reap on an unknown). Otherwise `lastActiveAt` = max(startedAt, every
          non-null `lastVisitAt`), `idleHours` = floor((now − lastActiveAt)/3600 s),
          `reapsAt` = lastActiveAt + maxIdleHours (only when the summed `activeUsers`
          over the window is 0; with users > 0 the reaper keeps it, so `reapsAt` is
          undefined and `basis: 'auth'`), `basis` = `'auth'` when some lastVisitAt moved
          it, else `'container-start'`.

          Tests: `HostActivityService` against a real local `http.createServer` on an
          ephemeral port (200 body, 404, 500, malformed JSON, a 4 s hang → null within
          the timeout, cache hit avoids a second request); `estimateReap` table tests for
          each rule above with fixed `now`.
