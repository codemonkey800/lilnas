        status: done
        commit: 5240e47226812b34ab0d04e03a8253591af513ef
        body: |-
          Finding: F8 (P1)

          From the review of phase 2 (cycle 1): a P1 finding.

          Where: apps/dev/src/components/logs/use-container-logs.ts:133

          Why: The logs endpoint (stacks.controller.ts) asks Docker for follow=true, and Docker closes the logs body as soon as it has sent the tail of a stopped container, so the SSE response ends normally. onerror treats every end as a dropped connection, and the selector deliberately lists exited containers.

          Failure scenario: Select an exited container such as fitness-pwa-migrate-1. The tail shows, the stream ends, the viewer shows 'disconnected — reconnecting…', reopens after 2 s and replays the tail. This repeats forever, re-fetching up to 2000 lines from Docker every 2 s, and the status never settles.

          Suggested fix: Don't auto-reconnect when the selected container isn't running. Pass its running state into useContainerLogs and, when it isn't running, treat the stream's end as final: status 'ended', no reconnect line. Alternatively have the endpoint send an explicit end event the client honours. Add a LogViewer test where a non-running container's stream fails and no second EventSource opens.

          How to fix it:
          1. First write a test that reproduces the failure scenario and fails on the
             current code, in the package's test style, beside the tests the file
             already has. Keep it: it is the regression test.
          2. Then change the code so it passes, and run the plan's checks.
          3. If you cannot make the scenario fail — the guard, type, or test that
             already covers it — change nothing: delete the attempted test, leave the
             tree clean, commit nothing, and report `status: done` with `commits: []`.
             Open `notes` with `Not reproduced:` and say where the behaviour is covered.
             The runner drops the finding on your word.
