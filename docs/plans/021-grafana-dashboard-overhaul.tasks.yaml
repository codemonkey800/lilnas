      - id: T13
        title: Disk Health dashboard (SMART, btrfs device errors, temperatures)
        after:
          - T12
          - H2
        files:
          - infra/monitoring/grafana/provisioning/dashboards/json/disk-health.json
        status: todo
        body: |-
          Create `infra/monitoring/grafana/provisioning/dashboards/json/disk-health.json` (uid
          `lilnas-disk-health`, title `Disk Health`, tags `lilnas`, `storage`, `hardware`).
          The server has 8 SATA HDDs (`sda`–`sdh`, mounted at `/mnt/hdd1`–`8`) and 5 NVMe drives
          (`nvme0`–`nvme4`: `/` and `/mnt/ssd1`–`4`). A boot NVMe once dropped off the PCIe bus,
          SATA errors have been seen on `ata5`, and `sdd` has entries in its device error log.

          Data, all deployed (the push task's result lists the exact `smartctl_*` names and
          labels; use those, not memory):
          - job `smartctl`: `smartctl_device` (model, serial, interface),
            `smartctl_device_smart_status`, `smartctl_device_smartctl_exit_status`,
            `smartctl_device_temperature`, `smartctl_device_power_on_seconds`,
            `smartctl_device_error_log_count`, `smartctl_device_attribute` (HDD attributes by
            `attribute_name`), and for NVMe `smartctl_device_percentage_used`,
            `smartctl_device_media_errors`, `smartctl_device_available_spare`,
            `smartctl_device_critical_warning`, `smartctl_device_num_err_log_entries`
          - node-exporter: `node_btrfs_device_errors_total` (`device`, `type`),
            `node_btrfs_*` allocation, `node_hwmon_temp_celsius` joined to
            `node_hwmon_chip_names`, `node_nvme_info` (`state`), `node_disk_info`
          - `lilnas_storage_volume{name,mountpoint,volume}` and `node_filesystem_size_bytes{device,mountpoint}`
            to turn a device into the mount and what it holds
          - Loki: kernel SATA errors, `{service="host", identifier="kernel"} |~ "ata[0-9.]+: .*(error|failed)"`

          Panels:
          - "At a glance": drives reporting / expected (13), drives failing SMART, total
            reallocated + pending + offline-uncorrectable sectors, NVMe media errors, btrfs
            device errors, hottest drive. Green only when the bad counts are 0
          - a table, one row per drive: device, mount and contents, model, SMART status, power-on
            time, temperature, and per type the key counters (HDD: reallocated, pending,
            uncorrectable, CRC errors, error log count; NVMe: percent used, spare, media errors,
            critical warning)
          - "HDD": temperature over time, the sector counters over time, UDMA CRC errors (cable
            or port trouble), error log count
          - "NVMe": temperature (SMART and hwmon), wear percent, available spare, media errors,
            controller state
          - "btrfs": device errors by device and type, allocation (data, metadata, used versus
            size) per filesystem
          - "Other temperatures": CPU (`k10temp`) and board sensors from hwmon, labelled by
            chip name
          - "Kernel": SATA error and link-reset log lines (event-driven)

          Mask nothing in the dashboard, but keep serial numbers out of your result. Raw SMART
          attribute values differ by vendor: label panels with the attribute name and use the
          raw value field the exporter marks as raw. Rising counters matter more than totals:
          show `increase` over `$__range` beside the current value.

          Run `check-dashboards.mjs lint` and `live`, report the summary, and list anything the
          data already shows as unhealthy (it is the point of the dashboard).
