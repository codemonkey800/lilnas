          Layout: variable `server` (query `label_values(pg_up, server)`, multi-value with All).
          - "At a glance", one column per server: up, Postgres version, uptime, database size,
            connections used versus `max_connections`, deadlocks and rollbacks over `$__range`
          - "Activity": connections by state, transactions per second (commits and rollbacks),
            rows fetched/inserted/updated/deleted, cache hit ratio, temp files and bytes
          - "Size and tables": database size over time; top 10 tables by size and by dead
            tuples; last autovacuum per table. For `tdr-bot-db` the checkpointer tables are the
            ones to watch: make sure they are visible by name
          - "Locks and long transactions": locks by mode, longest running transaction, if those
            collectors are deployed
          - "WAL and checkpoints": WAL size, checkpoint and bgwriter counters. PG 14 and PG 18
            name these differently (`pg_stat_bgwriter` versus `pg_stat_checkpointer`); write the
            queries so each server shows its own (an `or` between the two), and check both
          - "Container": CPU, memory, disk I/O per database container
          - "Logs": `{service=~"tdr-bot-db|icloud-backup-db|immich-database"}` errors and fatals

