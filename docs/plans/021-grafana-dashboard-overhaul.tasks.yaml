            `stat -c %s /home/jeremy/lilnas/.env.keys` (you cannot read the file; sizes are
            enough)
          - record `git rev-parse origin/main` as the rollback sha

          Then, in order:
          1. Refresh the key backup: `install -m 0600 /home/jeremy/lilnas/.env.keys /storage/backups/lilnas-secrets/.env.keys`.
          2. `pnpm lilnas secrets decrypt --keys /home/jeremy/lilnas/.env.keys` in your
