        commit: 41b04f76d4052caa2984fb23c5cc3082c6af2669
        body: |-
          Finding: F1 (P1)

          From the review of phase 1 (cycle 1): a P1 finding.

          Where: infra/monitoring/grafana/provisioning/dashboards/json/security.json:1086

          Why: The line filter (?i)\.env|\.git|\.aws|wp-login|phpmyadmin|@fs/ runs on the whole access-log JSON line, not on the request path, so legitimate requests match (nexus-code's gitStatus tRPC calls contain '.git'). The task says to show 'the probes that did not get an error back'.

          Failure scenario: A live 24h run of panel 23's expression returns about 4,230 hits (nexus-code.lilnas.io 3689, sabnzbd 412, nexus-code-work 96). 'Probes with no error back' is always red, and a real successful .env probe is lost among thousands of nexus-code lines. Panels 22 and 24 are inflated the same way.

          Suggested fix: Anchor the probe pattern to the RequestPath field, e.g. after | json filter RequestPath with a path regex for /.env, /.git, /.aws, wp-login, phpmyadmin and /@fs/. Re-check panels 22-25 at 24h so nexus-code and sabnzbd fall out, and update docs/logging.md if its example query changes.

          How to fix it:
          1. First write a test that reproduces the failure scenario and fails on the
             current code, in the package's test style, beside the tests the file
             already has. Keep it: it is the regression test.
          2. Then change the code so it passes, and run the plan's checks.
