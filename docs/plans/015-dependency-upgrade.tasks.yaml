      - id: T12
        title: Replace content-disposition with res.attachment
        after: []
        files:
          - pnpm-lock.yaml
          - apps/download/package.json
          - apps/download/src/download/download.controller.ts
          - apps/download/src/media/__tests__/
          - apps/download/src/download/__tests__/
        status: done
        commit: 830d292cb98b7a748bd6114f1504f56d214bfe9b
        body: |-
          Decision: drop the direct `content-disposition` dependency rather than upgrade it to 3.x, which
          is ESM-only, renames the function, and changes the header for Latin-1 names. Express 5's
          `res.attachment(filename)` builds the header with its own content-disposition 1.x, so the
          header bytes stay what they are today.

          **Before editing,** record today's exact header for `A video.mp4`, `君の名は (2016).mkv` and
          `Amélie.mkv`. Use `node -e` against the current dep from `apps/download`.

          **Changes.**
          - In `apps/download/src/download/download.controller.ts`, remove the import at line 69. Replace
            both `res.setHeader('Content-Disposition', contentDisposition(source.fileName))` calls
            (~1007, ~1021) with `res.attachment(source.fileName)`.
          - Remove `content-disposition` and `@types/content-disposition` from
            `apps/download/package.json`.
          - Confirm express 5 is the `Response` in play and that its `content-disposition` resolves to
            1.x in the lockfile.

          **Content-Type.** `res.attachment` also sets Content-Type from the file extension.
          - In the object-backed branch, the explicit `setHeader('Content-Type', source.contentType)`
            comes after it and must still win. Keep that order.
          - In the disk branch, `sendFile` used to pick the type. Check that send leaves an existing
            Content-Type alone, and compare the resulting type for .mkv, .mp4, .m4v, .avi and .srt with
            today's.
          - If any type differs, keep today's type with an explicit header and test it.

          **Tests.** Update the fake response in `apps/download/src/media/__tests__/download.controller.file.test.ts`,
          and any other spec that builds one for these routes (`git grep -n "asResponse(" -- apps/download/src`):
          - give it an `attachment` that reproduces express's behaviour, or wraps express's real
            implementation
          - assert the header strings recorded above, including the RFC 5987 case at ~line 283
          - add an `Amélie.mkv` case
          - rewrite the comment at ~line 276 that explains why `content-disposition` is used

          Run your specs, then the full download suite once, alone, with `--maxWorkers=2`.
  - key: '3'
