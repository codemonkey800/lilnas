          - apps/tdr-code/package.json
          - apps/tdr-code/src/agent/
          - apps/tdr-code/src/__tests__/setup.ts
        model: strong
        status: done
        commit: abfbc197c3119d0bc1974d7e47fb9842ed098a52
        body: |-
          Bump `@agentclientprotocol/sdk` `^0.15.0` → `^2.0.0` in `apps/tdr-code`. `ClientSideConnection`
          and the `Client` interface are gone.

          **Reading.** After installing, read:
          - `node_modules/@agentclientprotocol/sdk/MIGRATION_STABLE_UNSTABLE.md`. Its
            `ClientSideConnection` row reads
            `client().onRequest(...).onNotification(...).connect(...)` or `connectWith(...)`.
          - `dist/v1/acp.d.ts`, for `client()`, `ClientApp` and `ClientConnection`.
          - `dist/core/stream.d.ts`.

          Stay on the stable root export (ACP protocol v1, which claude-agent-acp speaks). Don't use
          `./experimental/v2`.

          **Rewrite onto the client app:**
          - `src/agent/acp-client.ts`: `createAcpClient` builds a `Client` object with
            `requestPermission`, `sessionUpdate`, fs and terminal handlers. Register those as
            `onRequest` and `onNotification` handlers instead.
          - `src/agent/session-manager.service.ts`: the `connection: ClientSideConnection` fields
            (~108, ~1386), the wiring at ~1545–1560 (`ndJsonStream` + `new ClientSideConnection(() =>
            client, stream)`), and every call made through the connection (initialize, newSession,
            loadSession, prompt, cancel, mode and config setters, …).
          - `src/agent/message-bridge.ts` imports the `ContentBlock` type. Keep that import working.

          **Behaviour to keep:**
          - the `isReplaying` predicate during loadSession replay
          - the ExitPlanMode plan-approval callback
          - permission handling
          - idle timers
          - PGID bookkeeping
          - teardown on errors
          - the `initResult` capability logging

          Update the comment at ~1575 that names SDK 0.15.0.

          **Message size limit.** `ndJsonStream` now enforces `maxMessageBytes`, which defaults to
          32 MiB and throws `MessageTooLargeError`. loadSession replays the whole history as
          `session/update` notifications, and a single line can be large (big tool output, images).
          - Choose the limit deliberately and explain the choice in a comment.
          - Make sure an oversized frame shows up as a logged error and teardown, not a hang.
          - Add a test for it.

          **Tests.** Rebuild the `@agentclientprotocol/sdk` mocks around the new API in
          `src/__tests__/setup.ts` (~118–120), `src/agent/__tests__/session-manager.config.spec.ts`,
          `session-manager.service.spec.ts` and `session-manager.service.test.ts`. Keep every existing
          assertion's intent. Run the tdr-code suite with the `GIT_CONFIG_*` unset from Context.

          **Real-agent smoke (required).** Put a throwaway script in `/tmp/plan015-acp-smoke/`. Run it
          with the root `tsx`, and drive the worktree's rewritten `createAcpClient` plus the same
          SDK wiring. It must spawn the agent command tdr-code uses (the default in
          `src/db/config.repo.ts`, `@agentclientprotocol/claude-agent-acp@^0.59.0` via npx) in a
          scratch cwd, using the user's existing Claude login. Exercise and report pass/fail with
          evidence for:
          1. initialize, including the capabilities
          2. newSession
          3. a prompt whose streamed updates arrive
          4. a prompt that triggers a permission request (e.g. create a file in the scratch cwd),
             approved through the handler
          5. cancelling a long prompt mid-stream, which must end with stopReason `cancelled`
          6. loadSession of session 2 in a fresh process, where the history replays with
             `isReplaying` true

          Never touch the prod daemon: ports 8790/8791, `/tmp/tdr-code/`, `scripts/daemon.sh`, and the
          main checkout. Delete the scratch directory afterwards.
