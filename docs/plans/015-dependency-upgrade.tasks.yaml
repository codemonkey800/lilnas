      - id: T11
        title: msw 3 in tdr-code specs
        after: []
        files:
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - apps/tdr-code/package.json
          - apps/tdr-code/src/auth/__tests__/
          - apps/tdr-code/src/console/__tests__/
        status: done
        commit: 82314202d6b260dedd408f93f75a06167a3fbf4a
        body: |-
          Bump `msw` 2.14.6 → 3.0.3 (exact, devDependency) in `apps/tdr-code`. Read the v3 release notes
