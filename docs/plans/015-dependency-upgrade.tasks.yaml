      - id: T9
        title: js-yaml 5
        after: []
        files:
          - pnpm-lock.yaml
          - packages/cli/package.json
          - packages/cli/src/
        status: done
        commit: b5e0e98d698ed2826ae2ac452c91389b2dbd1279
        body: |-
          In `packages/cli`, bump `js-yaml` `^4.1.1` → `^5.5.0` and delete `@types/js-yaml`, since v5
          ships its own types. Read v5's CHANGELOG and README in full.

          **Imports.** v5 has no default export, so `import yaml from 'js-yaml'` must become named
          imports (or a namespace import, if the CHANGELOG allows it) in:
          - `src/utils/services.ts`, `src/utils/compose.ts` and `src/utils/ci-detect.ts`
          - `src/utils/__tests__/ci-cancel-superseded-runs.spec.ts`, `ci-workflow-base.spec.ts`,
            `ci-workflow-shape.spec.ts` and `compose-include-env.spec.ts`

          **Empty input.** `load('')` now throws, where v4 returned `undefined`.
          - The production call sites are `compose.ts` (`extractMountsFromFile`,
            `resolveIncludedFiles`), `services.ts` (~line 87) and `ci-detect.ts` (~line 175).
          - Each must keep its v4 behaviour for empty or whitespace-only content: no mounts, no
            includes, and so on.
          - Add a test per call site with an empty file.

          **Merge keys.** v5 turns `<<` merge keys off by default. The only YAML in the repo that uses
          them is `apps/tdr-bot/deploy.dev.yml` (lines 76 and 131).
          - Work out whether any cli parser can read that file. Check what `docker-compose.dev.yml` and
            `docker-compose.yml` include, and which files ci-detect walks.
          - If one can, enable merge keys with v5's option at that call site and add a merge-key test.
          - Either way, say in the result what you found.

          Also check every `dump`/`loadAll` use for v5 changes.

          Verify: the cli suite, then `pnpm --filter @lilnas/cli build && node packages/cli/bin/run.js --help`.
      - id: T10
