          **@testing-library/jest-dom** `^6.9.1` → `^7.0.1` in auth, dev, download and tdr-code.
          - Add `@testing-library/dom` `^10.4.2` as a devDependency of `apps/download` and `apps/dev`.
            auth and tdr-code already declare it.
          - Read the v7 changelog and fix the setup files that import it as needed:
