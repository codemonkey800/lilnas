      - id: T6
        title: '@oclif/core 5'
        after: []
        files:
          - pnpm-lock.yaml
          - packages/cli/package.json
          - packages/cli/bin/
          - packages/cli/src/
        status: done
        commit: 54b9c703c6db78aa5d6e35eb272136906142e69d
        body: |-
          Bump `@oclif/core` `^4.8.4` → `^5.1.9` in `packages/cli`. Research found that only the Node
          floor changed in a way that affects this CLI.

          Diff the v4 and v5 typings for anything this package uses: `Command`, `Flags`, `Args`,
          `this.parse`, `this.log`, `this.error` and `this.exit`. Also check the `oclif` config block
          in `packages/cli/package.json` and `packages/cli/bin/run.js`.

          `packages/cli/src/utils/__tests__/ci-detect.spec.ts` has the fixture
          `'@oclif/core': '^4'`. That is test data, so leave it alone.

          Smoke test:
          - Run `pnpm --filter @lilnas/cli build`, then `node packages/cli/bin/run.js --help`. It must
            exit 0 and list the commands.
          - Run `--help` for two subcommands, e.g. `secrets` and `mockups`.
          - Run `pnpm exec lilnas --help` from the repo root. The root depends on `@lilnas/cli`.
          - Put the outputs in the result.
          - A non-zero exit or a missing command is a defect: fix it, or list it under `defects:`.

          Run the cli suite.
      - id: T7
        title: MUI baseline screenshots of tdr-bot (no commit)
        after: []
        files: []
        status: done
        commit: fda306a08da1630a7400541cbd250d62dfe9c1c2
        body: |-
          Capture "before" screenshots of the tdr-bot admin UI on the current MUI 7 so the MUI 9 upgrade
          can be compared against them. Commit nothing.

          **Harness.** Build a reusable harness in `~/.cache/lilnas-plan-015/mui-harness/`:
          - JSON fixtures plus a README (or script) listing the exact commands.
          - The frontend calls `/api/*` (see `apps/tdr-bot/src/api/api.client.ts`). Next rewrites those
            calls to `localhost:8081`, where nothing listens.
          - So stub every `/api/**` request in the browser with `playwright-cli route ... --body=...` or
            `run-code` + `page.route`.
          - Shape the fixtures from `apps/tdr-bot/src/api/api.types.ts`, with realistic, varied data:
            several reminders across statuses, emojis with different sources, transcript messages,
            settings, and a playground state. That way tables, chips, cards and empty/edge states all
            render.

          **Boot.** `cd apps/tdr-bot && pnpm exec next dev -p <free port in 18700-18799>`. No env vars
          are needed.

          **Shots.** Save each as `/storage/files/lilnas-plan-015/mui/before/<page>-<state>-<viewport>.png`:
          - Pages `/`, `/settings`, `/transcript`, `/reminders`, `/emojis` and `/playground`, at a
            1440×900 desktop and a 390×844 mobile viewport. AppShell switches nav at `md`.
          - Plus open states: the reminder create/edit dialog (`ReminderDialog`), test-send and cancel
            dialogs, the emoji redescribe dialogs and the description editor, and a model select opened
            on settings/playground.
          - Wait for fonts and network idle before each shot.

          **Cleanup.** Stop `next dev`, run `git checkout apps/tdr-bot/next-env.d.ts`, and delete
          `apps/tdr-bot/AGENTS.md`.

          **Result.** Report the harness path, the exact reproduce steps (the MUI task re-runs them), and
          every PNG as a `https://files.lilnas.io/lilnas-plan-015/mui/before/...` URL.
  - key: '2'
    name: Majors with small code changes
    tasks:
      - id: T8
        title: jotai 3
        after: []
        files:
