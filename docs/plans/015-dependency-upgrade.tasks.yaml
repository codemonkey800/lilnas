nexus-tasks: 1
phases:
  - key: '1'
    name: Patch bumps, removals, mechanical majors
    tasks:
      - id: T1
        title: Patch and minor bumps
        after: []
        files:
          - package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - apps/tdr-bot/package.json
          - apps/theater/package.json
          - apps/equations/package.json
          - infra/base-images/lilnas-monorepo-builder.Dockerfile
          - CLAUDE.md
        status: done
        commit: 8ea9dd3eeb14989364ab4753851daa1814b5d5cd
        body: |-
          Bump, keeping each entry's specifier style:
          - root `package.json`: `@dotenvx/dotenvx` 2.38.1 → 2.38.2, `@nestjs/cli` 12.0.9 → 12.0.10,
            `turbo` 2.11.9 → 2.11.10 (all exact pins).
          - `apps/tdr-bot/package.json`: `@langchain/core` 1.2.18 → 1.2.20, `@langchain/openai`
            1.6.2 → 1.6.3 (exact).
          - `apps/equations/package.json`: `@types/supertest` `^6.0.2` → `^7.2.1`.
          - `@types/three`: `apps/theater/package.json` already says 0.186.0 but the lockfile resolves
            0.185.1 because the `overrides` entry in `pnpm-workspace.yaml` forces it. Move the override
            to `0.186.0`. Afterwards `grep -n "@types/three@" pnpm-lock.yaml` must show only 0.186.0.
          - `infra/base-images/lilnas-monorepo-builder.Dockerfile` line 4 installs `turbo@2.11.9`
            globally. Make it `turbo@2.11.10` so CI's builder matches the repo.
          - `CLAUDE.md` says "Turbo (v2.5.4)". Make it v2.11.10.

          Verify: `pnpm --filter @lilnas/theater type-check`, the equations suite (it uses supertest
          types in `__tests__/e2e/`), and the tdr-bot suite.
      - id: T2
        title: Remove unused dependencies
        after: []
        files:
          - package.json
          - pnpm-lock.yaml
          - apps/tdr-bot/package.json
          - apps/tdr-code/package.json
          - packages/cli/package.json
        status: done
        commit: 5df170662f3ef40cb1e00916be8f5e6e1c105db0
        body: |-
          Delete these. Research found that nothing imports them:
          - `apps/tdr-bot`: dependencies `openai`, `framer-motion`, `uuid`, `chokidar`, and devDependency
            `@types/cron` (cron 4 ships its own types).
          - `apps/tdr-code`: dependency `commander`, and devDependency `@types/diff` (diff ≥8 ships its
            own types).
          - `packages/cli`: dependency `dotenv` (the package uses `@dotenvx/dotenvx`, not dotenv).
          - root `package.json`: devDependency `@types/uuid`.

          Re-verify each one before deleting it. Grep the package, including `scripts/`, config files and
          specs, for `from '<name>'`, `require('<name>')`, `import('<name>')` and the bare string. For
          example, `git grep -nE "['\"](openai|framer-motion|uuid|chokidar)['\"/]" -- apps/tdr-bot`.
          Ignore `@langchain/openai`, which pulls in its own `openai`.

          If a real import turns up, keep that dependency and say so in the result.

          Verify: type-check and test tdr-bot, tdr-code and cli. tdr-bot's type-check proves cron's own
          types cover every `cron` import.
      - id: T3
        title: better-sqlite3 13
        after: []
        files:
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - apps/auth/package.json
          - apps/download/package.json
          - apps/tdr-code/package.json
        status: done
        commit: b2ec18a408be60d530a2f6f34a5977e24f0006c1
        body: |-
          In `apps/auth`, `apps/download` and `apps/tdr-code`:
          - `better-sqlite3` `^12.10.0` → `^13.0.3`
          - `@types/better-sqlite3` `^7.6.13` → `^9.6.0`

          v13 ships prebuilt N-API binaries and needs Node ≥22. No API break that touches this repo is
          known, but read its release notes anyway.

          **allowBuilds.** `pnpm-workspace.yaml`'s `allowBuilds` has `better-sqlite3: true`, and the
          comment above it says better-sqlite3 is the only package that needs its install script.
          Inspect the installed package's `scripts`. If v13 has no install or postinstall step, delete
          the entry and rewrite the comment. If it still has one, keep the entry. Either way,
          `pnpm install` must pass under strictDepBuilds.

          **Binding loads.** From each of the three app dirs, run
          `node -e "console.log(new (require('better-sqlite3'))(':memory:').prepare('select 1 as x').get())"`.

          **Next standalone tracing.** `apps/auth/next.config.js` and `apps/tdr-code/next.config.js` list
          better-sqlite3 in `serverExternalPackages`.
          - Run `pnpm --filter @lilnas/auth build` in your worktree.
          - Confirm that `apps/auth/.next/standalone/` contains better-sqlite3 and the `.node` binary it
            loads at runtime. That may be a platform package.
          - Do the same with `next build` for tdr-code, in your worktree only, never in the main checkout.

          **Docker smoke.** From the worktree root:
          - Run `docker build -f apps/auth/Dockerfile -t lilnas-auth:plan015 .`.
          - Then run `docker run --rm --entrypoint node lilnas-auth:plan015 -e "<open an in-memory db
            through the image's own node_modules>"`. Find the path inside the image first.
          - Repeat for `apps/download/Dockerfile` (tag `lilnas-download:plan015`).
          - `docker rmi` both tags afterwards.
          - If a build can't run here (missing base image, a gitignored file the Dockerfile needs), report
            exactly why instead of working around it.

          Run the auth, tdr-code and download suites. In the result, report the allowBuilds decision and
          each smoke's outcome.
          A smoke that fails is a defect: fix it in this task, or list it under `defects:` with the
          command and its error.
