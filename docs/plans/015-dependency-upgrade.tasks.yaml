          - apps/tdr-code/src/app/__tests__/setup.ts
          - apps/download/src/__tests__/setup-dom.ts
          - apps/dev/src/__tests__/setup-dom.ts
        status: done
        commit: 574dd75c842a8806c11c621c2dc7da53a720dea4
        body: |-
          **nanoid** 5.1.6 → 6.0.2 (exact) in `apps/tdr-bot` and `apps/download`.
          - v6 needs Node ≥22. Read its changelog.
          - Both Jest configs compile nanoid via their `transformIgnorePatterns` allow-list. Confirm v6's
