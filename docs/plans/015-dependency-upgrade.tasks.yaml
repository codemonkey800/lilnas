          **Rename.** `setupServer().listen({ onUnhandledRequest })` became `onUnhandledFrame`, and the
          `UnhandledRequestStrategy` type was replaced by a frame-based callback. Update:
          - the `discordOnlyUnhandledRequestStrategy` helpers in
            `src/auth/__tests__/auth-e2e.spec.ts` (~476/505), `auth.guard.spec.ts` (~669/693) and
