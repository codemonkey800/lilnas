          - apps/auth/package.json
          - apps/download/package.json
          - apps/equations/package.json
          - apps/me-token-tracker/package.json
          - apps/tdr-bot/package.json
          - apps/tdr-code/package.json
          - apps/theater/package.json
          - apps/dev/package.json
          - apps/dev/src/main.ts
          - apps/auth/src/main.ts
          - apps/download/src/main.ts
          - apps/equations/src/main.ts
          - apps/me-token-tracker/src/main.ts
          - apps/theater/src/main.ts
          - apps/tdr-bot/src/main.ts
          - apps/tdr-bot/scripts/clear-chats.ts
          - apps/tdr-bot/scripts/get-channel-messages.ts
          - apps/tdr-bot/scripts/get-guild-emojis.ts
          - apps/tdr-code/src/main.ts
          - apps/tdr-code/src/bot-main.ts
        status: done
        commit: 927fb4a21cd85bf7005f7bbef954b99685f80b9a
        body: |-
          Bump `dotenv` 17.2.3 → 18.0.8 (exact) in auth, dev, download, equations, me-token-tracker,
          tdr-bot, tdr-code and theater. dotenv 18 moves its "injecting env" line from stdout to stderr.

          Pass `quiet: true` to every `dotenv.config(...)` call:
          - the bare `dotenv.config()` in `apps/{auth,dev,download,equations,me-token-tracker,theater}/src/main.ts`
          - the three calls in `apps/tdr-bot/src/main.ts`
          - `apps/tdr-code/src/{main,bot-main}.ts`
          - the three `apps/tdr-bot/scripts/*.ts` calls, merging `quiet: true` into their existing
            `{ path }` option

          `apps/tdr-bot/src/llm/testing/live/live-env.ts` already passes `quiet: true`. Leave it alone.

          Read dotenv 18's CHANGELOG for other breaking changes and apply any that touch these call
          sites. Grep the specs for anything that asserts on dotenv's console output, for example
          `git grep -n "injecting env" -- apps`. Run the tdr-bot, tdr-code, auth, dev, equations, theater
          and download suites.
