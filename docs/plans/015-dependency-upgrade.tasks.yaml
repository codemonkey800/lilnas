          - apps/dashcam/package.json
          - apps/tdr-bot/package.json
          - apps/dashcam/src/
        status: done
        commit: 2a77e94b4bf41a90bf3ab11b105151f6efd52361
        body: |-
          Bump `jotai` 2.15.0 → 3.0.1 (exact) in `apps/dashcam` and `apps/tdr-bot`. Do not use 3.0.0,
