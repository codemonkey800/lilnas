          - the `'error'` strategy in `guild-gate.spec.ts:209` and
            `src/console/__tests__/discord-directory.service.spec.ts:25`

          Keep the semantics: an unhandled request to a Discord host fails the test, and everything else
          is bypassed. Rewrite the comment at `guild-gate.spec.ts:~56`, which cites msw 2's source.

          Check the other msw APIs these specs use (`http`, `HttpResponse`, `server.use`,
