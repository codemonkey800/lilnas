        commit: c8b3bf9088521244aae3e8abaea1ea9cf917254c
        body: |-
          Rewrite `analyzeEmojis` in `apps/tdr-bot/src/emojis/emoji-analysis.ts` so it
          scores the **raw** model output using `resolveEmojis`, which is already in that
          file:
          ```ts
          export interface EmojiAnalysis {
            counts: { dictionary: number; repaired: number; hallucinated: number; unicode: number }
            dictionary: ResolvedEmoji[]    // status 'dictionary'
            repaired: ResolvedEmoji[]      // status 'repaired' (wrong id/flag/case/name, fixed before send)
            hallucinated: ResolvedEmoji[]  // status 'dropped' (unknown, stripped before send)
            unicode: string[]
          }
          export function analyzeEmojis(raw: string, dictionaryKeys: Iterable<string>): EmojiAnalysis
          /** '5 dictionary · 1 repaired · 1 hallucinated · 2 unicode' */
          export function formatEmojiScore(counts: EmojiAnalysis['counts']): string
          ```
          - Unicode is counted as today: in text outside tokens and code, with the same
            `UNICODE_EMOJI_RE`.
          - Remove `HallucinationReason`, the `shortcode` count/list and the now-unused
            dictionary parsing. Keep `segmentCustomEmojis`/`CustomEmojiRef`, which
            `DiscordContent` uses.

          Playground UI, `apps/tdr-bot/src/app/playground/`:
          - `scoreChips(emojis)`:
            - `N dictionary` (ok).
            - `N repaired` (warn, only when >0, title = `raw → key` joined by ', ').
            - `N hallucinated` (bad, only when >0, title = raws joined by ' ').
            - `N unicode` (warn).
            - No shortcode chip.
          - `eval.ts`:
            - `EvalRow` and `summarize` replace `shortcode` with `repaired`.
            - `bestDictionaryRate` is unchanged.
          - `EvalPanel.tsx`:
            - The table's shortcode column becomes "repaired", tinted `warning.main`
              when >0, the way hallucinated is tinted `error.main`.
          - Touch `page.tsx` only if it no longer compiles.

