        commit: 89dfc0464b3a8b5dc386c66898eaef91e6a5180d
        body: |-
          `apps/tdr-bot/src/emojis/emoji-dictionary.service.ts`, in `refresh()`:
          - Keep only rows with a description.
          - Pick one row per exact name: the largest `BigInt(id)`.
          - Order the chosen rows by snowflake ascending (the existing `bySnowflake`).
          - Build:
            - `entries`: `{ [':' + row.name + ':']: row.description }`, the prompt map.
            - the chosen rows' `emojiKey(row)` list, kept in the same order.
          - Names differing only in case are separate rows and both stay.
          ```ts
          promptText(): string                    // formatEmojiDictionary(entries)
          keys(): readonly string[]                // canonical emojiKey of each chosen row, prompt order
          size(): number                           // number of chosen rows (=== keys().length)
          resolve(text: string): EmojiResolution   // resolveEmojis(text, this.keys())
          ```
          Update the JSDoc on `keys()`: "canonical tokens for the names the prompt shows".

          `formatEmojiDictionary` in `apps/tdr-bot/src/utils/prompts.ts`:
          - Same signature; keys are now `:name:`.
          - Keep the first line (`The emoji dictionary is defined in the below JSON`)
            and the last sentence (`For every message you send, you must use only the
            emojis in the dictionary above.`).
          - Between them, say: each key is an emoji's shortcode and each value says
            what it means; to send an emoji, write its shortcode exactly as the key
            shows it, colons included, for example ":EZ:" or ":peepoPooPoo:"; never
            write emoji IDs or the `<:name:id>` format, because shortcodes are
            converted automatically.
          - No ID digits may remain anywhere in the prompt text.

          Tests:
          - Update the existing service and `formatEmojiDictionary` tests to the `:name:`
            keys. Use 17+-digit IDs wherever `keys()`/`resolve` are asserted, because
            short IDs don't parse as keys.
          - Duplicate exact names collapse to the newest snowflake, for both the
            description and the key.
          - Case-variant names both stay.
          - `size() === keys().length`.
          - `resolve()` uses the cached keys and is refreshed by `refresh()`.
          - The prompt contains no 17-digit run (`/\d{17}/`) and no `<:`.
          - Update `prompts.test.ts` / `prompt-service.test.ts` only where they assert
            the old format.
