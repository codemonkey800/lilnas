      - id: T1
        title: Pure `resolveEmojis` resolver
        after: []
        files:
          - apps/tdr-bot/src/emojis/emoji-analysis.ts
          - apps/tdr-bot/src/emojis/__tests__/emoji-analysis.test.ts
        model: frontier
        status: done
        commit: 10bae3cc3e864c89e7aeaefdbcf102e472395551
        body: |-
          Add `resolveEmojis` and its types (exactly the API in Context) to
          `apps/tdr-bot/src/emojis/emoji-analysis.ts`. Add only: leave `analyzeEmojis`,
          `formatEmojiScore`, `EmojiAnalysis` and `segmentCustomEmojis` unchanged (another
          task rewrites the analyzer on top of this). No Nest/Node/discord.js imports.

          Lookup, built per call from `dictionaryKeys` (canonical `<a?:name:id>` strings;
          parse each with `CUSTOM_EMOJI_KEY_RE`, ignore keys that don't parse):
          - byKey (exact raw), byName (exact name), byLower (lower-cased name), byId.
          - Collisions in byName/byLower: the largest `BigInt(id)` wins, regardless of
            key order.

          Scan order: split the text into fenced code blocks (```…```) and inline code
          spans (`…`) first; code is copied through untouched and yields no refs. In the
          rest, use `segmentCustomEmojis` for tokens, then scan the text runs for
          shortcodes with a broadened regex that keeps `SHORTCODE_RE`'s guards:
          `/(?<![:\w]):([A-Za-z0-9_]{2,32}):(?![:\w])/g`. So `12:30:45`, `https://x`,
          `a::b` and the inside of tokens never match.

          Shortcode `:name:`:
          - byName hit → `dictionary`.
          - else byLower hit → `repaired`, fixes `['case']`.
          - else, if the name matches the old letter-first `SHORTCODE_RE` name pattern
            (`^[A-Za-z][A-Za-z0-9_]{1,31}$`) → `dropped`, key null.
          - else (digit/underscore-first unknown, e.g. `:50:`) → not a ref; text unchanged.

          Token `<a?:name:id>`:
          - byKey hit → `dictionary`.
          - else byName, else byLower → `repaired` to that key. fixes lists what changed,
            in this order: `case` (name differs only in case), `id`, `animated`.
          - else byId → `repaired`, fixes `['name']` plus `animated` if it differs.
          - else → `dropped`.

          Output `text`:
          - Replace each `dictionary`/`repaired` ref with its key and delete each
            `dropped` ref.
          - After a deletion, collapse the resulting run of spaces/tabs to a single
            space, and trim spaces/tabs left at the end of the line or the start of the
            text. Never remove a newline.
          - Resolving already-resolved text is a no-op (idempotent).

          `emojis` lists refs in input order with offsets into the input.

          Tests (in `emoji-analysis.test.ts`, new `describe('resolveEmojis')`, IDs of 17–20
          digits) must cover:
          - the incident: `:peepoCozy:` → `<:peepoCozy:781403748580589598>`, and both
            `<:peepoCozy:758403748580589598>` and `<a:peepoCozy:758403748580589598>`
            repaired with fixes `['id']` / `['id','animated']`.
          - an animated shortcode resolving to `<a:…>`.
          - a case-only repair.
          - a duplicate name, with the newest snowflake winning in either key order.
          - ID fallback after a rename.
          - unknown shortcode and unknown token dropped, with whitespace collapsed
            (`'hi :nope: there'` → `'hi there'`, `'bye :nope:'` → `'bye'`, newlines kept).
          - `:50:` kept, and `:5Head:` resolving when it is a key.
          - the `12:30:45` / URL / adjacent-colon guards.
          - code spans and fences left untouched.
          - idempotence.
          - empty text and empty dictionary.
          - offsets.
      - id: T2
        title: Name-only prompt dictionary and `EmojiDictionaryService.resolve`
        after:
