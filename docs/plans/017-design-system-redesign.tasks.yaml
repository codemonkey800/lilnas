          ```ts
          export function Spinner({ size = 16 }); export function Skeleton(props: DivProps)   // shimmer utility, caller sets the shape
          export function Progress({ value, max = 100, tone = 'accent' | 'ok' | 'bad', indeterminate, label })  // role=progressbar; fill transitions 380ms ease-standard
          export function Meter({ value, max, label, detail })   // 10px track; warn past 80%, bad past 95%
          export function ToastProvider({ children })            // bottom-centre viewport, role=status aria-live=polite, animate-rise in, fade+down out
          export function useToast(): { show(opts: { title: string; detail?: string; tone?: 'ok' | 'warn' | 'bad' | 'accent'; timeout?: number }): void }
          //   default timeout 2200ms; tone 'bad' persists until dismissed; a × dismiss button
          export function Note({ tone = 'accent' | 'ok' | 'warn' | 'bad', lead, children, icon?, onDismiss? })  // bold lead sentence then detail; role=alert for bad, status otherwise
          export function Avatar({ initials, src?, size = 24 | 32 | 40 | 64, self?: boolean, title? }); export function AvatarStack({ people, max = 3 })
          export const Tooltip = { Provider, Root, Trigger, Popup }  // 400ms delay, no delay between neighbours (Base UI Tooltip.Provider delay/closeDelay)
          export function Breadcrumb({ items: { label; href? }[] }); export function Pagination({ page, pageCount, onPageChange, label })
          export function Kbd(props)
