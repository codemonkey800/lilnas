          export const Table = { Root, Head, Body, Row, Th, Td }  // th label style, td 13.5px, row hover surface-2, selected accent-ghost; `align="right"` adds tabular-nums; `mono` on Td
          export type Column<T> = { key: string; header: string; render(row: T): ReactNode; align?: 'left' | 'right'; mono?: boolean; primary?: boolean; hideOnCard?: boolean }
          export function DataList<T>({ rows, columns, rowKey, onRowClick?, selectedKey?, empty?: ReactNode, caption?: string, cardBreakpoint = 'md' })
          //   renders ONE definition two ways: <Table> at ≥ breakpoint, and a card list below it (primary column as the card title, others as dt/dd rows, hideOnCard omitted); both in the DOM with hidden/md:block like auth does today, so tests can assert either
          export function LogViewer({ lines, follow?, onFollowChange?, height?, renderLine?, virtualize?: false }: { lines: LogLine[] … })
          export type LogLine = { id: string | number; ts?: string; level?: 'DEBUG' | 'INFO' | 'WARN' | 'ERROR'; source?: string; message: string; stderr?: boolean; fresh?: boolean }
          //   bg-bg-sunk well, mono-sm, level colours INFO accent-hi / WARN warn / ERROR bad, stderr tint, `fresh` lines get animate-rise, never when `virtualize` (consumer passes rows via renderLine); sticks to bottom while follow
          export function LogLineRow(props)   // exported so tdr-code's virtualised list can reuse the row styling without the container
          ```
          Edge cases: `DataList` with zero rows renders `empty` once (not per layout);
          numeric columns right-align in the table and stay left in cards; `onRowClick`
          rows are keyboard-activatable (`tabIndex=0`, Enter/Space); LogViewer with
          `follow` keeps the scroll pinned only while the reader is at the bottom and
          exposes `aria-live="polite"`. Tests in `src/__tests__/tier2c/`: DataList renders
          both layouts from one column set, empty once, selection class, keyboard row
          activation, `hideOnCard`; Table alignment classes; LogViewer level colours,
          stderr tint, `fresh` animation class absent under `virtualize`, follow pinning
          (scroll mocks). Run `pnpm --filter @lilnas/ui build` at the end.
