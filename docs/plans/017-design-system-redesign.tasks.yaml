          ```ts
          // icons.tsx — inline SVG, no document sprite needed
          export type IconName = /* union of auth's 25, download's 27, dev's 16, de-duplicated */
          export const ICON_NAMES: readonly IconName[]
          export function Icon({ name, size = 16, className, ...svg }: { name: IconName; size?: number } & SVGProps<SVGSVGElement>)  // aria-hidden unless aria-label given; stroke currentColor 1.6
          // marks.tsx
          export function PepeBadge({ size = 24 }): JSX  // the pepe-badge.svg paths inline, rounded-full, full-bleed #5a8d3e backdrop
          export function PepeFull({ size = 64 }): JSX   // sad-pepe.svg inline; throws in dev if size < 40
          // doorplate.tsx
          export function Doorplate({ app, href = 'https://lilnas.io' }: { app?: string; href?: string | null })
          //   app omitted → reads "lilnas.io", renders a <span>, no link (portal)
          // app-bar.tsx
          export function AppBar({ app, links, end, sheet }: { app?: string; links?: { href: string; label: string; active?: boolean; render?: ReactElement }[]; end?: ReactNode; sheet?: ReactNode })
          //   h-14 (h-12 compact) bg-surface border-b border-line px-4; links hidden below md, `sheet` slot rendered as the phone menu trigger's content
          // button.tsx
          export type ButtonVariant = 'accent' | 'outline' | 'ghost' | 'bad'; export type ButtonSize = 'sm' | 'md' | 'lg'
          export function buttonClassName({ variant, size, full, iconOnly, className })
          export function Button(props: ButtonHTMLAttributes & { variant?; size?; full?; loading?; icon?: IconName; iconEnd?: IconName; render?: ReactElement })
          //   `render` (Base UI's useRender) swaps the element, e.g. render={<Link href=… />}; loading swaps the leading icon for a Spinner-sized ring and keeps width; type="button" default
          // card.tsx
          export function Card({ variant = 'default' | 'sunk', ...div })
          export function Panel({ ...div }); export function PanelHead({ title, caption, children })
          export function Tile({ icon, title, meta, status, statusTone, href, render }: …)  // hover steps surface + border, no shadow
          // badge.tsx
          export function Badge({ tone = 'mute' | 'accent' | 'ok' | 'warn' | 'bad', live, children })  // rounded-full h-6 px-2.5 text-xs font-medium, leading dot; live → StatusDot pulse
          // status-dot.tsx
          export function StatusDot({ tone: 'ok' | 'accent' | 'warn' | 'bad' | 'idle', pulse })  // pulse only honoured for ok/accent
          // empty-state.tsx
          export function EmptyState({ title, body, action }: { title: string; body?: string; action?: ReactNode })  // PepeFull 46px opacity-55; exactly one action
          // density.tsx
          export function Density({ mode: 'comfortable' | 'compact', children })  // renders a wrapper with data-density
          ```
          Edge cases: `Button` with `loading` is `aria-busy` and `aria-disabled`, ignores
          clicks; icon-only buttons require `aria-label` (throw in dev when missing);
          `Badge` never renders as a button; `StatusDot` ignores `pulse` for warn/bad/idle.
