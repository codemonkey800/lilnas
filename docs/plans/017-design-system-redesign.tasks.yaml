          lines (truncate detail). Tests in `src/__tests__/tier2b/`: Progress tones and
          aria values; Meter thresholds; Toast shows, auto-dismisses after 2200ms (fake
          timers), `bad` persists, × dismisses; Note roles per tone and dismiss; Avatar
