        body: |-
          Finding: F3 (P1)

          From the review of phase 1 (cycle 1): a P1 finding.

          Where: packages/ui/src/combobox/combobox.tsx:341

          Why: Task: 'Escape restores the previous value'. Base UI 1.9 ComboboxInput, when the popup is not mounted, handles Escape by calling setSelectedValue(null) with reason 'escape-key'; the wrapper's Root onValueChange only ignores 'input-clear', so it commits null and fires the consumer's onValueChange(null).

