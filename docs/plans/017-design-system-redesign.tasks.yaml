    name: Library, mockup kit, mockups and their reviews
    tasks:
      - id: T1
        title: 'Scaffold `packages/ui` (@lilnas/ui): theme.css, placeholders, jest, Base UI'
        after: []
        files:
          - packages/ui/
          - pnpm-lock.yaml
        status: done
        commit: 4412240072443553b4da554a8d9cec2005ea72ed
        body: |-
          Create the shared component library package so the tier tasks can fill it in
          parallel without touching the same files. Mirror `packages/utils` for the
          build shape (tsc to `dist/`, `tsc7 --noEmit` type-check, eslint + prettier
          `lint`/`lint:fix`, jest `test` with the same `NODE_OPTIONS` string) and
          `apps/dev/jest.config.js` + `src/__tests__/setup-dom.ts` for the jsdom
          project (ts-jest, `jsx: react-jsx`, RTL + jest-dom + user-event).

          Create:
          - `package.json`: name `@lilnas/ui`, private, `"prettier": "@lilnas/prettier"`,
            `exports: { ".": { "types": "./dist/index.d.ts", "default": "./dist/index.js" }, "./theme.css": "./theme.css" }`,
            `files: ["dist", "theme.css"]`. deps: `@base-ui/react` **1.9.0** (exact),
            `@lilnas/utils workspace:*`. peerDeps `react >=19`, `react-dom >=19`.
            devDeps pinned to what `apps/dev/package.json` uses: react, react-dom,
            `@types/react`, `@types/react-dom`, jest 30.5.2, ts-jest 29.4.15,
            jest-environment-jsdom, `@testing-library/{react,jest-dom,user-event,dom}`,
            `@lilnas/eslint workspace:*`, `@lilnas/tsc7 workspace:*`, typescript 6.0.3.
            This is the ONLY phase-1 library task that adds dependencies: run
            `pnpm install` (not frozen) from the repo root and commit `pnpm-lock.yaml`.
          - `tsconfig.json`: extend `../../tsconfig.base.json`, `rootDir: src`, `outDir: dist`,
            `jsx: react-jsx`, `lib: [dom, dom.iterable, esnext]`, `module`/`moduleResolution`
            as `packages/utils/tsconfig.json`, exclude tests. Every component file that uses
            hooks or event handlers starts with `'use client'` (tsc preserves the directive).
          - `eslint.config.cjs`: `[...base, ...react]` from `@lilnas/eslint`, like `apps/dev`.
          - `theme.css`: the full `@theme` block from `docs/designs/foundations.md` ("The
            `@theme` block") verbatim — surfaces, lines, text, accent, status, fonts, shape,
            `--shadow-lift`, motion, keyframes, the deprecated `uv-*`/`ease-uv` alias block,
            `@layer base`, reduced motion — PLUS, in the same `@theme`, the named type scale
            the apps already rely on (copy `--text-h1 … --text-label` with their
            `--line-height`/`--font-weight`/`--letter-spacing` companions from
            `apps/download/src/tailwind.css`, values per foundations.md "Scale": h1 24/32 600
            -0.02em, h2 18/26 600 -0.01em, h3 15/22 600, body 14/20, sm 13/18, cap 12/16,
            label 11/16 500 0.06em, mono 13/20, mono-sm 12/20) and these `@utility` rules
            lifted from the same file: `stagger` (per-child `animation-delay` = index × 40ms
            capped at 8), `transition-press` (scale .97 on `:active`, 120ms `--ease-spring`),
            `dot-live` (the breathe ring), `skeleton` (shimmer; flat `surface-2` under
            reduced motion). Add a `[data-density="compact"]` block that sets the compact
            control height/body size custom properties the components read
            (`--control-h: 36px` → `30px`, `--control-h-sm: 30px` → `26px`, body 13px).
          - `src/index.ts`: ONE line per module, all written now:
            ```ts
            export * from './icons'
            export * from './marks'          // PepeBadge, PepeFull
            export * from './doorplate'
            export * from './app-bar'
            export * from './button'
            export * from './card'           // Card, Panel, PanelHead, Tile
            export * from './badge'
            export * from './status-dot'
            export * from './empty-state'
            export * from './input'          // Input, Textarea, Field, useFieldId, Search
            export * from './choice'         // Checkbox, Radio, RadioGroup, Switch, Segmented
            export * from './tabs'
            export * from './feedback'       // Spinner, Skeleton, Progress, Meter
            export * from './toast'
            export * from './note'
            export * from './avatar'
            export * from './tooltip'
            export * from './navigation'     // Breadcrumb, Pagination, Kbd
            export * from './table'          // Table, DataList
            export * from './log-viewer'
            export * from './dialog'
            export * from './sheet'
            export * from './menu'
            export * from './select'
            export * from './combobox'
            export * from './slider'
            export * from './density'        // DensityProvider / data-density helper
            ```
            Create each module as an empty placeholder `export {}` with a one-line comment
            naming the task that fills it (T10 icons/marks/doorplate/app-bar/button/card/
            badge/status-dot/empty-state/density; T11 input/choice/tabs; T12 feedback/toast/
            note/avatar/tooltip/navigation; T13 table/log-viewer; T14 dialog/sheet/menu/
            select; T15 combobox/slider).
          - `src/__tests__/setup-dom.ts`, `jest.config.js` (single jsdom project; map
            `@lilnas/utils/(.*)` to `../utils/src/$1`), and `src/__tests__/theme.spec.ts`
            which reads `theme.css` and asserts the accent (`#9b7bf5`), `accent-ink`
            (`#120a2a`), `line-control` (`#6f688a`) tokens, the alias block and the nine
            `--text-*` sizes are present — the check needs at least one passing test now.
          - `README.md`: what the package is, the two lines an app adds to its stylesheet
            (`@import '@lilnas/ui/theme.css'; @source '../../../node_modules/@lilnas/ui/dist';`
            — path relative to that stylesheet), the font wiring from foundations.md, the
            jest `moduleNameMapper` line (`'^@lilnas/ui$': '<rootDir>/../../packages/ui/src/index.ts'`),
            and "run `pnpm --filter @lilnas/ui build` after editing" (injected workspace
            copies resync on build).

          Verify `pnpm --filter @lilnas/ui build && lint && type-check && test` all pass and
          `ls node_modules/@lilnas/ui/dist/index.js` exists inside `apps/dev` after the build.
      - id: T2
        title: 'Test scaffolds: jest + RTL for portal, a jsdom project for tdr-bot'
        after: []
        files:
          - apps/portal/package.json
          - apps/portal/jest.config.js
          - apps/portal/src/__tests__/
          - apps/tdr-bot/package.json
          - apps/tdr-bot/jest.config.js
          - apps/tdr-bot/src/__tests__/setup-dom.ts
          - pnpm-lock.yaml
        status: done
        commit: 0e70348de3ffcd24cfeac71b4f51678f1c8e792f
        body: |-
          Give the two apps without component tests the same two-project jest setup
          `apps/dev/jest.config.js` has, so the redesign tasks can write render tests.

          portal (`apps/portal`): add scripts `test` / `test:watch` with the exact
          `NODE_OPTIONS='--experimental-vm-modules --no-warnings=ExperimentalWarning' jest`
          form the other apps use; devDeps pinned to `apps/dev/package.json`'s versions:
          jest, ts-jest, `@types/jest`, jest-environment-jsdom, `@testing-library/react`,
          `@testing-library/jest-dom`, `@testing-library/user-event`, `@testing-library/dom`.
          `jest.config.js`: copy dev's, keep only the `jsdom` project (portal has no Nest),
          `moduleNameMapper` for `src/*`, `@lilnas/utils/(.*)` → `<rootDir>/../../packages/utils/src/$1`
          and `^@lilnas/ui$` → `<rootDir>/../../packages/ui/src/index.ts`. Add
          `src/__tests__/setup-dom.ts` and one real spec `src/__tests__/smoke.spec.tsx`
          that renders `apps/portal/src/components/BrowserControl.tsx` with a `stopped`
          status and asserts the power button is present (mock `src/app/browser/actions`).

          tdr-bot (`apps/tdr-bot`): turn `jest.config.js` into dev's two-project shape — the
          existing config becomes the `node` project unchanged (keep its testMatch
          exclusions, transformIgnorePatterns, setup file, 30s timeout, coverage), plus a
          `jsdom` project matching `**/__tests__/**/*.tsx` under `src/app` and
          `src/components` with `src/__tests__/setup-dom.ts`. Add the RTL devDeps and
          `jest-environment-jsdom` (same pins). Add the `@lilnas/ui` mapper to both
          projects. Verify `pnpm --filter @lilnas/tdr-bot exec jest src/app --maxWorkers=2`
          still runs the 6 existing `.ts` specs (86 tests) and `--selectProjects jsdom`
          passes with `--passWithNoTests`.

          Run `pnpm install` (not frozen) once from the repo root and commit `pnpm-lock.yaml`.
          Do not write component tests beyond the smoke spec — later tasks own those.
      - id: T3
        title: Mockup kit on Category Standard + design-system preview project
        after: []
        files:
          - docs/designs/mockup-kit/
          - docs/designs/README.md
          - docs/features/design-system/
          - turbo.json
          - package.json
        status: done
        commit: c053583850f0cd6250c71680a443d7e663ac59a3
        body: |-
          Build the shared Pug/CSS kit every app's mockups will include, and one mockup
          project that renders the whole kit so it can be built and eyeballed.

          Read `DESIGN.md`, `docs/designs/foundations.md`, `components.md`, `motion.md`,
          `voice.md`, open `docs/designs/preview/index.html`, and read
          `docs/features/download/designs/README.md` + its `src/` (the Ultraviolet kit this
          replaces: `theme.css`, `mixins/ui.pug`, `mixins/mock.pug`, `layout/page.pug`,
          `layout/sprite.html`).

          Create `docs/designs/mockup-kit/`:
          - `theme.css` — `@import 'tailwindcss' source(none); @source '../.build/html';`
            is per-project, so the kit file holds only the `@theme` block (identical to
            foundations.md, hex values, plus the named type scale and the `stagger`,
            `transition-press`, `dot-live`, `skeleton` utilities as in T1's description) and
            the mockup-only utilities (`vp-scope`/viewport panel switching, `reveal`). A
            project's `src/theme.css` is then three lines: the two Tailwind lines and
            `@import '../../../../designs/mockup-kit/theme.css';`.
          - `ui.pug` — one mixin per component in `components.md`, named after it, each
            owning its variants end to end and ending in `&attributes(attributes)`:
            `doorplate(app)`, `appBar(view, opts)` (links, spacer, avatar; phone = doorplate
            + menu button), `btn(opts)` variants accent/outline/ghost/bad, sizes sm/md/lg,
            `loading`, icon-only; `badge(opts)` accent/ok/warn/bad/mute + `live`;
            `statusDot(tone, pulse)`; `card`, `panel(title, caption)`, `tile(opts)`,
            `mediaCard(opts)`; `input(opts)`, `textarea`, `field(label, hint, error)`,
            `search`; `checkbox`, `radio`, `switch`, `segmented(options, selected)`,
            `slider`; `select`/`menu`/`combobox` open panels; `dialog`, `sheet(side)`;
            `tabs`/`tab(label, selected, count)`; `table`/`dataList` (desktop table +
            phone card list); `toast(tone)`, `note(tone)`, `emptyState`, `skeleton`,
            `progress(pct, tone)`, `meter`, `avatar`/`avatarStack`, `tooltip`,
            `breadcrumb`, `pagination`, `logViewer`, `kbd`. Heights per `components.md`
            (36/30 comfortable/compact via a `data-density` wrapper).
          - `mock.pug` — the harness, ported from download's `mock.pug`: `mockHead`,
            `viewportToggle` (Desktop 1280 / Mobile 390), `viewportPanel`, `appFrame(view)`,
            `frameLabel`, `stateRow(label)` (a captioned row for showing one state of a
            screen), `jumpNav`, `code`, `demoFrame`. The switch stays CSS-only (`:has()`
            radios) — no behavioural JS anywhere in the kit.
          - `page.pug` — the shell: head, Google Fonts link for Geist + Geist Mono (`wght@400;500;600`
            and `400;500`), `include sprite.html`, `block content` inside a centred 1328px
            column. Projects `extends` it with `extends ../../../../../designs/mockup-kit/page.pug`
            from `src/pages/*.pug` (verified: Pug resolves relative includes outside `src/`).
          - `sprite.html` — one `<symbol>` set: union of the icons in
            `apps/auth/src/app/components/icons.tsx` (25), download's sprite (27) and dev's
            (16), de-duplicated by meaning, plus `pepe-badge` (from
            `docs/designs/assets/pepe-badge.svg`) and `pepe-full` (from
            `apps/auth/public/sad-pepe.svg`). Keep a `README.md` listing icon names.
          - `README.md` — how a project includes the kit, the mixin list, the rule that
            app-specific mixins live in the project's own `src/mixins/<app>.pug`.

          Create `docs/features/design-system/designs/` with
          `pnpm --filter @lilnas/cli build && pnpm exec lilnas mockups new design-system`,
          then replace its scaffold with `src/theme.css` (three lines), `src/pages/index.pug`
          (every kit mixin, every variant and state, both densities, a palette strip, the
          doorplate for each of the six apps) and a `README.md`. This page supersedes the
          hand-written `docs/designs/preview/index.html` as the live reference: update
          `docs/designs/README.md` to point at `docs/features/design-system/designs/index.html`
          first and keep the old preview as "the comparison-era snapshot".

          Wiring: in `turbo.json` add `docs/designs/mockup-kit/**` to the `//#mockups` and
          `//#mockups:lint` `inputs`; in root `package.json` extend `mockups:lint` and
          `mockups:lint:fix` globs to also cover `docs/designs/mockup-kit/**/*.{mjs,js,css,html,pug}`
          only if prettier handles `.pug` — it does not, so cover `css,html,js,mjs` there.
          `pnpm mockups` and `pnpm mockups:lint` must pass; commit the generated
          `index.html`. Do not touch the other `docs/features/*/designs` projects — the
          per-app tasks rebuild them.
      - id: T4
        title: 'Mockups: auth (login, home, pending, blocked, admin)'
        after:
          - T3
        files:
          - docs/features/auth/
        status: done
        commit: 5db1f9e966735e33045190c4959bd09c2f5f4f7d
        body: |-
          Design every auth screen on Category Standard with the shared kit. Read
          `docs/designs/mockup-kit/README.md`, `DESIGN.md`, `docs/designs/components.md`
          and `voice.md`, then the app: `apps/auth/src/app/**` (`login/login-form.tsx`,
          `home-client.tsx`, `pending/pending-client.tsx`, `blocked/blocked-client.tsx`,
          `admin/admin-dashboard-client.tsx`, `admin/add-person-modal.tsx`,
          `admin/edit-access-modal.tsx`, `admin/discord-links-panel.tsx`, `admin/error.tsx`,
          `components/toast.tsx`, `styles/design-tokens.css`). Scaffold with
          `pnpm --filter @lilnas/cli build && pnpm exec lilnas mockups new auth`, then make
          `src/theme.css` the three-line kit import and `src/pages/*.pug` extend the kit's
          `page.pug`; app-specific mixins go in `src/mixins/auth.pug`; copy and sample
          data in `src/data/*.mjs`. Every page shows the screen at 1280 and 390 behind the
          viewport switch, with each state as its own captioned `stateRow`.

          Pages:
          - `index.pug` — list of the pages with one-line descriptions.
          - `login.pug` — the centred 380px gate card (pepe-full ≥40px, "Sign in to
            lilnas.io", Google button `btn outline lg`); states: no target, with a target
            pill ("Sign in to continue" + host in mono), `?error=` note (`note bad`),
            redirecting (button loading + toast "Redirecting…").
          - `home.pug` — app bar with doorplate `auth.lilnas.io` and "Admin" link for
            admins; account card (avatar 64 or initials, name, email, status `badge` for
            admin/granted/pending/blocked/no access), pending notice, session details list
            (`dl`, identifiers in mono), "Your services" tile grid (`tile` with icon, name,
            subdomain mono), empty state "No services granted yet." with exactly one button.
          - `pending.pug` — waiting (status ring = `statusDot accent pulse` large, "Waiting
            for approval", "Requested 4 minutes ago", info `note`, "Check again" with
            spinning icon, Sign out) and declined (x icon, "Request access again" accent).
          - `blocked.pug` — "Access blocked", identity row, target pill, "Check again",
            toast "Still blocked".
          - `admin.pug` — stat tiles (people, granted, pending flagged `warn` when > 0),
            pending request cards with Approve (accent) / Decline (outline) / dismiss,
            People: search input + `dataList` (name/email, status badge, services badges,
            Discord chip, row actions Edit / Block as `btn bad sm`) rendered as the table at
            1280 and the card list at 390 from one definition; Discord links panel (two
            filterable lists + links table); Blocked panel; Add person `dialog` and Edit
            access `dialog` (service checkboxes, access-rules field with removable
            chips); error-boundary state ("Try again"); a destructive confirm dialog
            replacing `window.confirm` ("Block Jane Doe? They lose every service until
            you unblock them." / Block / Keep access).
          Write the real copy per `voice.md` (no "Oops", sentence case, verbs on buttons,
          the same verb in the resulting toast). `pnpm mockups && pnpm mockups:lint` must
          pass; commit the generated `*.html`.
