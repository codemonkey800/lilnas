packages:
  - 'apps/*'
  - 'packages/*'

# No dependency needs its install script to run. These were always skipped
# under pnpm 10 and work without them (prebuilt platform packages, donation
# banners, better-sqlite3 13 ships its N-API prebuilds in the package), so they
# are listed as reviewed-and-denied to satisfy strictDepBuilds.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@swc/core': false
  '@tailwindcss/oxide': false
  esbuild: false
  necord: false
  sharp: false
  unrs-resolver: false

injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

# "Latest of the latest": pnpm 12 otherwise holds back versions published in
# the last day.
minimumReleaseAge: 0

overrides:
  # Collapse @nestjs/* to a single physical copy. A DI token is the class
  # object itself, so a second copy of @nestjs/core gives modules a Reflector
  # the host app's injector never registered (UnknownDependenciesException).
  '@nestjs/common': 12.2.0
  '@nestjs/core': 12.2.0
  '@nestjs/platform-express': 12.2.0
  '@nestjs/platform-socket.io': 12.2.0
  '@nestjs/websockets': 12.2.0
