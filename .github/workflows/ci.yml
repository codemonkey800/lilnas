name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the deploy commands on the host instead of running them
        type: boolean
        default: true
      full:
        description: Plan as if everything changed (build every image, deploy every service)
        type: boolean
        default: false
      base:
        description: >-
          Commit to diff from. Empty = the last commit a successful push run
          handled on this branch, or, when there is none, the parent of the
          dispatched commit (only the tip commit's changes). For a re-deploy
          pass the sha currently deployed on the host (`git -C /opt/lilnas
          rev-parse HEAD`), or use full=true.
        type: string
        default: ''
      build_base_images:
        description: Rebuild and push the base images first
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Only pull request runs share a group, so a new push to a PR cancels the old
# run. Push and dispatch runs each get their own group: a newer push cancels
# older ones through the "Cancel superseded runs" step instead, which spares
# any run already deploying.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.12.0'
  PNPM_VERSION: '12.14.0'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/codemonkey800/lilnas

jobs:
  # Turn the diff into a plan: which packages to test, which images to build,
  # which services to pull / up / force-recreate on the host.
  detect:
    runs-on: ubuntu-latest
    # Replaces the workflow-level set: detect reads the repo, lists runs and
    # cancels superseded ones (`gh run cancel` needs actions: write).
    permissions:
      contents: read
      actions: write
    outputs:
      full: ${{ steps.plan.outputs.full }}
      baseImages: ${{ steps.plan.outputs.baseImages }}
      images: ${{ steps.plan.outputs.images }}
      pull: ${{ steps.plan.outputs.pull }}
      up: ${{ steps.plan.outputs.up }}
      forceRecreate: ${{ steps.plan.outputs.forceRecreate }}
      decrypt: ${{ steps.plan.outputs.decrypt }}
      testPackages: ${{ steps.plan.outputs.testPackages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Older push/dispatch runs on this branch are cancelled unless they are
      # already deploying (killing a deploy mid-SSH can leave a service down).
      # Pull requests use the workflow-level concurrency group instead.
      - name: Cancel superseded runs
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: scripts/ci/cancel-superseded-runs.sh "$RUN_ID" "$REF_NAME" "$EVENT_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          # A push (and a bare dispatch) diffs from the last commit a successful
          # push run handled, so this run covers every undeployed commit even
          # when earlier runs were cancelled or failed. A base that is not an
          # ancestor of HEAD (force-push) is left for `lilnas ci detect` to
          # turn into a full plan.
          BASE_RUN=""
          case "$EVENT_NAME" in
            pull_request)
              BASE="$PR_BASE"
              BASE_SOURCE="pull request base"
              ;;
            push)
              BASE=""
              read -r BASE BASE_RUN < <("$GITHUB_WORKSPACE/scripts/ci/last-deployed-sha.sh" "$REF_NAME") || true
              if [ -n "$BASE" ]; then
                BASE_SOURCE="successful push run $BASE_RUN"
              else
                echo "::warning::no successful push run on $REF_NAME; diffing from event.before"
                BASE="$PUSH_BEFORE"
                BASE_SOURCE="event.before (no successful push run)"
              fi
              ;;
            *)
              if [ -n "$DISPATCH_BASE" ]; then
                # A typo in `base` must fail here, not silently become a full
                # deploy (`lilnas ci detect` treats a non-ancestor base as full).
                BASE="$(git rev-parse --verify --end-of-options "${DISPATCH_BASE}^{commit}")" \
                  || { echo "::error::base '$DISPATCH_BASE' is not a commit in this checkout"; exit 1; }
                BASE_SOURCE="dispatch input"
              else
                BASE=""
                read -r BASE BASE_RUN < <("$GITHUB_WORKSPACE/scripts/ci/last-deployed-sha.sh" "$REF_NAME") || true
                if [ -n "$BASE" ]; then
                  BASE_SOURCE="successful push run $BASE_RUN"
                else
                  BASE="$(git rev-parse HEAD~1)"
                  BASE_SOURCE="HEAD~1 (no successful push run)"
                fi
              fi
              ;;
          esac

          TIP_ONLY=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$DISPATCH_BASE" ] && [ "$FULL" != "true" ] && [ -z "$BASE_RUN" ]; then
            TIP_ONLY=true
            echo "::warning::only the tip commit ($HEAD) was considered; to redeploy a range, dispatch with base=<deployed sha> or full=true"
          fi

          args=(--json --base "$BASE" --head "$HEAD")
          if [ "$FULL" = "true" ]; then
            args+=(--full)
          fi

          echo "lilnas ci detect ${args[*]}"
          PLAN="$(pnpm --silent lilnas ci detect "${args[@]}")"
          echo "$PLAN" | jq .

          # Only the matrix keys build-images uses; keeps every matrix value a scalar.
          echo "images=$(echo "$PLAN" | jq -c '[.images[] | {name, context, dockerfile, image}]')" >> "$GITHUB_OUTPUT"
          for field in full baseImages pull up forceRecreate decrypt testPackages; do
            echo "${field}=$(echo "$PLAN" | jq -c ".${field}")" >> "$GITHUB_OUTPUT"
          done

          {
            echo "## Plan"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| base | \`${BASE:-<unset>}\` |"
            echo "| base source | $BASE_SOURCE |"
            echo "| head | \`$HEAD\` |"
            echo "| full | $(echo "$PLAN" | jq -r '.full') |"
            echo "| baseImages | $(echo "$PLAN" | jq -r '.baseImages') |"
            echo "| images | $(echo "$PLAN" | jq -r '[.images[].name] | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| pull | $(echo "$PLAN" | jq -r '.pull | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| up | $(echo "$PLAN" | jq -r '.up | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| forceRecreate | $(echo "$PLAN" | jq -r '.forceRecreate | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| decrypt | $(echo "$PLAN" | jq -r '.decrypt') |"
            echo "| testPackages | $(echo "$PLAN" | jq -r '.testPackages | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| changedFiles | $(echo "$PLAN" | jq -r '.changedFiles | length') |"
            if [ "$TIP_ONLY" = "true" ]; then
              echo
              echo "> **Warning:** only the tip commit was considered (base = parent of head)."
              echo "> To redeploy a range, dispatch with \`-f base=<sha deployed on the host>\`"
              echo "> (\`git -C /opt/lilnas rev-parse HEAD\`) or \`-f full=true\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.testPackages != '[]' }}
    # Self-hosted Turbo remote cache (`turbo` in infra/shared.yml). Fork PRs
    # get no secrets and fall back to an uncached build.
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.testPackages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the package's workspace dependencies, not the package itself.
      # A cache hit restores dist/ without running the build script, so the
      # injected workspace copies (pnpm-workspace.yaml) never sync; re-installing does.
      - name: Build dependencies
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          pnpm turbo run build --filter="{./${PACKAGE}}^..."
          pnpm install --frozen-lockfile --offline

      - name: Run tests for ${{ matrix.package }}
        env:
          CI: true
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$PACKAGE"
          pnpm test

      # upload-artifact v4 rejects "/" in artifact names.
      - name: Artifact name
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "ARTIFACT_NAME=test-results-${PACKAGE//\//-}" >> "$GITHUB_ENV"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ matrix.package }}/coverage/
            ${{ matrix.package }}/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

  lint-and-typecheck:
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.testPackages != '[]' }}
    # Self-hosted Turbo remote cache (`turbo` in infra/shared.yml). Fork PRs
    # get no secrets and fall back to an uncached build.
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.testPackages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the package's workspace dependencies, not the package itself.
      # A cache hit restores dist/ without running the build script, so the
      # injected workspace copies (pnpm-workspace.yaml) never sync; re-installing does.
      - name: Build dependencies
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          pnpm turbo run build --filter="{./${PACKAGE}}^..."
          pnpm install --frozen-lockfile --offline

      - name: Run lint for ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$PACKAGE"
          if grep -q '"lint"' package.json; then
            pnpm lint
          else
            echo "No lint script found for $PACKAGE"
          fi

      - name: Run type-check for ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$PACKAGE"
          if grep -q '"type-check"' package.json; then
            pnpm type-check
          else
            echo "No type-check script found for $PACKAGE"
          fi

  # Base images are FROM each other via ghcr.io, so each push must land before
  # the next build starts. Always tags :latest (a dispatch from a branch
  # republishes them; accepted).
  base-images:
    runs-on: ubuntu-latest
    needs: detect
    if: >-
      ${{
        github.event_name != 'pull_request'
        && (needs.detect.outputs.baseImages == 'true' || inputs.build_base_images)
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push lilnas-node-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/base-images/lilnas-node-base.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-node-base:latest
            ${{ env.IMAGE_PREFIX }}-node-base:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-node-base:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-node-base:buildcache,mode=max

      - name: Build and push lilnas-monorepo-builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/base-images/lilnas-monorepo-builder.Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-monorepo-builder:latest
            ${{ env.IMAGE_PREFIX }}-monorepo-builder:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-monorepo-builder:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-monorepo-builder:buildcache,mode=max

      - name: Build and push lilnas-node-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/base-images/lilnas-node-runtime.Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-node-runtime:latest
            ${{ env.IMAGE_PREFIX }}-node-runtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-node-runtime:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-node-runtime:buildcache,mode=max

      - name: Build and push lilnas-nextjs-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/base-images/lilnas-nextjs-runtime.Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-nextjs-runtime:latest
            ${{ env.IMAGE_PREFIX }}-nextjs-runtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-nextjs-runtime:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-nextjs-runtime:buildcache,mode=max

  # `!cancelled()` lets this run when upstream jobs were skipped (no tests to
  # run, no base images to build); the explicit `!= 'failure'` checks are what
  # actually gate it.
  build-images:
    runs-on: ubuntu-latest
    needs: [detect, test, lint-and-typecheck, base-images]
    if: >-
      ${{
        !cancelled()
        && github.event_name != 'pull_request'
        && needs.detect.result == 'success'
        && needs.detect.outputs.images != '[]'
        && needs.test.result != 'failure'
        && needs.lint-and-typecheck.result != 'failure'
        && needs.base-images.result != 'failure'
      }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deploy step always deploys :latest, so every build here tags it
      # (PR builds never reach this job).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [detect, test, lint-and-typecheck, base-images, build-images]
    if: >-
      ${{
        !cancelled()
        && github.event_name != 'pull_request'
        && needs.detect.result == 'success'
        && needs.test.result != 'failure'
        && needs.lint-and-typecheck.result != 'failure'
        && needs.base-images.result != 'failure'
        && needs.build-images.result != 'failure'
      }}
    # Deploys queue behind each other and are never cancelled: a deploy killed
    # mid-SSH dies on the host at its next write. The workflow-level group does
    # not apply to push runs, and the detect job spares runs that reached here.
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/deploy
          sparse-checkout-cone-mode: false

      - name: Build deploy command
        id: cmd
        env:
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FULL: ${{ inputs.full }}
          DETECT_FULL: ${{ needs.detect.outputs.full }}
          DECRYPT: ${{ needs.detect.outputs.decrypt }}
          PULL: ${{ needs.detect.outputs.pull }}
          UP: ${{ needs.detect.outputs.up }}
          FORCE_RECREATE: ${{ needs.detect.outputs.forceRecreate }}
        run: |
          pull="$(echo "$PULL" | jq -r 'join(",")')"
          up="$(echo "$UP" | jq -r 'join(",")')"
          force="$(echo "$FORCE_RECREATE" | jq -r 'join(",")')"

          full=false
          if [ "$INPUT_FULL" = "true" ] || [ "$DETECT_FULL" = "true" ]; then
            full=true
          fi

          cmd="deploy $SHA"
          if [ "$DRY_RUN" = "true" ]; then
            cmd+=" --dry-run"
          fi

          if [ "$full" = "true" ]; then
            # The host script ignores service lists under --full.
            cmd+=" --full"
          else
            if [ "$DECRYPT" = "true" ]; then
              cmd+=" --decrypt"
            fi
            if [ -n "$pull" ]; then
              cmd+=" --pull $pull"
            fi
            if [ -n "$up" ]; then
              cmd+=" --up $up"
            fi
            if [ -n "$force" ]; then
              cmd+=" --force-recreate $force"
            fi
          fi

          if [ "$full" = "true" ] || [ "$DECRYPT" = "true" ] \
            || [ -n "$pull" ] || [ -n "$up" ] || [ -n "$force" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
            echo "Deploy command: $cmd"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to deploy for $SHA"
            {
              echo "## Deploy"
              echo
              echo "Nothing to deploy for \`$SHA\`; skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Connect to Tailscale
        if: ${{ steps.cmd.outputs.run == 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install SSH key
        if: ${{ steps.cmd.outputs.run == 'true' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp scripts/deploy/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        if: ${{ steps.cmd.outputs.run == 'true' }}
        env:
          CMD: ${{ steps.cmd.outputs.cmd }}
        run: |
          {
            echo "## Deploy"
            echo
            echo '```'
            echo "\$ $CMD"
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=30 \
            deploy@lilnas.tail77e8b0.ts.net "$CMD" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '```'
            echo
            echo "exit status: $status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Single required check: fails if any job failed or was cancelled (including
  # a run superseded by a newer one); skipped jobs are fine.
  summary:
    runs-on: ubuntu-latest
    needs: [detect, test, lint-and-typecheck, base-images, build-images, deploy]
    if: always()
    steps:
      - name: Summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Jobs"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi
