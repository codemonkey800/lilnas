name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the deploy commands on the host instead of running them
        type: boolean
        default: true
      full:
        description: Plan as if everything changed (build every image, deploy every service)
        type: boolean
        default: false
      base:
        description: >-
          Commit to diff from. Empty = the last commit a successful push run
          handled on this branch, or, when there is none, the parent of the
          dispatched commit (only the tip commit's changes). For a re-deploy
          pass the sha currently deployed on the host (`git -C /opt/lilnas
          rev-parse HEAD`), or use full=true.
        type: string
        default: ''
      build_base_images:
        description: Rebuild and push the base images first
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Only pull request runs share a group, so a new push to a PR cancels the old
# run. Push and dispatch runs each get their own group: a newer push cancels
# older ones through the "Cancel superseded runs" step instead, which spares
# any run already deploying.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.12.0'
  PNPM_VERSION: '12.14.0'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/codemonkey800/lilnas

jobs:
  # Turn the diff into a plan: which packages to check, which images to build
  # (and which checks gate each), which services to pull / up / force-recreate
  # on the host.
  detect:
    runs-on: ubuntu-latest
    # Replaces the workflow-level set: detect reads the repo, lists runs and
    # cancels superseded ones (`gh run cancel` needs actions: write).
    permissions:
      contents: read
      actions: write
    outputs:
      full: ${{ steps.plan.outputs.full }}
      baseImages: ${{ steps.plan.outputs.baseImages }}
      images: ${{ steps.plan.outputs.images }}
      plan: ${{ steps.plan.outputs.plan }}
      checkPackages: ${{ steps.plan.outputs.checkPackages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Older push/dispatch runs on this branch are cancelled unless they are
      # already deploying (killing a deploy mid-SSH can leave a service down).
      # Pull requests use the workflow-level concurrency group instead.
      - name: Cancel superseded runs
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: scripts/ci/cancel-superseded-runs.sh "$RUN_ID" "$REF_NAME" "$EVENT_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect changes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          # A push (and a bare dispatch) diffs from the last commit a successful
          # push run handled, so this run covers every undeployed commit even
          # when earlier runs were cancelled or failed. A base that is not an
          # ancestor of HEAD (force-push) is left for `lilnas ci detect` to
          # turn into a full plan.
          BASE_RUN=""
          case "$EVENT_NAME" in
            pull_request)
              BASE="$PR_BASE"
              BASE_SOURCE="pull request base"
              ;;
            push)
              BASE=""
              read -r BASE BASE_RUN < <("$GITHUB_WORKSPACE/scripts/ci/last-deployed-sha.sh" "$REF_NAME") || true
              if [ -n "$BASE" ]; then
                BASE_SOURCE="successful push run $BASE_RUN"
              else
                echo "::warning::no successful push run on $REF_NAME; diffing from event.before"
                BASE="$PUSH_BEFORE"
                BASE_SOURCE="event.before (no successful push run)"
              fi
              ;;
            *)
              if [ -n "$DISPATCH_BASE" ]; then
                # A typo in `base` must fail here, not silently become a full
                # deploy (`lilnas ci detect` treats a non-ancestor base as full).
                BASE="$(git rev-parse --verify --end-of-options "${DISPATCH_BASE}^{commit}")" \
                  || { echo "::error::base '$DISPATCH_BASE' is not a commit in this checkout"; exit 1; }
                BASE_SOURCE="dispatch input"
              else
                BASE=""
                read -r BASE BASE_RUN < <("$GITHUB_WORKSPACE/scripts/ci/last-deployed-sha.sh" "$REF_NAME") || true
                if [ -n "$BASE" ]; then
                  BASE_SOURCE="successful push run $BASE_RUN"
                else
                  BASE="$(git rev-parse HEAD~1)"
                  BASE_SOURCE="HEAD~1 (no successful push run)"
                fi
              fi
              ;;
          esac

          TIP_ONLY=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$DISPATCH_BASE" ] && [ "$FULL" != "true" ] && [ -z "$BASE_RUN" ]; then
            TIP_ONLY=true
            echo "::warning::only the tip commit ($HEAD) was considered; to redeploy a range, dispatch with base=<deployed sha> or full=true"
          fi

          args=(--json --base "$BASE" --head "$HEAD")
          if [ "$FULL" = "true" ]; then
            args+=(--full)
          fi

          echo "lilnas ci detect ${args[*]}"
          PLAN="$(pnpm --silent lilnas ci detect "${args[@]}")"
          echo "$PLAN" | jq .

          # Only the matrix keys build-images uses; keeps every matrix value a
          # scalar (gates become a space-separated string). The deploy job gets
          # the whole plan instead, minus the file list.
          echo "images=$(echo "$PLAN" | jq -c '[.images[] | {name, context, dockerfile, image, gates: (.gates | join(" "))}]')" >> "$GITHUB_OUTPUT"
          echo "plan=$(echo "$PLAN" | jq -c 'del(.changedFiles)')" >> "$GITHUB_OUTPUT"
          for field in full baseImages checkPackages; do
            echo "${field}=$(echo "$PLAN" | jq -c ".${field}")" >> "$GITHUB_OUTPUT"
          done

          {
            echo "## Plan"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| base | \`${BASE:-<unset>}\` |"
            echo "| base source | $BASE_SOURCE |"
            echo "| head | \`$HEAD\` |"
            echo "| full | $(echo "$PLAN" | jq -r '.full') |"
            echo "| baseImages | $(echo "$PLAN" | jq -r '.baseImages') |"
            echo "| images | $(echo "$PLAN" | jq -r '[.images[] | .name + (if (.gates | length) > 0 then "(" + (.gates | join(" ")) + ")" else "" end)] | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| pull | $(echo "$PLAN" | jq -r '.pull | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| up | $(echo "$PLAN" | jq -r '.up | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| forceRecreate | $(echo "$PLAN" | jq -r '.forceRecreate | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| decrypt | $(echo "$PLAN" | jq -r '.decrypt') |"
            echo "| decryptServices | $(echo "$PLAN" | jq -r '.decryptServices | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| checkPackages | $(echo "$PLAN" | jq -r '.checkPackages | join(", ") | if . == "" then "(none)" else . end') |"
            echo "| changedFiles | $(echo "$PLAN" | jq -r '.changedFiles | length') |"
            if [ "$TIP_ONLY" = "true" ]; then
              echo
              echo "> **Warning:** only the tip commit was considered (base = parent of head)."
              echo "> To redeploy a range, dispatch with \`-f base=<sha deployed on the host>\`"
              echo "> (\`git -C /opt/lilnas rev-parse HEAD\`) or \`-f full=true\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # One matrix leg per package: tests, lint and type-check in order. The last
  # step uploads a pass marker only when every earlier step passed; the image
  # and deploy gates read those markers, so a red package holds back only the
  # images and services that depend on it.
  check:
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.checkPackages != '[]' }}
    # Self-hosted Turbo remote cache (`turbo` in infra/shared.yml). Fork PRs
    # get no secrets and fall back to an uncached build.
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.checkPackages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package and its workspace dependencies. Building the package itself
      # pushes it to the remote cache, where the build-images Docker build for
      # the same commit picks it up instead of compiling. A cache hit restores
      # dist/ without running the build script, so the injected workspace
      # copies (pnpm-workspace.yaml) never sync; re-installing does.
      - name: Build dependencies
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          pnpm turbo run build --filter="{./${PACKAGE}}..."
          pnpm install --frozen-lockfile --offline

      # upload-artifact v4+ rejects "/" in artifact names.
      - name: Artifact name
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "SLUG=${PACKAGE//\//-}" >> "$GITHUB_ENV"

      - name: Run tests for ${{ matrix.package }}
        env:
          CI: true
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$PACKAGE"
          if grep -q '"test"' package.json; then
            pnpm test
          else
            echo "No test script found for $PACKAGE"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ env.SLUG }}
          path: |
            ${{ matrix.package }}/coverage/
            ${{ matrix.package }}/test-results.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Run lint for ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$PACKAGE"
          if grep -q '"lint"' package.json; then
            pnpm lint
          else
            echo "No lint script found for $PACKAGE"
          fi

      - name: Run type-check for ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$PACKAGE"
          if grep -q '"type-check"' package.json; then
            pnpm type-check
          else
            echo "No type-check script found for $PACKAGE"
          fi

      # Default `if:` (success()): only reached when every step above passed.
      - name: Write pass marker
        run: |
          mkdir -p "$RUNNER_TEMP/markers"
          : > "$RUNNER_TEMP/markers/pass-$SLUG"

      - name: Upload pass marker
        uses: actions/upload-artifact@v7
        with:
          name: pass-${{ env.SLUG }}
          path: ${{ runner.temp }}/markers/pass-${{ env.SLUG }}
          retention-days: 1

  # Base images are FROM each other via ghcr.io, so each push must land before
  # the next build starts. Always tags :latest (a dispatch from a branch
  # republishes them; accepted).
  base-images:
    runs-on: ubuntu-latest
    needs: detect
    if: >-
      ${{
        github.event_name != 'pull_request'
        && (needs.detect.outputs.baseImages == 'true' || inputs.build_base_images)
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Runners are ephemeral; the post-step `buildx rm` cost 24-94 s per job
          cleanup: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push lilnas-node-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/base-images/lilnas-node-base.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-node-base:latest
            ${{ env.IMAGE_PREFIX }}-node-base:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-node-base:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-node-base:buildcache,mode=max

      - name: Build and push lilnas-monorepo-builder
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/base-images/lilnas-monorepo-builder.Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-monorepo-builder:latest
            ${{ env.IMAGE_PREFIX }}-monorepo-builder:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-monorepo-builder:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-monorepo-builder:buildcache,mode=max

      - name: Build and push lilnas-node-runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/base-images/lilnas-node-runtime.Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-node-runtime:latest
            ${{ env.IMAGE_PREFIX }}-node-runtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-node-runtime:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-node-runtime:buildcache,mode=max

      - name: Build and push lilnas-nextjs-runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/base-images/lilnas-nextjs-runtime.Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-nextjs-runtime:latest
            ${{ env.IMAGE_PREFIX }}-nextjs-runtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-nextjs-runtime:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-nextjs-runtime:buildcache,mode=max

  # `!cancelled()` lets this run when upstream jobs were skipped (no packages to
  # check, no base images to build). It does not look at the `check` result:
  # each leg gates itself on the pass markers of its own check packages, so a
  # red package holds back only the images that depend on it.
  build-images:
    runs-on: ubuntu-latest
    needs: [detect, check, base-images]
    if: >-
      ${{
        !cancelled()
        && github.event_name != 'pull_request'
        && needs.detect.result == 'success'
        && needs.detect.outputs.images != '[]'
        && needs.base-images.result != 'failure'
      }}
    strategy:
      fail-fast: false
      # The repo is public, so the job concurrency limit is 20
      max-parallel: 12
      matrix:
        include: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pass markers go outside the checkout, which is the docker build context.
      - name: Download check markers
        uses: actions/download-artifact@v8
        with:
          pattern: pass-*
          path: ${{ runner.temp }}/markers
          merge-multiple: true

      - name: Check gates
        id: gates
        env:
          GATES: ${{ matrix.gates }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          # GATES is a space-separated list of package dirs; split it on purpose.
          # shellcheck disable=SC2086
          missing="$(scripts/ci/gate-check.sh "$RUNNER_TEMP/markers" $GATES)"
          if [ -z "$missing" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            missing="$(echo "$missing" | paste -sd, - | sed 's/,/, /g')"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$IMAGE_NAME skipped: checks failed or missing for $missing"
            {
              echo "## Held back"
              echo
              echo "- \`$IMAGE_NAME\`: checks failed or missing for $missing"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        if: steps.gates.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          # Runners are ephemeral; the post-step `buildx rm` cost 24-94 s per job
          cleanup: false

      - name: Login to GHCR
        if: steps.gates.outputs.ok == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deploy step always deploys :latest, so every build here tags it
      # (PR builds never reach this job).
      - name: Image metadata
        id: meta
        if: steps.gates.outputs.ok == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push ${{ matrix.name }}
        if: steps.gates.outputs.ok == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache,mode=max
          # Turbo remote cache for the Dockerfile's `pnpm build`, as optional
          # BuildKit secrets (ids match the env names the RUN mounts).
          secrets: |
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_REMOTE_CACHE_SIGNATURE_KEY=${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      # Tells the deploy job this image is on GHCR.
      - name: Write built marker
        if: steps.gates.outputs.ok == 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/markers"
          : > "$RUNNER_TEMP/markers/built-$IMAGE_NAME"

      - name: Upload built marker
        if: steps.gates.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.name }}
          path: ${{ runner.temp }}/markers/built-${{ matrix.name }}
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [detect, check, base-images, build-images]
    # No check / build-images result here: deploy-command.sh drops every
    # service whose pass or built marker is missing, so a failed leg holds back
    # only its own services.
    if: >-
      ${{
        !cancelled()
        && github.event_name != 'pull_request'
        && needs.detect.result == 'success'
        && needs.base-images.result != 'failure'
      }}
    # Deploys queue behind each other and are never cancelled: a deploy killed
    # mid-SSH dies on the host at its next write. The workflow-level group does
    # not apply to push runs, and the detect job spares runs that reached here.
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/deploy
            scripts/ci
          sparse-checkout-cone-mode: false

      - name: Download markers
        uses: actions/download-artifact@v8
        with:
          pattern: '{pass,built}-*'
          path: ${{ runner.temp }}/markers
          merge-multiple: true

      - name: Build deploy command
        id: cmd
        env:
          PLAN: ${{ needs.detect.outputs.plan }}
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          cmd="$(scripts/ci/deploy-command.sh "$RUNNER_TEMP/markers")"

          if [ -n "$cmd" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
            echo "Deploy command: $cmd"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to deploy for $SHA"
            {
              echo "## Deploy"
              echo
              echo "Nothing to deploy for \`$SHA\`; skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Connect to Tailscale
        if: ${{ steps.cmd.outputs.run == 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install SSH key
        if: ${{ steps.cmd.outputs.run == 'true' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp scripts/deploy/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        if: ${{ steps.cmd.outputs.run == 'true' }}
        env:
          CMD: ${{ steps.cmd.outputs.cmd }}
        run: |
          {
            echo "## Deploy"
            echo
            echo '```'
            echo "\$ $CMD"
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=30 \
            deploy@lilnas.tail77e8b0.ts.net "$CMD" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '```'
            echo
            echo "exit status: $status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Single required check: fails if any job failed or was cancelled (including
  # a run superseded by a newer one); skipped jobs are fine.
  summary:
    runs-on: ubuntu-latest
    needs: [detect, check, base-images, build-images, deploy]
    if: always()
    steps:
      - name: Summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Jobs"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi
